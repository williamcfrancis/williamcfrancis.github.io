page:
  title: Personal Lab
  subtitle: Posts, games, and a rotating photo wall.
  description: A quieter corner for experiments that do not fit on the landing page.

nav:
  label: Personal
  items:
    - name: Posts
      id: posts
      url: "/personal/#posts"
    - name: Games
      id: games
      url: "/personal/#games"
    - name: Photo Gallery
      id: gallery
      url: "/personal/#gallery"

sections:
  - section:
      name: Posts
      id: posts
      enable: true
      weight: 1
      template: personal/posts.html
    hero:
      title: Long-form posts & field notes
      description: Essays, teardown notes, and travel journals that pair robotics work with photography.
      cta:
        label: Visit the archive
        url: "/posts/"
      emptyState: I am drafting a few new posts—check back soon.
    highlights:
      - title: CAD2CAV Field Notes
        summary: Reflections on bridging CAD and autonomy while building the CAD2CAV simulation harness.
        image: images/posts/cad2cav/cad2cav-overview.png
        tags: ["systems", "simulation"]
      - title: F1TENTH Race Journal
        summary: Capturing the chaos of autonomous kart race weekends with setup sheets, telemetry, and plenty of photos.
        image: images/posts/f1tenth-lab4/f1tenth-lab4.png
        tags: ["f1tenth", "motorsport"]
      - title: Travel Letters
        summary: Lightweight travelogues from field research trips that double as photography practice.
        image: images/posts/hong-kong/DSC00851.jpg
        tags: ["photography", "writing"]

  - section:
      name: Games
      id: games
      enable: true
      weight: 2
      template: personal/games.html
    intro:
      title: Games & sandboxes
      description: Playable experiments I lean on to unwind—part sim, part sketchbook, all personal.
    games:
      - title: Paddock Sprint
        status: Prototype
        genre: Top-down racer
        summary: A lightweight karting playground used to rehearse F1TENTH race craft, controller tuning, and pit stop choreography.
        image: images/posts/f1tenth-lab6/f1tenth-lab6-cover.png
        tags: ["unity", "autonomy"]
      - title: Echo Drift
        status: Playtest build
        genre: SLAM puzzle
        summary: A minimal neon maze that visualizes particle-filter localization as a game of hide and seek with drifting landmarks.
        image: images/posts/467ProjSlam/467-task5-map.png
        tags: ["slam", "visualization"]
        link:
          label: View the source
          url: "https://github.com/williamcfrancis/Particle-Filter-Based-SLAM-for-Humanoid-Robot"
      - title: Photon Sketch
        status: Weekend build
        genre: Sandbox
        summary: A CUDA path-tracing toybox where lighting setups can be posed like table-top dioramas.
        image: images/posts/565-cuda-path-tracer/cornell.2021-10-09_18-44-15z.5000samp.png
        tags: ["cuda", "rendering"]

  - section:
      name: Photo Gallery
      id: gallery
      enable: true
      weight: 3
      template: personal/gallery.html
    intro:
      title: Photo Gallery
      description: A rotating feed of images from research trips, residencies, and long walks with a camera.
    photos:
      - title: Ann Arbor Evenings
        location: Ann Arbor, Michigan
        image: images/posts/ann-arbor/RZH4586A190807.jpg
        caption: Late-summer light bouncing off the Huron River during a robotics test campaign.
      - title: Victoria Harbour
        location: Hong Kong
        image: images/posts/hong-kong/DSC00851.jpg
        caption: A blue hour frame from a harbor ferry ride between field tests.
      - title: Giant's Causeway
        location: County Antrim, Ireland
        image: images/posts/ireland/RZH403524.jpg
        caption: Early-morning basalt columns, shot before the tourist buses arrived.
      - title: London Laundry Day
        location: London, United Kingdom
        image: images/posts/london/_RZH3468postruanzh.jpg
        caption: Misty streets near Shoreditch while scouting textures for a rendering study.
      - title: Phuket Tones
        location: Phuket, Thailand
        image: images/posts/phuket-journal/RZH6667post.jpg
        caption: A storm rolling over the bay minutes before a dive briefing.
      - title: Old San Juan
        location: San Juan, Puerto Rico
        image: images/posts/puerto-rico-journal/PR-cover.jpg
        caption: Cobblestone blues and narrow shadows from a quick photo walk.

