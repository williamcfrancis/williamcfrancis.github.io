sections:
  - section:
      name: Posts
      id: posts
      enable: true
      weight: 1
      template: personal/posts.html
    hero:
      title: Posts & field notes
      description: Field logs and thoughts that are worth sharing.
      cta:
        label: Visit the archive
        url: "/posts/"
      emptyState: I’m drafting a few new posts—check back soon.
    highlights: []

  - section:
      name: Games
      id: games
      enable: true
      weight: 2
      template: personal/games.html
    intro:
      title: Games & sandboxes
      description: Playable experiments I tinker with after hours.
    games:
      - title: Pulse Snare
        genre: Reflex arcade
        summary: "An original one-more-run loop: rotate a magnetic arc and catch pulses blasting out from the core before they break through."
        tags: ["browser", "arcade", "addictive"]
        link:
          label: Play Pulse Snare
          url: "/games/pulse_snare/"
        image: "/games/pulse_snare/pulse_snare.svg"
      - title: Lily Leap
        genre: Chill arcade
        summary: "Drift across cozy lily pads, snack on sparkles, and vibe with chatty squishmallows."
        tags: ["browser", "casual", "sound-on"]
        link:
          label: Play Lily Leap
          url: "/games/lily_leap/"
        image: "/games/game_placeholder.svg"
      - title: Glow Hop
        genre: Audio-physics
        summary: "The world is silent and intangible. Use sound to create solid matter and reach the portal."
        tags: ["browser", "platformer", "sound-on"]
        link:
          label: Play Glow Hop
          url: "/games/glow_hop/"
        image: "/games/game_placeholder.svg"
      - title: Lexical Hazard
        genre: Word survival
        summary: "Type the falling words to neutralize them. Each word triggers its meaning—FAST speeds time, BLIND dims the lights."
        tags: ["browser", "typing", "sound-on"]
        link:
          label: Play Lexical Hazard
          url: "/games/lexical_hazard/"
        image: "/games/game_placeholder.svg"
      - title: Lyrically Lost
        genre: Lyric trivia
        summary: "Hear translated lyric snippets and race to identify the original songs across Hindi, Spanish, and English catalogs."
        tags: ["browser", "music", "sound-on"]
        link:
          label: Play Lyrically Lost
          url: "/games/lyrically_lost/"
        image: "/games/lyrically_lost/lyrically_lost.svg"
      - title: Abyss
        genre: Deep-dive survival
        summary: "Dive into the deep blue. Manage oxygen, dash to destroy mines, and descend through biomes to the abyssal rift."
        tags: ["browser", "3D", "sound-on"]
        link:
          label: Play Abyss
          url: "/games/abyss/"
        image: "/games/game_placeholder.svg"
      - title: Algorithm Simulator
        genre: Dark simulation
        summary: "Maximize engagement and ad revenue by manipulating a subject's digital experience. A satirical take on attention economy mechanics."
        tags: ["browser", "simulation", "dark"]
        link:
          label: Play Algorithm Simulator
          url: "/games/algorithm_simulator/"
        image: "/games/game_placeholder.svg"
      - title: Botanical Brawl
        genre: 3D arena shooter
        summary: "A cozy but competitive botanical duel with forgeable weapon stats and lively ricochet combat."
        tags: ["browser", "3D", "arena"]
        link:
          label: Play Botanical Brawl
          url: "/games/botanical_brawl/"
        image: "/games/game_placeholder.svg"
      - title: "Wizard Brawl"
        genre: LLM-powered couch arena fighter
        summary: "Two wizards, one couch, and any object you can dream up as a weapon. Lose a round, rage-forge something new, and let the chaos fly."
        tags: ["browser", "AI", "local-multiplayer"]
        link:
          label: "Play Wizard Brawl"
          url: "/games/wizard_brawl/"
        image: "/games/game_placeholder.svg"
      - title: Void Strike
        genre: 3D FPS arena
        summary: "A neon-drenched wave-survival FPS. Four weapons, five enemy types, dash/slide mechanics, grenades, and kill-streak rewards in a sci-fi arena."
        tags: ["browser", "3D", "FPS", "sound-on"]
        link:
          label: Play Void Strike
          url: "/games/void_strike/"
        image: "/games/game_placeholder.svg"
      - title: Lexicon Atlas
        genre: Educational interactive
        summary: "Spin a 3D globe and discover 392 English words unique to their homeland — from 'brinjal' in India to 'robot' meaning traffic light in South Africa."
        tags: ["browser", "3D", "educational"]
        link:
          label: Explore Lexicon Atlas
          url: "/games/lexicon_atlas/"
        image: "/games/game_placeholder.svg"
      - title: Machine Gaze
        genre: Interactive AI experience
        summary: "Upload a photo and watch a robot decompose it — layer by layer — into edges, depth, objects, and segments. Toggle between human and machine vision."
        tags: ["browser", "AI", "educational"]
        link:
          label: Try Machine Gaze
          url: "/games/machine_gaze/"
        image: "/games/game_placeholder.svg"
      - title: Neon Breach
        genre: Cyberpunk arena FPS
        summary: "Wall-running, grapple hook, and bullet time in a cyberpunk arena. Five weapons, boss waves, and style kills."
        tags: ["browser", "3D", "FPS", "sound-on"]
        link:
          label: Play Neon Breach
          url: "/games/neon_breach/"
        image: "/games/game_placeholder.svg"
  - section:
      name: Photo Gallery
      id: gallery
      enable: true
      weight: 3
      template: personal/gallery.html
    intro:
      title: Photo Gallery
      description: A rotating feed of images from trips, residencies, and long walks with a camera.
    photos: []

