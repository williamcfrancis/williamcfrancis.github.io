      overview: Wind energy engineering and embedded sensing applications.
    positions:
      - designation: Embedded Systems Intern
        start: May 2018
        end: Aug 2018
        responsibilities:
          - Designed and built a miniature wind turbine using an ATtiny85 microcontroller, sensors, and a custom PCB designed in Eagle.
          - Implemented blade-angle detection for heli-hoist applications and analyzed sensor data with Parallax Data Acquisition.
          - Designed and 3D-printed the turbine shaft, blades, and tower.
