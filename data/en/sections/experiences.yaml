experiences:
  - company:
      name: Chubb
      url: "https://www.chubb.com/"
      location: Philadelphia, PA
      overview: North America Data Science Modeling team, working on insurance pricing, predictive modeling, and internal AI applications.
    positions:
      - designation: Data Scientist
        start: May 2024
        responsibilities:
          - Develop and deploy GLM pricing models for personal and commercial insurance, owning factor selection, validation, and deployment.
          - Build production XGBoost models for quote conversion, retention, and loss cost to support underwriting, pricing, and portfolio strategy.
          - Build and maintain reusable modeling tools that support the workflow from raw data to deployed rating models.
          - Develop agentic AI workflows for structured extraction and natural-language exploration of portfolio data.
          - Deliver customer lifetime value estimates through a Streamlit application on Snowflake, helping stakeholders make acquisition and retention decisions.

  - company:
      name: Philly AI Connect
      url: "https://www.phillyconnect.ai/"
      location: Philadelphia, PA
      overview: A community bringing together Philadelphia's AI and machine learning practitioners, researchers, and builders.
    positions:
      - designation: Co-Founder
        start: Nov 2023
        end: May 2024
        responsibilities:
          - Co-founded the organization and grew the community to 1,800 members.
          - Organized six major events featuring research talks, demos, technical workshops, and hackathons, alongside smaller networking events.
          - Secured partnerships with Pennovation Center and GraysonSky to support recurring programming.

  - company:
      name: University of Pennsylvania
      url: "https://www.upenn.edu/"
      location: Philadelphia, PA
      overview: Research in autonomous systems at xLAB, alongside teaching in applied machine learning and community coding education.
    positions:
      - designation: Graduate Research Assistant, xLAB
        start: Dec 2021
        end: May 2023
        responsibilities:
          - Built perception and localization for an autonomous racing go-kart, fine-tuning PSPNet for drivable-area segmentation and fusing GNSS and IMU data with an extended Kalman filter for 100 Hz odometry.
          - Deployed the stack on NVIDIA Jetson AGX and optimized inference with TensorRT for real-time operation.
          - Led the team to first place at Autonomous evGrandPrix 2023 and presented the project at ICRA 2022.
      - designation: Graduate Teaching Assistant, Applied Machine Learning
        start: Jan 2022
        end: Jul 2022
        responsibilities:
          - Developed instructional materials and assignments for more than 60 students in the graduate course MSSP 608.
          - Taught data analysis, regression, support vector machines, neural networks, principal component analysis, and random forests through recitations and coding labs.
      - designation: Student Coding Instructor, Penn Alexander School
        start: Oct 2021
        end: Jul 2022
        responsibilities:
          - Taught Python and Scratch to third- and fourth-grade students at Penn Alexander School.

  - company:
      name: Center for Industrial Automation Lab, Vellore Institute of Technology
      url: "https://chennai.vit.ac.in/electrical-and-electronics-engineering-chennai/facilities/"
      location: Chennai, India
      overview: Research in embedded systems, assistive technology, and robotics.
    positions:
      - designation: Undergraduate Research Assistant
        start: Oct 2019
        end: Jun 2020
        responsibilities:
          - Built a brain-controlled wheelchair with camera-based collision avoidance and a Python and MATLAB interface.
          - Developed a TensorFlow neural network for voluntary eye-blink detection in EEG signals, with adaptive blink detection and control sensitivity.
          - Conducted user testing and contributed to a peer-reviewed publication in the Indonesian Journal of Electrical Engineering and Informatics in June 2021.

  - company:
      name: VisionCultura
      location: Bengaluru, India
      overview: An IoT farming startup connecting sensors, cloud infrastructure, and mobile applications.
    positions:
      - designation: Machine Learning Intern
        start: Dec 2019
        end: May 2020
        responsibilities:
          - Developed a PyTorch and IoT farming system that monitored sunlight, water, and nutrients, contributing to an 18% increase in crop yield and a 90% reduction in labor costs.
          - Deployed models with AWS SageMaker and monitored real-time data with CloudWatch.
          - Improved the perception stack with YOLO, RetinaNet, and Faster R-CNN object detection models.

  - company:
      name: Siemens Gamesa Renewable Energy
      url: "https://www.siemensgamesa.com/en-int"
