designation: Data Scientist

# your company information
company:
  name: Chubb
  url: "https://www.chubb.com/"

# your resume. this file path should be relative to you "static" directory
resume: "files/Resume.pdf"

# a summary about you
summary: >-
  I'm a data scientist at Chubb in Philadelphia, building predictive models,
  machine learning tools, and agentic AI applications. My work spans insurance
  pricing, conversion and retention modeling, and tools that help teams move
  from data to decisions. I hold dual master's degrees in Robotics and Computer
  Science from the University of Pennsylvania, where I worked on perception and
  localization for an autonomous racing go-kart. Beyond my day job, I built
  PeeqAI, a multimodal assistant for visually impaired users, and co-founded
  Philly AI Connect. I'm especially interested in how vision, language, and
  learning can come together to solve practical problems.

