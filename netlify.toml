# Redirect old game URL to canonical name (Wizard Brawl moved from junkcode_brawlers to wizard_brawl)
[[redirects]]
  from = "/games/junkcode_brawlers"
  to = "/games/wizard_brawl/"
  status = 301
[[redirects]]
  from = "/games/junkcode_brawlers/*"
  to = "/games/wizard_brawl/:splat"
  status = 301

[build]
command = "npm install && npm run build:games && hugo --gc --minify"
publish = "public"
functions = "netlify/functions"

[build.environment]
NODE_VERSION = "24"

[context.production.environment]
HUGO_ENABLEGITINFO = "true"
HUGO_ENV           = "production"
HUGO_THEME         = "toha"
HUGO_VERSION       = "0.100.2"
NODE_VERSION       = "24"

[context.split1]
command = "npm install && npm run build:games && hugo --gc --minify --enableGitInfo"

    [context.split1.environment]
    HUGO_ENV     = "production"
    HUGO_VERSION = "0.100.2"
    NODE_VERSION = "24"

[context.deploy-preview]
command = "npm install && npm run build:games && hugo --gc --minify --buildFuture -b $DEPLOY_PRIME_URL"

    [context.deploy-preview.environment]
    HUGO_VERSION = "0.100.2"
    NODE_VERSION = "24"

[context.branch-deploy]
command = "npm install && npm run build:games && hugo --gc --minify -b $DEPLOY_PRIME_URL"

    [context.branch-deploy.environment]
    HUGO_VERSION = "0.100.2"
    NODE_VERSION = "24"

[context.next.environment]
HUGO_ENABLEGITINFO = "true"
NODE_VERSION       = "24"
