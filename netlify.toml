# Netlify is the only deployment target. GitHub Actions validates the same build.
[build]
command = "npm ci && npm run build"
publish = "public"
functions = "netlify/functions"

[build.environment]
NODE_VERSION = "24"
HUGO_VERSION = "0.100.2"
HUGO_ENV = "production"
HUGO_ENABLEGITINFO = "true"

[functions]
node_bundler = "esbuild"

[context.deploy-preview]
command = "npm ci && npm run check && npm run build:site -- --buildFuture --baseURL $DEPLOY_PRIME_URL && npm run build:functions"

[context.branch-deploy]
command = "npm ci && npm run check && npm run build:site -- --baseURL $DEPLOY_PRIME_URL && npm run build:functions"

[dev]
command = "npm run dev:site"
targetPort = 1313
port = 8888
functionsPort = 9999
framework = "#custom"
autoLaunch = false

# Preserve the old game URL.
[[redirects]]
from = "/games/junkcode_brawlers"
to = "/games/wizard_brawl/"
status = 301

[[redirects]]
from = "/games/junkcode_brawlers/*"
to = "/games/wizard_brawl/:splat"
status = 301

# Hashed Vite assets are safe to cache; HTML continues to use Netlify defaults.
[[headers]]
for = "/games/*/assets/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"
