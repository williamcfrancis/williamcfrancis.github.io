<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Gravity Golf</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#050510;font-family:'Space Grotesk',sans-serif;color:#fff;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;position:absolute;top:0;left:0;width:100%;height:100%}
.back-to-games{position:absolute;top:16px;left:16px;z-index:30;background:rgba(0,0,0,.45);color:#fff;text-decoration:none;font-weight:600;letter-spacing:.04em;padding:10px 18px;border-radius:999px;display:inline-flex;align-items:center;gap:8px;box-shadow:0 6px 18px rgba(0,0,0,.3);pointer-events:auto;transition:transform 120ms ease,background 120ms ease;font-size:14px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.08)}
.back-to-games:hover{transform:translateX(-2px);background:rgba(0,0,0,.6)}
#overlay{position:absolute;top:0;left:0;width:100%;height:100%;z-index:20;pointer-events:none;display:flex;align-items:center;justify-content:center}
#overlay.active{pointer-events:auto}
.screen{display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.screen.visible{display:flex}
.title-screen .game-title{font-size:clamp(48px,8vw,96px);font-weight:700;letter-spacing:-2px;background:linear-gradient(135deg,#a78bfa,#60a5fa,#34d399);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px;line-height:1.1}
.title-screen .game-subtitle{font-size:clamp(14px,2.5vw,20px);color:rgba(255,255,255,.5);font-weight:300;margin-bottom:40px;letter-spacing:2px}
.title-screen .tagline{font-size:clamp(15px,2.6vw,20px);color:rgba(255,255,255,.6);max-width:520px;line-height:1.7;margin-bottom:36px}
.btn{padding:16px 48px;border-radius:999px;border:none;font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:600;cursor:pointer;transition:all .2s ease;letter-spacing:.5px}
.btn-primary{background:linear-gradient(135deg,#a78bfa,#60a5fa);color:#fff;box-shadow:0 0 30px rgba(96,165,250,.3)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 0 50px rgba(96,165,250,.5)}
.btn-secondary{background:rgba(255,255,255,.08);color:rgba(255,255,255,.8);border:1px solid rgba(255,255,255,.15);padding:12px 32px;font-size:15px;margin-top:12px}
.btn-secondary:hover{background:rgba(255,255,255,.15);transform:translateY(-1px)}
.hud{position:absolute;top:16px;right:16px;z-index:25;display:flex;gap:12px;align-items:flex-start;pointer-events:none}
.hud-item{background:rgba(0,0,0,.5);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.08);padding:8px 14px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
.hud-label{color:rgba(255,255,255,.4);font-size:10px;text-transform:uppercase;letter-spacing:1.5px;font-family:'Space Mono',monospace}
.hud-value{color:#fff;font-size:17px;font-weight:700}
.level-intro{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:25;text-align:center;pointer-events:none;opacity:0;transition:opacity .5s ease}
.level-intro.show{opacity:1}
.level-intro .level-num{font-size:13px;color:rgba(255,255,255,.35);text-transform:uppercase;letter-spacing:3px;margin-bottom:6px}
.level-intro .level-name{font-size:clamp(28px,5vw,48px);font-weight:700;background:linear-gradient(135deg,#a78bfa,#60a5fa,#34d399);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:10px}
.level-intro .level-tip{font-size:clamp(13px,2vw,16px);color:rgba(255,255,255,.45);max-width:420px;line-height:1.5}
.panel{background:rgba(0,0,0,.7);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.1);border-radius:24px;padding:40px 48px;max-width:400px}
.panel h2{font-size:32px;font-weight:700;margin-bottom:4px}
.panel .big-num{font-size:48px;font-weight:700;font-family:'Space Mono',monospace;margin:16px 0;line-height:1}
.panel .sub{font-size:15px;color:rgba(255,255,255,.5);margin-bottom:8px}
.panel .label{font-size:20px;font-weight:600;margin-bottom:24px}
.under{color:#34d399}.on{color:#60a5fa}.over{color:#f87171}
.final-panel{max-width:440px;padding:48px}
.final-panel h2{font-size:36px;background:linear-gradient(135deg,#a78bfa,#60a5fa,#34d399);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.final-panel .big-num{font-size:64px;margin:20px 0 8px}
.final-panel .scores{display:grid;grid-template-columns:1fr 1fr;gap:6px 20px;margin-bottom:28px;font-size:13px;text-align:left}
.final-panel .scores span{color:rgba(255,255,255,.5)}
.final-panel .scores strong{color:#fff}
.slowmo-btn{position:absolute;bottom:24px;left:24px;z-index:25;width:56px;height:56px;border-radius:50%;border:2px solid rgba(167,139,250,.3);background:rgba(0,0,0,.4);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);cursor:pointer;color:rgba(167,139,250,.7);font-family:'Space Mono',monospace;font-size:11px;font-weight:700;display:none;align-items:center;justify-content:center;pointer-events:auto;transition:all .15s ease;line-height:1}
.slowmo-btn.active{background:rgba(167,139,250,.25);border-color:rgba(167,139,250,.6);color:#a78bfa;box-shadow:0 0 20px rgba(167,139,250,.2)}
.slowmo-btn:hover{border-color:rgba(167,139,250,.5)}
.restart-btn{position:absolute;bottom:24px;right:24px;z-index:25;padding:10px 20px;border-radius:999px;border:1px solid rgba(255,255,255,.15);background:rgba(0,0,0,.4);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);cursor:pointer;color:rgba(255,255,255,.7);font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:500;transition:all .2s ease;pointer-events:auto;display:none}
.restart-btn:hover{background:rgba(0,0,0,.6);color:#fff}
.hint{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);z-index:25;text-align:center;color:rgba(255,255,255,.3);font-size:13px;pointer-events:none;transition:opacity .5s ease;white-space:nowrap}
@media(max-width:600px){
  .back-to-games{padding:8px 14px;font-size:12px;top:12px;left:12px}
  .hud{top:12px;right:12px;gap:6px}
  .hud-item{padding:5px 10px}
  .hud-value{font-size:14px}
  .panel,.final-panel{padding:28px 28px;margin:0 16px}
  .btn{padding:14px 36px;font-size:16px}
}
</style>
</head>
<body>
<a class="back-to-games" href="/personal/#games">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
<span>Back</span>
</a>
<canvas id="canvas"></canvas>
<div class="hud" id="hud" style="display:none">
  <div class="hud-item"><span class="hud-label">Shots</span><span class="hud-value" id="hud-strokes">0</span></div>
  <div class="hud-item"><span class="hud-label">Par</span><span class="hud-value" id="hud-par">3</span></div>
  <div class="hud-item"><span class="hud-label">Hole</span><span class="hud-value" id="hud-level">1</span></div>
</div>
<div class="level-intro" id="level-intro">
  <div class="level-num" id="intro-num"></div>
  <div class="level-name" id="intro-name"></div>
  <div class="level-tip" id="intro-tip"></div>
</div>
<div class="hint" id="hint" style="display:none"></div>
<button class="slowmo-btn" id="slowmo-btn">SLOW</button>
<button class="restart-btn" id="restart-btn" onclick="G.restartLevel()">&#8635; Restart</button>
<div id="overlay">
  <div class="screen title-screen" id="title-screen">
    <div class="game-title">Gravity Golf</div>
    <div class="game-subtitle">Bend space. Shape gravity.</div>
    <div class="tagline">Launch your ball, then grab planets and drag them mid-flight to sculpt the perfect trajectory. Hold SPACE for slow-motion. Reach the wormhole.</div>
    <button class="btn btn-primary" onclick="G.start()">Play</button>
  </div>
  <div class="screen" id="complete-screen">
    <div class="panel" id="complete-panel">
      <h2 id="cmp-title">Nice!</h2>
      <div class="big-num" id="cmp-strokes">2</div>
      <div class="sub" id="cmp-par">Par 3</div>
      <div class="label" id="cmp-label">Birdie!</div>
      <button class="btn btn-primary" id="cmp-next">Next Hole</button>
      <button class="btn btn-secondary" onclick="G.restartLevel()">Retry</button>
    </div>
  </div>
  <div class="screen" id="final-screen">
    <div class="panel final-panel">
      <h2>Course Complete!</h2>
      <div class="big-num" id="fin-total">+0</div>
      <div class="sub" id="fin-label">Total vs Par</div>
      <div class="scores" id="fin-scores"></div>
      <button class="btn btn-primary" onclick="G.start()">Play Again</button>
      <button class="btn btn-secondary" onclick="G.menu()">Menu</button>
    </div>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════
   CANVAS
   ═══════════════════════════════════════════════ */
const CV = document.getElementById('canvas');
const cx = CV.getContext('2d');
let W, H, dpr;
function resize(){
  dpr = Math.min(devicePixelRatio||1,2);
  W = innerWidth; H = innerHeight;
  CV.width = W*dpr; CV.height = H*dpr;
  cx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener('resize',resize); resize();

const PAD = 70;
function nx(v){ return PAD + v*(W-PAD*2); }
function ny(v){ return PAD + v*(H-PAD*2); }

/* ═══════════════════════════════════════════════
   AUDIO
   ═══════════════════════════════════════════════ */
const sfx = {
  _c: null,
  init(){ if(!this._c) this._c = new (AudioContext||webkitAudioContext)(); },
  _play(fn){
    if(!this._c) return;
    const now = this._c.currentTime;
    const o = this._c.createOscillator();
    const g = this._c.createGain();
    const f = this._c.createBiquadFilter();
    o.connect(f); f.connect(g); g.connect(this._c.destination);
    fn(o,g,f,now); o.start(now);
  },
  launch(){this._play((o,g,f,t)=>{o.type='sine';o.frequency.setValueAtTime(200,t);o.frequency.exponentialRampToValueAtTime(500,t+.12);g.gain.setValueAtTime(.15,t);g.gain.exponentialRampToValueAtTime(.001,t+.25);f.frequency.value=2500;o.stop(t+.25)})},
  hole(){this._play((o,g,f,t)=>{o.type='sine';o.frequency.setValueAtTime(523,t);o.frequency.setValueAtTime(659,t+.08);o.frequency.setValueAtTime(784,t+.16);o.frequency.setValueAtTime(1047,t+.24);g.gain.setValueAtTime(.18,t);g.gain.setValueAtTime(.18,t+.28);g.gain.exponentialRampToValueAtTime(.001,t+.7);f.frequency.value=5000;o.stop(t+.7)})},
  bounce(){this._play((o,g,f,t)=>{o.type='triangle';o.frequency.setValueAtTime(280,t);o.frequency.exponentialRampToValueAtTime(90,t+.12);g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+.12);f.frequency.value=1800;o.stop(t+.12)})},
  absorbed(){this._play((o,g,f,t)=>{o.type='sawtooth';o.frequency.setValueAtTime(350,t);o.frequency.exponentialRampToValueAtTime(25,t+.5);g.gain.setValueAtTime(.1,t);g.gain.exponentialRampToValueAtTime(.001,t+.5);f.type='lowpass';f.frequency.setValueAtTime(2500,t);f.frequency.exponentialRampToValueAtTime(80,t+.5);o.stop(t+.5)})},
  oob(){this._play((o,g,f,t)=>{o.type='square';o.frequency.setValueAtTime(180,t);o.frequency.exponentialRampToValueAtTime(60,t+.25);g.gain.setValueAtTime(.08,t);g.gain.exponentialRampToValueAtTime(.001,t+.25);f.frequency.value=600;o.stop(t+.25)})},
  boost(){this._play((o,g,f,t)=>{o.type='sine';o.frequency.setValueAtTime(400,t);o.frequency.exponentialRampToValueAtTime(1200,t+.15);g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+.2);f.frequency.value=4000;o.stop(t+.2)})},
  warp(){this._play((o,g,f,t)=>{o.type='sine';o.frequency.setValueAtTime(800,t);o.frequency.exponentialRampToValueAtTime(200,t+.3);g.gain.setValueAtTime(.1,t);g.gain.exponentialRampToValueAtTime(.001,t+.35);f.frequency.value=3000;o.stop(t+.35)})},
  grab(){this._play((o,g,f,t)=>{o.type='sine';o.frequency.setValueAtTime(600,t);g.gain.setValueAtTime(.06,t);g.gain.exponentialRampToValueAtTime(.001,t+.06);f.frequency.value=5000;o.stop(t+.06)})},
};

/* ═══════════════════════════════════════════════
   BACKGROUND
   ═══════════════════════════════════════════════ */
const stars=[];
for(let i=0;i<280;i++) stars.push({x:Math.random()*4000-500,y:Math.random()*3000-300,r:Math.random()*1.4+.3,a:Math.random()*.5+.15,sp:Math.random()*2+.8,ph:Math.random()*6.28});

function drawBG(t){
  cx.fillStyle='#050510'; cx.fillRect(0,0,W,H);
  let g=cx.createRadialGradient(W*.2,H*.3,0,W*.2,H*.3,W*.5);
  g.addColorStop(0,'rgba(80,40,160,.07)');g.addColorStop(1,'rgba(80,40,160,0)');
  cx.fillStyle=g;cx.fillRect(0,0,W,H);
  g=cx.createRadialGradient(W*.8,H*.7,0,W*.8,H*.7,W*.4);
  g.addColorStop(0,'rgba(25,55,160,.05)');g.addColorStop(1,'rgba(25,55,160,0)');
  cx.fillStyle=g;cx.fillRect(0,0,W,H);
  for(const s of stars){
    cx.globalAlpha=s.a*(.5+.5*Math.sin(t*s.sp+s.ph));
    cx.fillStyle='#fff';cx.beginPath();cx.arc(s.x,s.y,s.r,0,6.28);cx.fill();
  }
  cx.globalAlpha=1;
}

/* ═══════════════════════════════════════════════
   DRAW HELPERS
   ═══════════════════════════════════════════════ */
function hx(hex,a=1){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return`rgba(${r},${g},${b},${a})`}
function glow(x,y,r,col,sz=1.5){
  const g=cx.createRadialGradient(x,y,0,x,y,r*sz);
  g.addColorStop(0,col);g.addColorStop(.5,col.replace(/[\d.]+\)$/,'.25)'));g.addColorStop(1,col.replace(/[\d.]+\)$/,'0)'));
  cx.fillStyle=g;cx.beginPath();cx.arc(x,y,r*sz,0,6.28);cx.fill();
  cx.fillStyle=col;cx.beginPath();cx.arc(x,y,r,0,6.28);cx.fill();
}

/* ═══════════════════════════════════════════════
   SCREEN SHAKE
   ═══════════════════════════════════════════════ */
let shakeX=0,shakeY=0,shakePow=0;
function shake(pow){shakePow=Math.max(shakePow,pow);}
function updateShake(){
  if(shakePow>.1){shakeX=(Math.random()-.5)*shakePow;shakeY=(Math.random()-.5)*shakePow;shakePow*=.85;}
  else{shakeX=shakeY=shakePow=0;}
}

/* ═══════════════════════════════════════════════

   ═══════════════════════════════════════════════ */

/* ═══════════════════════════════════════════════
   GAME STATE
   ═══════════════════════════════════════════════ */
const G = {
  st:'menu', lvl:0, shots:0, scores:[], time:0, whAngle:0,
  ball:null, goal:null, bodies:[], rings:[], portals:[],
  trail:[], particles:[], introT:0,
  drag:null, dragOff:null,  // body being dragged
  aim:null, aimEnd:null,    // aiming from ball
  slowmo:false, timeScale:1, targetTS:1,
  portalCooldown:0,

  /* ── screens ── */
  showScr(id){
    document.querySelectorAll('.screen').forEach(s=>s.classList.remove('visible'));
    const ov=document.getElementById('overlay');
    if(id){document.getElementById(id).classList.add('visible');ov.classList.add('active');}
    else ov.classList.remove('active');
  },

  /* ── menu ── */
  menu(){
    this.st='menu'; this.slowmo=false;
    document.getElementById('hud').style.display='none';
    document.getElementById('restart-btn').style.display='none';
    document.getElementById('slowmo-btn').style.display='none';
    document.getElementById('hint').style.display='none';
    this.showScr('title-screen');
  },

  /* ── start ── */
  start(){
    sfx.init(); this.lvl=0; this.scores=[]; this.loadLevel(0);
  },

  /* ── load level ── */
  loadLevel(i){
    const L=LEVELS[i]; this.lvl=i; this.shots=0;
    this.trail=[]; this.particles=[]; this.portalCooldown=0;

    this.ball={x:nx(L.ball.x),y:ny(L.ball.y),vx:0,vy:0,r:8,active:false};
    this.ball.sx=this.ball.x; this.ball.sy=this.ball.y;

    this.goal={x:nx(L.goal.x),y:ny(L.goal.y),r:24};

    this.bodies=L.bodies.map(b=>{
      const o={x:nx(b.x),y:ny(b.y),m:b.m,r:b.r,type:b.type,col:b.col,drag:!!b.drag,ph:Math.random()*6.28};
      if(b.orbit) o.orbit={cx:nx(b.orbit.cx),cy:ny(b.orbit.cy),rad:b.orbit.rad*Math.min(W-PAD*2,H-PAD*2),speed:b.orbit.speed,phase:b.orbit.phase};
      return o;
    });

    this.rings=(L.rings||[]).map(r=>({x:nx(r.x),y:ny(r.y),angle:r.angle,str:r.str,r:28,hit:false,hitT:0}));
    this.portals=(L.portals||[]).map(p=>({ax:nx(p.ax),ay:ny(p.ay),bx:nx(p.bx),by:ny(p.by),col1:p.col1,col2:p.col2,r:20}));

    document.getElementById('hud').style.display='flex';
    document.getElementById('hud-strokes').textContent='0';
    document.getElementById('hud-par').textContent=L.par;
    document.getElementById('hud-level').textContent=`${i+1}/${LEVELS.length}`;
    document.getElementById('restart-btn').style.display='block';
    document.getElementById('slowmo-btn').style.display='flex';
    this.showScr(null);

    const intro=document.getElementById('level-intro');
    document.getElementById('intro-num').textContent=`Hole ${i+1}`;
    document.getElementById('intro-name').textContent=L.name;
    document.getElementById('intro-tip').textContent=L.tip;
    intro.classList.add('show');

    this.st='intro'; this.introT=0;

    const hintEl=document.getElementById('hint');
    if(i===0){hintEl.textContent='Click & drag from the ball to launch';hintEl.style.display='block';hintEl.style.opacity='1';}
    else if(i===2){hintEl.textContent='Click & drag the glowing planet to move it';hintEl.style.display='block';hintEl.style.opacity='1';}
    else if(i===3){hintEl.textContent='Hold SPACE for slow-motion while the ball flies';hintEl.style.display='block';hintEl.style.opacity='1';}
    else{hintEl.style.display='none';}
  },

  resetBall(){
    this.ball.x=this.ball.sx; this.ball.y=this.ball.sy;
    this.ball.vx=this.ball.vy=0; this.ball.active=false;
    this.trail=[];
  },

  restartLevel(){
    this.shots=0; this.particles=[];
    document.getElementById('hud-strokes').textContent='0';
    this.loadLevel(this.lvl);
  },

  launch(pow,ang){
    const spd=Math.min(pow/180,1)*14;
    this.ball.vx=Math.cos(ang)*spd; this.ball.vy=Math.sin(ang)*spd;
    this.ball.active=true; this.shots++;
    document.getElementById('hud-strokes').textContent=this.shots;
    this.st='flying'; this.trail=[{x:this.ball.x,y:this.ball.y}];
    sfx.launch();
    const h=document.getElementById('hint'); h.style.opacity='0';
  },

  levelDone(){
    this.st='complete';
    const L=LEVELS[this.lvl], d=this.shots-L.par;
    this.scores.push({s:this.shots,p:L.par});
    let lbl,cls;
    if(this.shots===1){lbl='Hole in One!!';cls='under';}
    else if(d<=-2){lbl='Eagle!';cls='under';}
    else if(d===-1){lbl='Birdie!';cls='under';}
    else if(d===0){lbl='Par';cls='on';}
    else if(d===1){lbl='Bogey';cls='over';}
    else{lbl='+'+ d;cls='over';}
    for(let i=0;i<50;i++){const a=Math.random()*6.28,sp=Math.random()*5+1.5;
      this.particles.push({x:this.goal.x,y:this.goal.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,dec:.01+Math.random()*.012,col:['#a78bfa','#60a5fa','#34d399','#fbbf24','#fb7185'][~~(Math.random()*5)],r:Math.random()*3.5+1});}
    sfx.hole(); shake(8);
    setTimeout(()=>{
      if(this.st!=='complete')return;
      document.getElementById('cmp-strokes').textContent=this.shots;
      document.getElementById('cmp-par').textContent=`Par ${L.par}`;
      document.getElementById('cmp-label').textContent=lbl;
      document.getElementById('cmp-label').className='label '+cls;
      const btn=document.getElementById('cmp-next');
      if(this.lvl===LEVELS.length-1){btn.textContent='See Results';btn.onclick=()=>this.showFinal();}
      else{btn.textContent='Next Hole';btn.onclick=()=>this.nextLevel();}
      this.showScr('complete-screen');
    },1100);
  },

  nextLevel(){this.lvl<LEVELS.length-1?this.loadLevel(this.lvl+1):this.showFinal();},

  showFinal(){
    let tot=0,html='';
    this.scores.forEach((s,i)=>{const d=s.s-s.p;tot+=d;html+=`<span>Hole ${i+1}</span><strong>${s.s} (${d>0?'+':''}${d})</strong>`;});
    const sign=tot>0?'+':'';
    document.getElementById('fin-total').textContent=`${sign}${tot}`;
    document.getElementById('fin-total').className='big-num '+(tot<0?'under':tot===0?'on':'over');
    document.getElementById('fin-scores').innerHTML=html;
    document.getElementById('hud').style.display='none';
    document.getElementById('restart-btn').style.display='none';
    document.getElementById('slowmo-btn').style.display='none';
    this.st='gameover'; this.showScr('final-screen');
  },

  /* ═══════════════════════════════════════════════
     UPDATE
     ═══════════════════════════════════════════════ */
  update(dt){
    this.time+=dt;
    this.whAngle+=dt*2;
    this.targetTS=this.slowmo?.2:1;
    this.timeScale+=(this.targetTS-this.timeScale)*.12;

    this.particles=this.particles.filter(p=>{p.x+=p.vx*this.timeScale;p.y+=p.vy*this.timeScale;p.vx*=.97;p.vy*=.97;p.life-=p.dec;return p.life>0;});
    updateShake();

    // orbiting bodies
    for(const b of this.bodies){
      if(b.orbit){
        b.orbit.phase+=b.orbit.speed*dt*this.timeScale;
        b.x=b.orbit.cx+Math.cos(b.orbit.phase)*b.orbit.rad;
        b.y=b.orbit.cy+Math.sin(b.orbit.phase)*b.orbit.rad;
      }
    }

    // ring hit flash
    for(const r of this.rings){if(r.hit)r.hitT+=dt;if(r.hitT>.3){r.hit=false;r.hitT=0;}}

    if(this.st==='intro'){this.introT+=dt;if(this.introT>2){document.getElementById('level-intro').classList.remove('show');this.st='playing';}return;}
    if(this.st!=='flying')return;
    if(this.portalCooldown>0) this.portalCooldown-=dt;

    const b=this.ball;
    const steps=6, sub=this.timeScale/steps;

    for(let s=0;s<steps;s++){
      let ax=0,ay=0;

      for(const body of this.bodies){
        const dx=body.x-b.x,dy=body.y-b.y;
        const dist=Math.sqrt(dx*dx+dy*dy);

        // black hole absorb
        if(body.type==='blackhole'&&dist<body.r*1.3){
          b.active=false; this.st='playing'; sfx.absorbed(); shake(12);
          for(let i=0;i<25;i++){const a=Math.random()*6.28,sp=Math.random()*2+.5;
            this.particles.push({x:b.x,y:b.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,dec:.025,col:'#a78bfa',r:2});}
          this.resetBall(); return;
        }
        // planet/star bounce
        if(body.type!=='blackhole'&&dist<body.r+b.r){
          const dn=dist||1,bnx=dx/dn,bny=dy/dn;
          const dot=b.vx*bnx+b.vy*bny;
          b.vx-=2*dot*bnx*.72; b.vy-=2*dot*bny*.72;
          b.x=body.x-bnx*(body.r+b.r+1); b.y=body.y-bny*(body.r+b.r+1);
          sfx.bounce(); shake(4);
          continue;
        }

        const md=Math.max(dist,35);
        const f=body.m/(md*md);
        const dn=dist||1;
        if(body.type==='star'){ax-=(dx/dn)*f;ay-=(dy/dn)*f;}
        else{ax+=(dx/dn)*f;ay+=(dy/dn)*f;}
      }

      b.vx+=ax*sub; b.vy+=ay*sub;
      const spd=Math.sqrt(b.vx*b.vx+b.vy*b.vy);
      if(spd>20){b.vx=(b.vx/spd)*20;b.vy=(b.vy/spd)*20;}
      b.x+=b.vx*sub; b.y+=b.vy*sub;
    }

    // boost rings
    for(const ring of this.rings){
      const dx=ring.x-b.x,dy=ring.y-b.y;
      const dist=Math.sqrt(dx*dx+dy*dy);
      if(dist<ring.r+b.r&&!ring.hit){
        ring.hit=true; ring.hitT=0;
        b.vx+=Math.cos(ring.angle)*ring.str;
        b.vy+=Math.sin(ring.angle)*ring.str;
        sfx.boost(); shake(5);
        for(let i=0;i<12;i++){const a=ring.angle+(Math.random()-.5)*.8,sp=Math.random()*3+2;
          this.particles.push({x:b.x,y:b.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,dec:.03,col:'#34d399',r:2});}
      }
    }

    // portals
    if(this.portalCooldown<=0){
      for(const p of this.portals){
        let dx=p.ax-b.x,dy=p.ay-b.y;
        if(Math.sqrt(dx*dx+dy*dy)<p.r+b.r){
          b.x=p.bx;b.y=p.by;this.portalCooldown=.4;sfx.warp();shake(3);
          for(let i=0;i<15;i++){const a=Math.random()*6.28,sp=Math.random()*3+1;
            this.particles.push({x:p.bx,y:p.by,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,dec:.03,col:p.col2,r:2});}
          break;
        }
        dx=p.bx-b.x;dy=p.by-b.y;
        if(Math.sqrt(dx*dx+dy*dy)<p.r+b.r){
          b.x=p.ax;b.y=p.ay;this.portalCooldown=.4;sfx.warp();shake(3);
          for(let i=0;i<15;i++){const a=Math.random()*6.28,sp=Math.random()*3+1;
            this.particles.push({x:p.ax,y:p.ay,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,dec:.03,col:p.col1,r:2});}
          break;
        }
      }
    }

    // trail
    this.trail.push({x:b.x,y:b.y});
    if(this.trail.length>400) this.trail.shift();

    // goal check
    const gdx=this.goal.x-b.x,gdy=this.goal.y-b.y;
    if(Math.sqrt(gdx*gdx+gdy*gdy)<this.goal.r+b.r){this.levelDone();return;}

    // OOB
    const M=200;
    if(b.x<-M||b.x>W+M||b.y<-M||b.y>H+M){sfx.oob();this.resetBall();this.st='playing';}

    // stopped
    const sp=Math.sqrt(b.vx*b.vx+b.vy*b.vy);
    if(sp<.04&&this.trail.length>20){b.vx=b.vy=0;b.active=false;this.st='playing';}
  },

  /* ═══════════════════════════════════════════════
     RENDER
     ═══════════════════════════════════════════════ */
  render(t){
    cx.save();
    cx.translate(shakeX,shakeY);
    drawBG(t);

    // slow-mo vignette
    if(this.timeScale<.8){
      const a=(.8-this.timeScale)/.6*.35;
      const vg=cx.createRadialGradient(W/2,H/2,W*.25,W/2,H/2,W*.75);
      vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,`rgba(80,40,180,${a})`);
      cx.fillStyle=vg;cx.fillRect(0,0,W,H);
      cx.font='600 12px Space Mono, monospace';cx.fillStyle=`rgba(167,139,250,${a*1.5})`;
      cx.textAlign='center';cx.fillText(`${Math.round(this.timeScale*100)}% SPEED`,W/2,32);
    }

    // portals
    for(const p of this.portals){
      this._drawPortal(p.ax,p.ay,p.col1,t);
      this._drawPortal(p.bx,p.by,p.col2,t);
      // connecting line
      cx.setLineDash([4,8]);cx.strokeStyle='rgba(255,255,255,.06)';cx.lineWidth=1;
      cx.beginPath();cx.moveTo(p.ax,p.ay);cx.lineTo(p.bx,p.by);cx.stroke();cx.setLineDash([]);
    }

    // bodies
    for(const body of this.bodies){
      body.ph+=.02;
      const pulse=1+.04*Math.sin(body.ph);
      if(body.type==='planet') this._drawPlanet(body,pulse,t);
      if(body.type==='star') this._drawStar(body,pulse,t);
      if(body.type==='blackhole') this._drawBlackHole(body,t);
      // draggable indicator
      if(body.drag){
        cx.strokeStyle=`rgba(255,255,255,${.12+.06*Math.sin(t*3)})`;
        cx.lineWidth=2;cx.setLineDash([5,5]);
        cx.beginPath();cx.arc(body.x,body.y,body.r+12,0,6.28);cx.stroke();
        cx.setLineDash([]);
        // grab hand icon hint
        cx.font='10px Space Grotesk';cx.fillStyle=`rgba(255,255,255,${.2+.1*Math.sin(t*2)})`;
        cx.textAlign='center';cx.fillText('DRAG',body.x,body.y+body.r+26);
      }
    }

    // boost rings
    for(const ring of this.rings){
      const flash=ring.hit?1-ring.hitT/.3:0;
      const baseA=.5+flash*.5;
      cx.save();cx.translate(ring.x,ring.y);cx.rotate(ring.angle);
      // ring body
      cx.strokeStyle=`rgba(52,211,153,${baseA*.7})`;cx.lineWidth=3+flash*3;
      cx.beginPath();cx.arc(0,0,ring.r,0,6.28);cx.stroke();
      // glow
      const rg=cx.createRadialGradient(0,0,ring.r*.5,0,0,ring.r*1.8);
      rg.addColorStop(0,`rgba(52,211,153,${baseA*.08})`);rg.addColorStop(1,'rgba(52,211,153,0)');
      cx.fillStyle=rg;cx.beginPath();cx.arc(0,0,ring.r*1.8,0,6.28);cx.fill();
      // direction arrow
      const aw=ring.r+14;
      cx.fillStyle=`rgba(52,211,153,${baseA*.6})`;
      cx.beginPath();cx.moveTo(aw,0);cx.lineTo(aw-10,-6);cx.lineTo(aw-10,6);cx.closePath();cx.fill();
      // flowing particles
      for(let i=0;i<3;i++){
        const px=-ring.r+((t*60+i*40)%(ring.r*2));
        const py=(Math.sin(t*4+i*2))*6;
        cx.globalAlpha=baseA*.4;cx.fillStyle='#34d399';
        cx.beginPath();cx.arc(px,py,2,0,6.28);cx.fill();cx.globalAlpha=1;
      }
      cx.restore();
    }

    // wormhole/goal
    if(this.goal) this._drawWormhole(this.goal,t);

    // trail
    if(this.trail.length>1){
      for(let i=1;i<this.trail.length;i++){
        const a=i/this.trail.length;
        // speed-based color
        const ci=Math.min(a,1);
        const r=Math.round(167*ci+100*(1-ci));
        const g=Math.round(139*ci+180*(1-ci));
        const bb=Math.round(250*ci+255*(1-ci));
        cx.strokeStyle=`rgba(${r},${g},${bb},${a*.55})`;
        cx.lineWidth=2.5*a+.5;
        cx.beginPath();cx.moveTo(this.trail[i-1].x,this.trail[i-1].y);cx.lineTo(this.trail[i].x,this.trail[i].y);cx.stroke();
      }
    }

    // ball
    const b=this.ball;
    if(b&&this.st!=='menu'&&this.st!=='gameover'){
      // speed lines
      if(b.active){
        const sp=Math.sqrt(b.vx*b.vx+b.vy*b.vy);
        if(sp>5){
          const ang=Math.atan2(b.vy,b.vx);
          const n=Math.min(~~(sp/3),5);
          for(let i=0;i<n;i++){
            const off=(Math.random()-.5)*8;
            const len=sp*1.5+Math.random()*10;
            cx.strokeStyle=`rgba(255,255,255,${.08+Math.random()*.06})`;
            cx.lineWidth=1;cx.beginPath();
            cx.moveTo(b.x-Math.cos(ang)*len+Math.sin(ang)*off,b.y-Math.sin(ang)*len-Math.cos(ang)*off);
            cx.lineTo(b.x+Math.sin(ang)*off,b.y-Math.cos(ang)*off);
            cx.stroke();
          }
        }
        // engine particles
        for(let i=0;i<2;i++) this.particles.push({x:b.x+(Math.random()-.5)*4,y:b.y+(Math.random()-.5)*4,vx:-b.vx*.08+(Math.random()-.5)*.5,vy:-b.vy*.08+(Math.random()-.5)*.5,life:1,dec:.04,col:'#a78bfa',r:Math.random()*2+.5});
      }
      // squash/stretch
      const sp=Math.sqrt(b.vx*b.vx+b.vy*b.vy);
      const stretch=Math.min(sp/15,.3);
      const ang=Math.atan2(b.vy,b.vx);
      cx.save();cx.translate(b.x,b.y);cx.rotate(ang);
      cx.scale(1+stretch,1-stretch*.5);cx.rotate(-ang);
      glow(0,0,b.r,'rgba(255,255,255,.95)',2.5);
      cx.restore();
    }

    // particles
    for(const p of this.particles){cx.globalAlpha=p.life;cx.fillStyle=p.col;cx.beginPath();cx.arc(p.x,p.y,p.r,0,6.28);cx.fill();}
    cx.globalAlpha=1;

    // aim preview
    if(this.aim&&this.aimEnd&&this.st==='playing'){
      const dx=this.aim.x-this.aimEnd.x,dy=this.aim.y-this.aimEnd.y;
      const dist=Math.sqrt(dx*dx+dy*dy);
      const ang=Math.atan2(dy,dx);
      const pow=Math.min(dist,180);

      // trajectory sim
      const simSpd=Math.min(pow/180,1)*14;
      let sx=b.x,sy=b.y,svx=Math.cos(ang)*simSpd,svy=Math.sin(ang)*simSpd;
      const pts=[];
      for(let step=0;step<100;step++){
        let sax=0,say=0,dead=false;
        for(const body of this.bodies){
          const bdx=body.x-sx,bdy=body.y-sy;
          const bd=Math.sqrt(bdx*bdx+bdy*bdy);
          if(bd<body.r+b.r){dead=true;break;}
          const md=Math.max(bd,35),f=body.m/(md*md),dn=bd||1;
          if(body.type==='star'){sax-=(bdx/dn)*f;say-=(bdy/dn)*f;}
          else{sax+=(bdx/dn)*f;say+=(bdy/dn)*f;}
        }
        if(dead)break;
        svx+=sax*.25;svy+=say*.25;
        const sp=Math.sqrt(svx*svx+svy*svy);
        if(sp>20){svx=(svx/sp)*20;svy=(svy/sp)*20;}
        sx+=svx*.25;sy+=svy*.25;
        if(sx<-50||sx>W+50||sy<-50||sy>H+50)break;
        if(step%2===0) pts.push({x:sx,y:sy});
      }
      for(let i=0;i<pts.length;i++){
        const a=(1-i/pts.length)*.3;
        const sz=(1-i/pts.length)*2.5+.5;
        cx.fillStyle=`rgba(167,139,250,${a})`;cx.beginPath();cx.arc(pts[i].x,pts[i].y,sz,0,6.28);cx.fill();
      }
      // power text
      cx.font='600 13px Space Grotesk';cx.fillStyle=`rgba(255,255,255,${.35+pow/180*.4})`;
      cx.textAlign='center';cx.fillText(`${Math.round(pow/180*100)}%`,b.x,b.y-b.r*3-6);
    }

    cx.restore();
  },

  _drawPlanet(body,pulse,t){
    const fr=Math.sqrt(body.m)*1.6;
    const fg=cx.createRadialGradient(body.x,body.y,body.r,body.x,body.y,fr);
    fg.addColorStop(0,hx(body.col,.07));fg.addColorStop(1,hx(body.col,0));
    cx.fillStyle=fg;cx.beginPath();cx.arc(body.x,body.y,fr,0,6.28);cx.fill();
    glow(body.x,body.y,body.r*pulse,hx(body.col,.9),1.6);
    cx.fillStyle=hx(body.col,.15);cx.beginPath();cx.arc(body.x-body.r*.25,body.y-body.r*.25,body.r*.35,0,6.28);cx.fill();
  },

  _drawStar(body,pulse,t){
    const fr=Math.sqrt(body.m)*1.8;
    const fg=cx.createRadialGradient(body.x,body.y,body.r,body.x,body.y,fr);
    fg.addColorStop(0,hx(body.col,.05));fg.addColorStop(1,hx(body.col,0));
    cx.fillStyle=fg;cx.beginPath();cx.arc(body.x,body.y,fr,0,6.28);cx.fill();
    for(let i=0;i<8;i++){const a=(i/8)*6.28+t*.3,len=body.r*2*pulse;
      cx.strokeStyle=hx(body.col,.12);cx.lineWidth=2;cx.beginPath();
      cx.moveTo(body.x+Math.cos(a)*body.r,body.y+Math.sin(a)*body.r);
      cx.lineTo(body.x+Math.cos(a)*len,body.y+Math.sin(a)*len);cx.stroke();}
    glow(body.x,body.y,body.r*pulse,hx(body.col,1),2);
    cx.fillStyle='rgba(255,255,255,.3)';cx.beginPath();cx.arc(body.x,body.y,body.r*.55,0,6.28);cx.fill();
    // repel indicator: outward arrows
    for(let i=0;i<4;i++){
      const a=(i/4)*6.28+t*.5;
      const d=body.r+16+6*Math.sin(t*3+i);
      cx.strokeStyle=hx(body.col,.2);cx.lineWidth=1.5;
      cx.beginPath();cx.moveTo(body.x+Math.cos(a)*(d-6),body.y+Math.sin(a)*(d-6));
      cx.lineTo(body.x+Math.cos(a)*d,body.y+Math.sin(a)*d);cx.stroke();
    }
  },

  _drawBlackHole(body,t){
    const fr=Math.sqrt(body.m)*1.8;
    const fg=cx.createRadialGradient(body.x,body.y,body.r,body.x,body.y,fr);
    fg.addColorStop(0,'rgba(99,52,170,.1)');fg.addColorStop(.5,'rgba(99,52,170,.03)');fg.addColorStop(1,'rgba(99,52,170,0)');
    cx.fillStyle=fg;cx.beginPath();cx.arc(body.x,body.y,fr,0,6.28);cx.fill();
    cx.save();cx.translate(body.x,body.y);cx.rotate(t*1.5);
    const dg=cx.createLinearGradient(-body.r*2.5,0,body.r*2.5,0);
    dg.addColorStop(0,'rgba(167,139,250,0)');dg.addColorStop(.3,'rgba(167,139,250,.25)');
    dg.addColorStop(.5,'rgba(251,191,36,.35)');dg.addColorStop(.7,'rgba(167,139,250,.25)');dg.addColorStop(1,'rgba(167,139,250,0)');
    cx.strokeStyle=dg;cx.lineWidth=3;cx.beginPath();cx.ellipse(0,0,body.r*2.5,body.r*.7,0,0,6.28);cx.stroke();
    cx.restore();
    const bg=cx.createRadialGradient(body.x,body.y,0,body.x,body.y,body.r*1.5);
    bg.addColorStop(0,'rgba(0,0,0,1)');bg.addColorStop(.6,'rgba(0,0,0,.9)');bg.addColorStop(.85,'rgba(99,52,170,.25)');bg.addColorStop(1,'rgba(99,52,170,0)');
    cx.fillStyle=bg;cx.beginPath();cx.arc(body.x,body.y,body.r*1.5,0,6.28);cx.fill();
    // inward suction particles
    for(let i=0;i<3;i++){
      const a=t*2+i*2.1, d=body.r*3-((t*30+i*25)%(body.r*2));
      if(d>body.r){cx.globalAlpha=.15;cx.fillStyle='#a78bfa';cx.beginPath();cx.arc(body.x+Math.cos(a)*d,body.y+Math.sin(a)*d,1.5,0,6.28);cx.fill();cx.globalAlpha=1;}
    }
  },

  _drawPortal(x,y,col,t){
    for(let ring=2;ring>=0;ring--){
      const r=18+ring*6;
      cx.strokeStyle=hx(col,.2-.05*ring);cx.lineWidth=2;
      cx.beginPath();cx.ellipse(x,y,r,r*.6,t*2+ring*.6,0,6.28);cx.stroke();
    }
    const pg=cx.createRadialGradient(x,y,0,x,y,18);
    pg.addColorStop(0,hx(col,.5));pg.addColorStop(.7,hx(col,.2));pg.addColorStop(1,hx(col,0));
    cx.fillStyle=pg;cx.beginPath();cx.arc(x,y,18,0,6.28);cx.fill();
    for(let i=0;i<2;i++){
      const a=(i/2)*6.28+t*3;
      cx.strokeStyle=hx(col,.2);cx.lineWidth=1.5;cx.beginPath();
      for(let s=0;s<20;s++){const sa=a+s*.25,sr=(s/20)*16;
        s===0?cx.moveTo(x+Math.cos(sa)*sr,y+Math.sin(sa)*sr):cx.lineTo(x+Math.cos(sa)*sr,y+Math.sin(sa)*sr);}
      cx.stroke();
    }
  },

  _drawWormhole(g,t){
    cx.save();cx.translate(g.x,g.y);
    for(let ring=3;ring>=0;ring--){
      const r=g.r+ring*8;
      cx.strokeStyle=`rgba(52,211,153,${.1-.02*ring})`;cx.lineWidth=2;
      cx.beginPath();cx.ellipse(0,0,r,r*.6,this.whAngle+ring*.5,0,6.28);cx.stroke();
    }
    const wg=cx.createRadialGradient(0,0,0,0,0,g.r);
    wg.addColorStop(0,'rgba(52,211,153,.45)');wg.addColorStop(.5,'rgba(96,165,250,.25)');wg.addColorStop(1,'rgba(167,139,250,0)');
    cx.fillStyle=wg;cx.beginPath();cx.arc(0,0,g.r,0,6.28);cx.fill();
    for(let i=0;i<3;i++){const a=(i/3)*6.28+this.whAngle*3;
      cx.strokeStyle='rgba(52,211,153,.2)';cx.lineWidth=1.5;cx.beginPath();
      for(let s=0;s<25;s++){const sa=a+s*.2,sr=(s/25)*g.r;
        s===0?cx.moveTo(Math.cos(sa)*sr,Math.sin(sa)*sr):cx.lineTo(Math.cos(sa)*sr,Math.sin(sa)*sr);}
      cx.stroke();}
    cx.restore();
  }
};

/* ═══════════════════════════════════════════════
   INPUT
   ═══════════════════════════════════════════════ */
let mouseX=0,mouseY=0;

function pos(e){const t=e.touches?e.touches[0]:e;return{x:t.clientX,y:t.clientY};}
function dist(a,b){return Math.sqrt((a.x-b.x)**2+(a.y-b.y)**2);}

function nearBall(p){return G.ball&&dist(p,G.ball)<55;}
function nearBody(p){
  for(const b of G.bodies) if(b.drag&&dist(p,b)<b.r+20) return b;
  return null;
}

function onDown(e){
  e.preventDefault();
  const p=pos(e);

  // during playing or flying, check body drag first (unless near ball and playing)
  if(G.st==='playing'&&!G.ball.active&&nearBall(p)){
    G.aim=p; G.aimEnd=p; sfx.grab(); return;
  }

  const body=nearBody(p);
  if(body&&(G.st==='playing'||G.st==='flying')){
    G.drag=body; G.dragOff={x:p.x-body.x,y:p.y-body.y}; sfx.grab(); return;
  }
}

function onMove(e){
  e.preventDefault();
  const p=pos(e);
  mouseX=p.x; mouseY=p.y;
  if(G.aim) G.aimEnd=p;
  if(G.drag){
    G.drag.x=p.x-(G.dragOff?G.dragOff.x:0);
    G.drag.y=p.y-(G.dragOff?G.dragOff.y:0);
    if(G.drag.orbit) G.drag.orbit=null; // break orbit when manually dragged
  }
}

function onUp(e){
  e.preventDefault();
  if(G.aim&&G.aimEnd){
    const dx=G.aim.x-G.aimEnd.x,dy=G.aim.y-G.aimEnd.y;
    const d=Math.sqrt(dx*dx+dy*dy);
    if(d>15){const a=Math.atan2(dy,dx);G.launch(Math.min(d,180),a);}
    G.aim=G.aimEnd=null;
  }
  G.drag=null; G.dragOff=null;
}

CV.addEventListener('mousedown',onDown);
CV.addEventListener('mousemove',onMove);
CV.addEventListener('mouseup',onUp);
CV.addEventListener('touchstart',onDown,{passive:false});
CV.addEventListener('touchmove',onMove,{passive:false});
CV.addEventListener('touchend',onUp,{passive:false});
CV.addEventListener('contextmenu',e=>e.preventDefault());

// slow-mo button (for touch/mobile)
const smBtn=document.getElementById('slowmo-btn');
smBtn.addEventListener('mousedown',e=>{e.stopPropagation();G.slowmo=true;smBtn.classList.add('active');});
smBtn.addEventListener('mouseup',e=>{G.slowmo=false;smBtn.classList.remove('active');});
smBtn.addEventListener('mouseleave',e=>{G.slowmo=false;smBtn.classList.remove('active');});
smBtn.addEventListener('touchstart',e=>{e.preventDefault();e.stopPropagation();G.slowmo=true;smBtn.classList.add('active');},{passive:false});
smBtn.addEventListener('touchend',e=>{e.preventDefault();G.slowmo=false;smBtn.classList.remove('active');},{passive:false});

// keyboard slow-mo
const keys={};
addEventListener('keydown',e=>{
  keys[e.code]=true;
  if(e.code==='Space'){e.preventDefault();G.slowmo=true;smBtn.classList.add('active');}
  if(e.key==='r'||e.key==='R'){if(G.st==='playing'||G.st==='flying')G.restartLevel();}
  if(e.key==='Escape')G.menu();
});
addEventListener('keyup',e=>{
  keys[e.code]=false;
  if(e.code==='Space'){G.slowmo=false;smBtn.classList.remove('active');}
});

// cursor style
function updateCursor(){
  if(G.st==='playing'||G.st==='flying'){
    const p={x:mouseX,y:mouseY};
    if(G.drag){CV.style.cursor='grabbing';return;}
    if(nearBody(p)){CV.style.cursor='grab';return;}
    if(G.st==='playing'&&!G.ball.active&&nearBall(p)){CV.style.cursor='crosshair';return;}
  }
  CV.style.cursor='default';
}

/* ═══════════════════════════════════════════════
   LOOP
   ═══════════════════════════════════════════════ */
let last=0;
function loop(ts){
  const dt=Math.min((ts-last)/1000,.05);
  last=ts;
  G.update(dt);
  G.render(ts/1000);
  updateCursor();
  requestAnimationFrame(loop);
}
G.menu();
requestAnimationFrame(loop);
</script>
