<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wizard Brawl</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=VT323&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/games/wizard_brawl/src/style.css" />
</head>
<body>
  <a class="back-link" href="/personal/#games"><span>&larr;</span> Back</a>
  <canvas id="game"></canvas>

  <div id="compiler-overlay" class="hidden">
    <div class="terminal">
      <div class="terminal-header">
        <span class="term-dot red"></span>
        <span class="term-dot yellow"></span>
        <span class="term-dot green"></span>
        <span class="term-title">SPELL FORGE — <span id="compile-player-label">PLAYER ?</span></span>
      </div>
      <div class="terminal-body">
        <div id="compile-prompt" class="term-line">
          <span class="term-system">[CHAOS GOBLIN]</span> You got bonked. Take your time and rage-craft your next weapon.
        </div>
        <div id="compile-mods-display"></div>
        <div class="term-input-row">
          <span class="term-caret">&gt;</span>
          <input type="text" id="compile-input" placeholder="Describe any weapon or object you want..." autocomplete="off" maxlength="800" />
        </div>
        <div class="term-hint">Press ENTER to unleash chaos. Be unhinged. Literally anything works.</div>
        <div id="compile-output" class="hidden"></div>
      </div>
    </div>
  </div>

  <div id="codex-overlay" class="hidden">
    <div class="codex-panel">
      <div class="codex-title">Chaos Codex</div>
      <div id="codex-stats" class="codex-stats"></div>
      <div id="codex-list" class="codex-list"></div>
      <div class="codex-hint">Press C or ESC to close</div>
    </div>
  </div>

  <script src="/games/wizard_brawl/src/intro.js"></script>
  <script src="/games/wizard_brawl/src/main.js"></script>
</body>
</html>
