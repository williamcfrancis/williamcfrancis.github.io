<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wishforge Duel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=VT323&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/games/junkcode_brawlers/src/style.css" />
</head>
<body>
  <a class="back-link" href="/personal/#games"><span>&larr;</span> Back</a>
  <canvas id="game"></canvas>

  <div id="compiler-overlay" class="hidden">
    <div class="terminal">
      <div class="terminal-header">
        <span class="term-dot red"></span>
        <span class="term-dot yellow"></span>
        <span class="term-dot green"></span>
        <span class="term-title">WISH FORGE — <span id="compile-player-label">PLAYER ?</span></span>
      </div>
      <div class="terminal-body">
        <div id="compile-prompt" class="term-line">
          <span class="term-system">[FAE SMITH]</span> Round lost. You have <span id="compile-timer" class="term-highlight">60</span>s to whisper your next relic wish.
        </div>
        <div id="compile-mods-display"></div>
        <div class="term-input-row">
          <span class="term-caret">&gt;</span>
          <input type="text" id="compile-input" placeholder="Describe any weapon or object you want..." autocomplete="off" maxlength="400" />
        </div>
        <div class="term-hint">Press ENTER to forge the wish. Be vivid and specific. Any object is valid.</div>
        <div id="compile-output" class="hidden"></div>
      </div>
    </div>
  </div>

  <script src="/games/junkcode_brawlers/src/main.js"></script>
</body>
</html>
