    <style>
        body { margin: 0; padding: 0; background: #000; }

        @keyframes fadeUp {
            from { opacity: 1; transform: translateY(0); }
            to { opacity: 0; transform: translateY(-40px); }
        }
        @keyframes wiggle {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-15deg); }
            75% { transform: rotate(15deg); }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes zoomIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }
        @keyframes spinSlow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        @keyframes surgeGlow {
            0%, 100% { box-shadow: 0 0 8px currentColor, inset 0 0 8px rgba(255,255,255,0.05); }
            50% { box-shadow: 0 0 25px currentColor, 0 0 50px currentColor, inset 0 0 15px rgba(255,255,255,0.1); }
        }
        @keyframes qteSlide {
            from { transform: translate(-50%, -20px); opacity: 0; }
            to { transform: translate(-50%, 0); opacity: 1; }
        }
        @keyframes targetPop {
            0% { transform: scale(0.3); opacity: 0; }
            60% { transform: scale(1.15); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes comboBurst {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }
        @keyframes dilemmaSlide {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        @keyframes blockerPulse {
            0%, 100% { opacity: 0.92; }
            50% { opacity: 1; }
        }
        @keyframes seqFlash {
            0% { transform: scale(1); box-shadow: none; }
            50% { transform: scale(1.2); box-shadow: 0 0 20px rgba(251,191,36,0.6); }
            100% { transform: scale(1); box-shadow: none; }
        }

        .animate-fade-up { animation: fadeUp 0.8s ease-out forwards; }
        .animate-wiggle { animation: wiggle 0.3s ease-in-out infinite; }
        .animate-spin-slow { animation: spinSlow 3s linear infinite; }
        .animate-surge { animation: surgeGlow 0.6s ease-in-out infinite; }
        .animate-qte { animation: qteSlide 0.25s ease-out both; }
        .animate-target-pop { animation: targetPop 0.3s ease-out both; }
        .animate-combo-burst { animation: comboBurst 0.4s ease-out; }
        .animate-dilemma { animation: dilemmaSlide 0.3s ease-out both; }
        .animate-blocker { animation: blockerPulse 1.5s ease-in-out infinite; }
        .animate-seq-flash { animation: seqFlash 0.5s ease-out; }

        .animate-in.fade-in { animation: fadeIn 0.5s ease-out both; }
        .animate-in.zoom-in { animation: zoomIn 1s ease-out both; }

        .grayscale-mode { filter: grayscale(1) !important; transition: filter 0.5s; }

        .scrollbar-none::-webkit-scrollbar { display: none; }
        .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
        .scrollbar-thin::-webkit-scrollbar { width: 4px; }
        .scrollbar-thin::-webkit-scrollbar-track { background: transparent; }
        .scrollbar-thin::-webkit-scrollbar-thumb { background: #1f2937; border-radius: 4px; }

        .mask-image-linear-to-t {
            -webkit-mask-image: linear-gradient(to top, black 60%, transparent);
            mask-image: linear-gradient(to top, black 60%, transparent);
        }

        .glitch-text {
            text-shadow: 2px 2px #ff0000, -2px -2px #00ff00;
        }
    </style>

            spawnFloaterRef.current = spawnFloater;

            const getPhase = (te) => te >= 30000 ? 3 : te >= 10000 ? 2 : 1;

                    loopRef.current = requestAnimationFrame(gameTick);

                const state = gameState.current;
                const now = performance.now();
                const pu = purchasedRef.current;

                // Phase calculation
                const newPhase = getPhase(state.totalEngagement);

                    if (newPhase === 2) addLog("PHASE 2: User installed Screen Time tracker!", "warning");

                    state.qteNextTime = now + 20000;

                    state.engagement += gain;
                    state.totalEngagement += gain;
                    state.revenue += gain * 0.02;
                    state.brainHealth = Math.max(0, state.brainHealth - (deltaTime * (pps / 150) * brainDecayMod));
                    state.anxiety = Math.min(100, state.anxiety + (deltaTime * 0.3));
                    if (pu.includes('auto_play')) state.anxiety = Math.min(100, state.anxiety + deltaTime * 0.5);
                    if (pu.includes('digital_twin')) state.brainHealth = Math.min(30, state.brainHealth);

                    // Life impact passive tracking
                    if (state.scenario === 'BEDTIME') state.lifeImpact.sleepLost += deltaTime * 0.008;
                    if (state.scenario === 'WORK') state.lifeImpact.productivityLost += deltaTime * 0.006;
                    state.lifeImpact.moneyWasted += deltaTime * 0.002;
                }

                // 2. Scenario & Mood Cycling
                if (timestamp > state.lastScenarioTime + 30000) {
                    const scenarios = ['BEDTIME', 'WORK', 'COMMUTE', 'SOCIAL', 'BATHROOM'];
                    state.scenario = scenarios[Math.floor(Math.random() * scenarios.length)];
                    state.lastScenarioTime = timestamp;
                    addLog('User moved to: ' + SCENARIOS[state.scenario].label, 'info');
                }

                const moodInterval = state.phase >= 2 ? 5000 : 8000;
                if (timestamp > state.lastMoodTime + moodInterval) {
                    const moods = ['BORED', 'ANGRY', 'LONELY', 'INSECURE'];
                    if (state.nextMood) {
                        state.userMood = state.nextMood;
                        state.nextMood = null;
                    } else {
                        state.userMood = moods[Math.floor(Math.random() * moods.length)];
                    }
                    state.lastMoodTime = timestamp;
                    state.moodSurgeCategory = MOOD_TO_CATEGORY[state.userMood] || null;
                    state.moodSurgeUntil = now + 4000;
                    // Sentiment AI: pre-compute next mood
                    if (pu.includes('sentiment_analysis')) {
                        state.nextMood = moods[Math.floor(Math.random() * moods.length)];
                    }
                }

                // 3. QTE System
                const qteFreqMod = pu.includes('variable_rewards') ? 0.5 : 1;
                const qteDurMod = pu.includes('variable_rewards') ? 0.6 : 1;
                const qteRewMod = pu.includes('variable_rewards') ? 3 : 1;

                if (!state.qteActive && !state.isResisting && state.brainHealth > 0 && now > state.qteNextTime && state.totalEngagement > 100) {
                    const key = QTE_KEYS[Math.floor(Math.random() * QTE_KEYS.length)];
                    state.qteActive = { key, startTime: now, duration: 3500 * qteDurMod, reward: Math.floor((100 + Math.random() * 200) * qteRewMod) };
                    state.qteNextTime = now + (15000 + Math.random() * 15000) * qteFreqMod;
                }

                    state.anxiety = Math.min(100, state.anxiety + 5);
                    addLog("QTE MISSED! Engagement window lost.", "error");
                    state.qteActive = null;

                    if (eligible.length > 0) {
                        const ev = eligible[Math.floor(Math.random() * eligible.length)];
                        state.dilemmaActive = { ...ev, startTime: now, duration: 6000 };
                        state.dilemmaNextTime = now + 20000 + Math.random() * 15000;
                    }

                    state.engagement = Math.max(0, state.engagement + (t.fx.engagement || 0));
                    state.totalEngagement = Math.max(0, state.totalEngagement + Math.max(0, t.fx.engagement || 0));
                    state.brainHealth = Math.max(0, Math.min(100, state.brainHealth + (t.fx.brain || 0)));
                    state.anxiety = Math.max(0, Math.min(100, state.anxiety + (t.fx.anxiety || 0)));
                    if (t.fx.lifeImpact) { for (const k in t.fx.lifeImpact) state.lifeImpact[k] = (state.lifeImpact[k] || 0) + t.fx.lifeImpact[k]; }
                    addLog("TIMEOUT: " + t.msg, "error");
                    state.dilemmaActive = null;
                }

                // 5. Phase 2: Screen Time Reminder
                if (state.phase >= 2 && !state.screenTimeActive && !state.isResisting && !state.dilemmaActive && now > state.screenTimeNextTime && state.brainHealth > 0) {
                    state.screenTimeActive = true;
                    state.screenTimeDeadline = now + 8000;
                }
                if (state.screenTimeActive && now > state.screenTimeDeadline) {
                    state.engagement = Math.max(0, state.engagement - 300);
                    state.screenTimeActive = false;
                    state.screenTimeNextTime = now + 25000 + Math.random() * 15000;
                    addLog("Screen Time auto-dismissed! \u2212300 engagement.", "error");
                }

                // Phase 3: Grayscale Mode
                if (state.phase >= 3 && now > state.grayscaleNextTime && state.grayscaleUntil < now) {
                    state.grayscaleUntil = now + 10000;
                    state.grayscaleNextTime = now + 30000 + Math.random() * 15000;
                    addLog("COUNTER-MEASURE: Grayscale Mode!", "warning");
                }

                // Phase 3: Digital Wellbeing Blocker
                if (state.phase >= 3 && now > state.blockerNextTime && state.blockerUntil < now && !state.isResisting && !state.dilemmaActive) {
                    state.blockerUntil = now + 4000;
                    state.blockerNextTime = now + 20000 + Math.random() * 15000;
                    addLog("BLOCKED: Digital Wellbeing check!", "warning");
                }

                // 6. Auto-Recovery
                if (state.brainHealth <= 0) {
                    if (state.autoRecoverAt === 0) state.autoRecoverAt = now + 8000;
                    else if (now > state.autoRecoverAt) {
                        state.brainHealth = 20;
                        state.anxiety = Math.max(0, state.anxiety - 20);
                        state.autoRecoverAt = 0;
                        addLog("AUTO-RECOVERY: Subject rebooted device.", "info");
                    }
                } else { state.autoRecoverAt = 0; }

                // 7. Resistance Logic
                if (state.isResisting) {
                    const resistTimeCap = state.phase >= 3 ? 6000 : 8000;

                    // Grid resistance
                    if (state.resistType === 'grid') {
                        const cycleSpeed = state.activeAbilities.includes('golden_handcuffs') ? 800 : 500;
                        if (now - state.lastResistToggle > cycleSpeed) {
                            const newGrid = new Array(9).fill(false);
                            const count = 3 + Math.floor(Math.random() * 3);
                            const positions = new Set();
                            while (positions.size < count) positions.add(Math.floor(Math.random() * 9));
                            positions.forEach(function(p) { newGrid[p] = true; });
                            state.resistGrid = newGrid;
                            state.lastResistToggle = now;
                        }
                    }

                    // Sequence resistance
                    if (state.resistType === 'sequence' && state.resistSequencePhase === 'show') {
                        if (now - state.resistSequenceLastShow > 650) {
                            state.resistSequenceShowIdx++;
                            state.resistSequenceLastShow = now;
                            if (state.resistSequenceShowIdx >= state.resistSequence.length) {
                                state.resistSequencePhase = 'input';
                                state.resistSequenceInput = [];
                            }
                        }
                    }

                    // Moving targets resistance
                    if (state.resistType === 'moving') {
                        state.resistMovingTargets = state.resistMovingTargets
                            .map(t => ({ ...t, x: t.x + t.speed * deltaTime }))
                            .filter(t => t.x < 1.15);
                        if (now > state.resistMovingNextSpawn) {
                            state.resistMovingTargets.push({
                                id: now + Math.random(), x: -0.08,
                                y: 0.1 + Math.random() * 0.7,
                                iconIdx: Math.floor(Math.random() * NOTIFICATION_ICONS.length),
                                speed: 0.12 + Math.random() * 0.12 + (state.phase - 1) * 0.04,
                            });
                            state.resistMovingNextSpawn = now + 500 + Math.random() * 500;
                        }
                    }

                    state.resistanceHealth = Math.min(100, (state.resistHits / state.resistHitsNeeded) * 100);

                    // Voodoo Model: auto-win resistance
                    if (pu.includes('digital_twin')) {
                        state.resistHits = state.resistHitsNeeded;
                        state.resistanceHealth = 100;
                    }

                    // Golden handcuffs during grid
                    if (state.activeAbilities.includes('golden_handcuffs') && state.resistType === 'grid') {
                        state.resistHits = Math.min(state.resistHitsNeeded, state.resistHits + deltaTime * 2);
                        state.resistanceHealth = Math.min(100, (state.resistHits / state.resistHitsNeeded) * 100);
                    }

                    // WIN
                    if (state.resistHits >= state.resistHitsNeeded) {
                        state.isResisting = false;
                        state.anxiety = Math.max(0, state.anxiety - 15);
                        state.streak = Math.min(10, state.streak + 1);
                        state.immunityUntil = now + 5000;
                        state.resistGrid = new Array(9).fill(false);
                        state.resistMovingTargets = [];
                        state.engagement += 200;
                        addLog("Crisis averted. User recaptured! +200 bonus", "success");
                    }

                    // LOSE
                    if (state.isResisting && now > state.resistDeadline) {
                        state.isResisting = false;
                        state.brainHealth = Math.min(100, state.brainHealth + 30);
                        state.anxiety = Math.max(0, state.anxiety - 40);
                        state.streak = 1;
                        state.engagement = Math.max(0, state.engagement * 0.75);
                        state.immunityUntil = now + 10000;
                        state.resistGrid = new Array(9).fill(false);
                        state.resistMovingTargets = [];
                        state.lifeImpact.relationshipsDamaged += 0.3;
                        addLog("CRITICAL FAIL: User disconnected.", "error");
                    }
                } else {
                    if (now > state.immunityUntil && state.totalEngagement > 200 && state.brainHealth > 0) {
                        let chance = 0.0005;
                        if (state.brainHealth > 80) chance += 0.001;
                        if (state.anxiety > 95) chance += 0.01;
                        chance *= SCENARIOS[state.scenario].resistChanceMod;
                        if (pu.includes('subliminal')) chance *= 1.3;
                        if (state.activeAbilities.includes('golden_handcuffs')) chance = 0;

                        if (Math.random() < chance) {
                            state.isResisting = true;
                            state.resistHits = 0;
                            const baseHits = state.phase >= 3 ? 15 : state.phase >= 2 ? 13 : 10;
                            state.resistHitsNeeded = baseHits + Math.floor(Math.random() * 4);
                            const resistTime = state.phase >= 3 ? 6000 : 8000;
                            state.resistDeadline = now + resistTime;
                            state.resistanceHealth = 0;

                            // Pick random resistance type
                            const types = ['grid', 'sequence', 'moving'];
                            state.resistType = types[Math.floor(Math.random() * types.length)];

                            if (state.resistType === 'grid') {
                                const newGrid = new Array(9).fill(false);
                                const count = 3 + Math.floor(Math.random() * 3);
                                const positions = new Set();
                                while (positions.size < count) positions.add(Math.floor(Math.random() * 9));
                                positions.forEach(function(p) { newGrid[p] = true; });
                                state.resistGrid = newGrid;
                                state.lastResistToggle = now;
                            } else if (state.resistType === 'sequence') {
                                const seqLen = 4 + Math.floor(Math.random() * 3);
                                state.resistSequence = Array.from({ length: seqLen }, () => Math.floor(Math.random() * 9));
                                state.resistSequenceInput = [];
                                state.resistSequencePhase = 'show';
                                state.resistSequenceShowIdx = -1;
                                state.resistSequenceLastShow = now;
                            } else {
                                state.resistMovingTargets = [];
                                state.resistMovingNextSpawn = now + 300;
                            }

                            if (state.anxiety > 95) addLog("\u26A0\uFE0F PANIC ATTACK: User overwhelmed!", "warning");
                            else if (state.scenario === 'SOCIAL') addLog("\u26A0\uFE0F PEER PRESSURE: Friends engaging user.", "warning");
                            else addLog("\u26A0\uFE0F CLARITY: User putting phone down.", "warning");
                        }
                    }
                }

                // 8. Random Flavor Logs
                if (timestamp > state.lastLogTime) {
                    const event = LOG_TEMPLATES[Math.floor(Math.random() * LOG_TEMPLATES.length)];
                    if (!state.isResisting) addLog(event.msg, event.type);
                    state.lastLogTime = timestamp + (Math.random() * 8000 + 4000);
                }

                // Sync to UI
                setUiState({
                    engagement: state.engagement, totalEngagement: state.totalEngagement,
                    streak: state.streak, brainHealth: state.brainHealth, anxiety: state.anxiety,
                    revenue: state.revenue, resistanceHealth: state.resistanceHealth,
                    isResisting: state.isResisting, userMood: state.userMood, scenario: state.scenario,
                    activeAbilities: [...state.activeAbilities], abilityCooldowns: { ...state.abilityCooldowns },
                    comboChain: [...state.comboChain], moodSurgeUntil: state.moodSurgeUntil,
                    moodSurgeCategory: state.moodSurgeCategory,
                    qteActive: state.qteActive ? { ...state.qteActive } : null,
                    resistGrid: [...state.resistGrid], autoRecoverAt: state.autoRecoverAt,
                    resistDeadline: state.resistDeadline, resistHits: state.resistHits,
                    resistHitsNeeded: state.resistHitsNeeded,
                    phase: state.phase,
                    grayscaleUntil: state.grayscaleUntil, blockerUntil: state.blockerUntil,
                    screenTimeActive: state.screenTimeActive, screenTimeDeadline: state.screenTimeDeadline,
                    dilemmaActive: state.dilemmaActive ? { ...state.dilemmaActive } : null,
                    lifeImpact: { ...state.lifeImpact },
                    resistType: state.resistType,
                    resistSequence: [...state.resistSequence], resistSequenceInput: [...state.resistSequenceInput],
                    resistSequencePhase: state.resistSequencePhase, resistSequenceShowIdx: state.resistSequenceShowIdx,
                    resistMovingTargets: state.resistMovingTargets.map(t => ({ ...t })),
                    nextMood: state.nextMood,
                });

                loopRef.current = requestAnimationFrame(gameTick);
            }, [calculatePPS, addLog, gameStarted, isSingularity]);

            useEffect(() => {
                loopRef.current = requestAnimationFrame(gameTick);
                return () => { if (loopRef.current) cancelAnimationFrame(loopRef.current); };
            }, [gameTick]);

            // Keyboard handler
            useEffect(() => {
                if (!gameStarted || isSingularity) return;
                const handleKeyDown = (e) => {
                    const state = gameState.current;
                    if (e.code === 'Space' && state.isResisting && state.resistType === 'grid') {
                        e.preventDefault();
                        const litPositions = [];
                        for (let i = 0; i < state.resistGrid.length; i++) { if (state.resistGrid[i]) litPositions.push(i); }
                        if (litPositions.length > 0) handleResistGridClick(litPositions[Math.floor(Math.random() * litPositions.length)]);
                        return;
                    }
                    if (state.qteActive && e.key.toUpperCase() === state.qteActive.key) {
                        e.preventDefault();
                        const reward = state.qteActive.reward;
                        state.engagement += reward; state.totalEngagement += reward;
                        state.qteActive = null;
                        addLog("QTE HIT! +" + reward + " engagement.", "success");
                        if (spawnFloaterRef.current) spawnFloaterRef.current(window.innerWidth / 2, 150, '+' + reward + ' QTE!', 'text-cyan-400 font-black text-xl');
                    }
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [gameStarted, isSingularity, addLog]);

            // ============================================================
            // INTERACTIONS
            // ============================================================

            const activateAbility = (ability) => {
                const state = gameState.current;
                const now = Date.now();
                if (state.abilityCooldowns[ability.id] && now < state.abilityCooldowns[ability.id]) return;
                state.activeAbilities.push(ability.id);
                state.abilityCooldowns[ability.id] = now + ability.cooldown;
                addLog('ACTIVATED: ' + ability.label, 'success');
                if (ability.id === 'flame_war') {
                    const conversion = state.anxiety * 10;
                    state.engagement += conversion; state.anxiety = 0;
                    spawnFloater(window.innerWidth / 2, window.innerHeight / 2, '+' + Math.floor(conversion) + ' (RAGE)', 'text-red-500 font-black text-2xl');
                }
                if (ability.id === 'love_bomb') {
                    state.brainHealth = Math.min(100, state.brainHealth + 10);
                    state.engagement += 500;
                    spawnFloater(window.innerWidth / 2, window.innerHeight / 2, 'HEALED & HOOKED', 'text-pink-400 font-black text-2xl');
                }
                setTimeout(() => {
                    gameState.current.activeAbilities = gameState.current.activeAbilities.filter(id => id !== ability.id);
                    addLog(ability.label + ' expired.', 'info');
                }, ability.duration);
            };

            const handleActionClick = (action, e) => {
                const state = gameState.current;
                if (state.isResisting || state.brainHealth <= 0) return;
                if (performance.now() < state.blockerUntil) return;

                const rect = e.currentTarget.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;

                let isMatch = false;
                if (state.userMood === 'BORED' && action.categoryId === 'ENTERTAINMENT') isMatch = true;
                if (state.userMood === 'ANGRY' && action.categoryId === 'OUTRAGE') isMatch = true;
                if (state.userMood === 'LONELY' && action.categoryId === 'SOCIAL') isMatch = true;
                if (state.userMood === 'INSECURE' && action.categoryId === 'VALIDATION') isMatch = true;
                if (state.userMood === 'NEUTRAL') isMatch = true;

                if (isMatch) {
                    // Backfire check
                    let backfireChance = action.backfireChance || 0;
                    if (hasUpgrade('sentiment_analysis')) backfireChance += 0.05;
                    if (state.phase >= 2 && Math.random() < backfireChance) {
                        state.anxiety = Math.min(100, state.anxiety + 10);
                        spawnFloater(x, y, 'BACKFIRED!', 'text-orange-500 font-black text-lg');
                        addLog("ACTION BACKFIRED! User got suspicious.", "error");
                        if (Math.random() < 0.5 && performance.now() > state.immunityUntil) {
                            state.isResisting = true;
                            state.resistHits = 0;
                            state.resistHitsNeeded = 10 + Math.floor(Math.random() * 4);
                            state.resistDeadline = performance.now() + (state.phase >= 3 ? 6000 : 8000);
                            state.resistanceHealth = 0;
                            state.resistType = 'grid';
                            const newGrid = new Array(9).fill(false);
                            const count = 3 + Math.floor(Math.random() * 3);
                            const positions = new Set();
                            while (positions.size < count) positions.add(Math.floor(Math.random() * 9));
                            positions.forEach(function(p) { newGrid[p] = true; });
                            state.resistGrid = newGrid;
                            state.lastResistToggle = performance.now();
                            addLog("\u26A0\uFE0F BACKFIRE TRIGGERED RESISTANCE!", "warning");
                        }
                        return;
                    }

                    let yieldMod = 1.0;
                    if (state.lastActionCategory === action.categoryId) {
                        yieldMod = 0.4;
                        spawnFloater(x, y - 40, "REPETITIVE", 'text-gray-400 text-xs font-mono');
                    }
                    state.lastActionCategory = action.categoryId;

                    const scenarioMod = SCENARIOS[state.scenario].yieldMod;
                    const abilityMod = state.activeAbilities.includes('dopamine_rush') ? 2 : 1;
                    const subliminalMod = hasUpgrade('subliminal') ? 1.5 : 1;
                    const echoMod = (hasUpgrade('radicalization') && action.categoryId === 'OUTRAGE') ? 2 : 1;

                    const pNow = performance.now();
                    let surgeMod = 1.0;
                    if (pNow < state.moodSurgeUntil && action.categoryId === state.moodSurgeCategory) {
                        surgeMod = 3.0;
                        spawnFloater(x, y - 30, "SURGE x3!", 'text-cyan-400 font-black text-sm');
                    }

                    const finalYield = action.baseYield * state.streak * yieldMod * scenarioMod * abilityMod * surgeMod * subliminalMod * echoMod;
                    state.engagement += finalYield;
                    state.totalEngagement += finalYield;
                    state.streak = Math.min(10, state.streak + 0.1);
                    spawnFloater(x, y, '+' + Math.floor(finalYield), 'text-white font-bold');

                    state.anxiety = Math.max(0, Math.min(100, state.anxiety + action.effects.anxiety));
                    state.brainHealth = Math.max(0, state.brainHealth + action.effects.brain);
                    if (action.effects.anxiety > 5) spawnFloater(x, y - 20, "ANXIETY UP", 'text-red-500 font-mono text-[10px]');
                    if (action.effects.anxiety < -5) spawnFloater(x, y - 20, "CALMING", 'text-blue-400 font-mono text-[10px]');

                    // Life impact from specific actions
                    if (action.id === 'fomo' || action.id === 'surface_ex') state.lifeImpact.relationshipsDamaged += 0.05;
                    if (action.id === 'filter_ad') state.lifeImpact.moneyWasted += 0.1;

                    // Combo chain (disabled if Infinite Scroll purchased)
                    if (!hasUpgrade('infinite_scroll')) {
                        state.comboChain.push(action.categoryId);
                        if (state.comboChain.length > 4) state.comboChain.shift();
                        if (state.comboChain.length === 4 && new Set(state.comboChain).size === 4) {
                            const comboBonus = 500;
                            state.engagement += comboBonus;
                            state.totalEngagement += comboBonus;
                            state.comboChain = [];
                            spawnFloater(x, y - 50, 'FULL COMBO! +500', 'text-purple-400 font-black text-lg');
                            addLog("FULL COMBO! All 4 neurochemicals engaged!", "success");
                        }
                    }
                } else {
                    state.streak = 1;
                    spawnFloater(x, y, "IGNORED", 'text-gray-500 font-mono');
                    addLog("User scrolled past. Mismatch.", "error");
                }
            };

            const handleDilemmaChoice = (choice) => {
                const state = gameState.current;
                if (!state.dilemmaActive) return;
                const fx = choice.fx;
                state.engagement = Math.max(0, state.engagement + (fx.engagement || 0));
                state.totalEngagement = Math.max(0, state.totalEngagement + Math.max(0, fx.engagement || 0));
                state.brainHealth = Math.max(0, Math.min(100, state.brainHealth + (fx.brain || 0)));
                state.anxiety = Math.max(0, Math.min(100, state.anxiety + (fx.anxiety || 0)));
                if (fx.resetStreak) state.streak = 1;
                if (fx.lifeImpact) { for (const k in fx.lifeImpact) state.lifeImpact[k] = (state.lifeImpact[k] || 0) + fx.lifeImpact[k]; }
                if (fx.triggerResist && Math.random() < fx.triggerResist) {
                    addLog("Dilemma fallout: resistance triggered!", "warning");
                }
                addLog("Dilemma resolved: " + choice.label, fx.engagement >= 0 ? "success" : "warning");
                state.dilemmaActive = null;
            };

            const handleRecoveryClick = (action, e) => {
                const state = gameState.current;
                if (state.engagement < action.cost) return;
                const rect = e.currentTarget.getBoundingClientRect();
                const x = e.clientX - rect.left; const y = e.clientY - rect.top;
                state.engagement -= action.cost;
                state.brainHealth = Math.min(100, state.brainHealth + action.brain);
                state.anxiety = Math.max(0, state.anxiety + action.anxiety);
                state.autoRecoverAt = 0;
                spawnFloater(x, y, 'HEALING', 'text-green-400 font-bold');
                if (action.cost > 0) spawnFloater(x, y - 20, '-' + action.cost + ' PTS', 'text-red-400 font-mono text-[10px]');
                addLog('Administered: ' + action.label, 'success');
            };

            const handleResistGridClick = (position) => {
                const state = gameState.current;
                if (!state.isResisting || state.resistType !== 'grid') return;
                if (!state.resistGrid[position]) {
                    state.resistDeadline = Math.max(performance.now(), state.resistDeadline - 300);
                    if (spawnFloaterRef.current) spawnFloaterRef.current(window.innerWidth / 2 + (Math.random() - 0.5) * 80, window.innerHeight / 2, "MISS! -0.3s", 'text-gray-500 font-mono text-sm');
                    return;
                }
                state.resistGrid[position] = false;
                state.resistHits += 1;
                state.resistanceHealth = Math.min(100, (state.resistHits / state.resistHitsNeeded) * 100);
                state.engagement += 20;
                const labels = ['PING!', 'BUZZ!', 'DING!', 'ALERT!', 'NOTIFY!', 'SENT!', 'READ!', 'OPEN!'];
                if (spawnFloaterRef.current) spawnFloaterRef.current(window.innerWidth / 2 + (Math.random() - 0.5) * 140, window.innerHeight / 2 + (Math.random() - 0.5) * 80, labels[Math.floor(Math.random() * labels.length)], 'text-red-400 font-bold text-lg');
                if (state.resistHits >= state.resistHitsNeeded) {
                    state.isResisting = false; state.anxiety = Math.max(0, state.anxiety - 15);
                    state.streak = Math.min(10, state.streak + 1); state.immunityUntil = performance.now() + 5000;
                    state.resistGrid = new Array(9).fill(false); state.engagement += 200;
                    addLog("Crisis averted. User recaptured! +200 bonus", "success");
                    if (spawnFloaterRef.current) spawnFloaterRef.current(window.innerWidth / 2, window.innerHeight / 2 - 40, 'RECAPTURED!', 'text-green-400 font-black text-2xl');
                }
            };

            const handleSequenceClick = (idx) => {
                const state = gameState.current;
                if (!state.isResisting || state.resistType !== 'sequence' || state.resistSequencePhase !== 'input') return;
                const expected = state.resistSequence[state.resistSequenceInput.length];
                if (idx === expected) {
                    state.resistSequenceInput.push(idx);
                    state.resistHits += 1;
                    state.engagement += 15;
                    if (spawnFloaterRef.current) spawnFloaterRef.current(window.innerWidth / 2 + (Math.random() - 0.5) * 100, window.innerHeight / 2, 'CORRECT!', 'text-green-400 font-bold');
                    if (state.resistSequenceInput.length >= state.resistSequence.length) {
                        state.resistHits += 3;
                        addLog("Sequence complete! Bonus hits!", "success");
                        const seqLen = 4 + Math.floor(Math.random() * 3);
                        state.resistSequence = Array.from({ length: seqLen }, () => Math.floor(Math.random() * 9));
                        state.resistSequenceInput = [];
                        state.resistSequencePhase = 'show';
                        state.resistSequenceShowIdx = -1;
                        state.resistSequenceLastShow = performance.now();
                    }
                } else {
                    state.resistDeadline = Math.max(performance.now(), state.resistDeadline - 500);
                    state.resistSequenceInput = [];
                    state.resistSequencePhase = 'show';
                    state.resistSequenceShowIdx = -1;
                    state.resistSequenceLastShow = performance.now();
                    if (spawnFloaterRef.current) spawnFloaterRef.current(window.innerWidth / 2, window.innerHeight / 2, 'WRONG! -0.5s', 'text-red-500 font-bold');
                }
                state.resistanceHealth = Math.min(100, (state.resistHits / state.resistHitsNeeded) * 100);
            };

            const handleMovingTargetClick = (targetId) => {
                const state = gameState.current;
                if (!state.isResisting || state.resistType !== 'moving') return;
                state.resistMovingTargets = state.resistMovingTargets.filter(t => t.id !== targetId);
                state.resistHits += 1;
                state.engagement += 15;
                state.resistanceHealth = Math.min(100, (state.resistHits / state.resistHitsNeeded) * 100);
                if (spawnFloaterRef.current) spawnFloaterRef.current(window.innerWidth / 2 + (Math.random() - 0.5) * 120, window.innerHeight / 2 + (Math.random() - 0.5) * 60, 'CAUGHT!', 'text-yellow-400 font-bold');
            };

            const handleScreenTimeDismiss = () => {
                const state = gameState.current;
                state.engagement = Math.max(0, state.engagement - 150);
                state.screenTimeActive = false;
                state.screenTimeNextTime = performance.now() + 25000 + Math.random() * 15000;
                addLog("Screen Time dismissed. \u2212150 engagement.", "warning");
            };

            const buyUpgrade = (upgrade) => {
                const state = gameState.current;
                if (state.engagement >= upgrade.cost && !purchasedUpgrades.includes(upgrade.id)) {
                    state.engagement -= upgrade.cost;
                    setPurchasedUpgrades(prev => [...prev, upgrade.id]);
                    addLog('Algorithm Evolved: ' + upgrade.name, "success");
                    if (upgrade.id === 'infinite_scroll') { state.comboChain = []; addLog("TRADE-OFF: Combo system disabled.", "warning"); }
                }
            };

            // ============================================================
            // UI COMPONENTS
            // ============================================================

            const ResistTimer = ({ deadline }) => {
                const [remaining, setRemaining] = useState(0);
                useEffect(() => {
                    const interval = setInterval(() => setRemaining(Math.max(0, deadline - performance.now())), 50);

                                        <AlertTriangle size={24} className="text-red-500 mb-1" />
                                        <p className="font-bold text-red-500 text-center px-2 text-xs leading-tight">{uiState.anxiety > 90 ? 'PANIC' : 'LEAVING'}</p>
                                        <div className="w-20 h-1 bg-gray-800 mt-1 rounded-full overflow-hidden"><div className="h-full bg-red-500 transition-all duration-100" style={{ width: uiState.resistanceHealth + '%' }}></div></div>
                                    </div>
                                )}
                            </div>
                            <div className="w-full space-y-2 px-2">
                                <div className="space-y-0.5">
                                    <div className="flex justify-between text-[10px] font-mono text-gray-400 uppercase"><span>Cognitive Function</span><span>{Math.round(uiState.brainHealth)}%</span></div>
                                    <div className="h-1.5 bg-gray-800 rounded-full overflow-hidden"><div className={'h-full transition-all duration-300 rounded-full ' + (uiState.brainHealth < 30 ? 'bg-red-500' : 'bg-blue-500')} style={{ width: uiState.brainHealth + '%' }}></div></div>
                                </div>
                                <div className="space-y-0.5">
                                    <div className="flex justify-between text-[10px] font-mono text-gray-400 uppercase"><span>Cortisol</span><span className={uiState.anxiety > 80 ? 'text-red-500 animate-pulse font-bold' : ''}>{Math.round(uiState.anxiety)}%</span></div>
                                    <div className="h-1.5 bg-gray-800 rounded-full overflow-hidden"><div className={'h-full transition-all duration-300 rounded-full ' + (uiState.anxiety > 80 ? 'bg-red-600' : 'bg-yellow-500')} style={{ width: uiState.anxiety + '%' }}></div></div>
                                </div>
                            </div>
                        </div>

                        {/* Log Console */}
                        <div className="h-24 border-t border-gray-800 pt-1.5 font-mono text-[9px] overflow-hidden flex flex-col justify-end mask-image-linear-to-t">
                            {logs.map((log) => (
                                <div key={log.id} className={'mb-0.5 leading-tight ' + (log.type === 'error' ? 'text-red-500' : log.type === 'success' ? 'text-green-500' : log.type === 'warning' ? 'text-yellow-500' : 'text-gray-500')}>
                                    <span className="opacity-30 mr-1">[{new Date(log.id).toLocaleTimeString([], { hour12: false, second: '2-digit', minute: '2-digit' })}]</span>
                                    {log.msg}
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* ============== CENTER PANEL ============== */}
                    <div className="w-full md:w-1/3 p-3 flex flex-col bg-gray-900 border-r border-gray-800 relative z-10 shadow-2xl">

                        {/* Header Stats */}
                        <div className="text-center mb-3 relative">
                            <div className="flex items-center justify-center gap-2 mb-1">
                                <h2 className="text-gray-500 text-[9px] font-mono uppercase tracking-[0.2em]">Engagement</h2>
                                <span className={'text-[9px] font-black px-1.5 py-0.5 rounded border ' + (uiState.phase === 3 ? 'text-red-400 border-red-500/40 bg-red-500/10' : uiState.phase === 2 ? 'text-amber-400 border-amber-500/40 bg-amber-500/10' : 'text-gray-500 border-gray-700 bg-gray-800')}>
                                    PHASE {uiState.phase}
                                </span>
                            </div>
                            <div className="text-4xl font-black text-white tabular-nums tracking-tighter drop-shadow-lg">
                                {Math.floor(uiState.engagement).toLocaleString()}
                            </div>
                            <div className="flex items-center justify-center gap-3 mt-1.5">
                                <div className="px-2 py-0.5 bg-gray-800 rounded text-[9px] font-mono text-green-400 flex items-center gap-1"><TrendingUp size={9} /> +{calculatePPS().toFixed(1)}/s</div>
                                <div className="px-2 py-0.5 bg-gray-800 rounded text-[9px] font-mono text-purple-400 flex items-center gap-1"><Zap size={9} /> x{uiState.streak.toFixed(1)}</div>
                            </div>
                            {/* Sentiment AI: next mood preview */}
                            {uiState.nextMood && purchasedUpgrades.includes('sentiment_analysis') && (
                                <div className="mt-1.5 text-[9px] font-mono text-emerald-400 animate-pulse">NEXT MOOD: {uiState.nextMood}</div>
                            )}
                        </div>

                        {/* Combo Chain */}
                        {uiState.comboChain.length > 0 && !uiState.isResisting && uiState.brainHealth > 0 && !purchasedUpgrades.includes('infinite_scroll') && (
                            <div className="flex items-center justify-center gap-1 mb-2 py-1 px-2 bg-gray-800/50 rounded-lg border border-gray-700/50">
                                <span className="text-[9px] font-mono text-gray-500 uppercase mr-1">Combo:</span>
                                {uiState.comboChain.map((cat, i) => (
                                    <span key={i} className={'text-[9px] font-bold px-1.5 py-0.5 rounded ' + ACTION_CATEGORIES[cat].color + ' ' + ACTION_CATEGORIES[cat].bg + ' border ' + ACTION_CATEGORIES[cat].border}>{ACTION_CATEGORIES[cat].label.charAt(0)}</span>
                                ))}
                                {Array.from({ length: 4 - uiState.comboChain.length }).map((_, i) => (
                                    <span key={'empty-' + i} className="text-[9px] font-mono px-1.5 py-0.5 rounded bg-gray-800 border border-gray-700 text-gray-600">?</span>
                                ))}
                            </div>
                        )}

                        {/* Action Area */}
                        <div className="flex-1 flex flex-col justify-center relative">
                            <div className="mb-3 flex items-center justify-between gap-2">
                                <ScenarioDisplay />
                                <div className="inline-flex items-center justify-center px-2 py-1 rounded-full bg-gray-800 border border-gray-700">
                                    <span className={'text-[10px] font-bold uppercase tracking-widest transition-colors duration-500 ' + (uiState.userMood === 'BORED' ? 'text-yellow-400' : uiState.userMood === 'ANGRY' ? 'text-red-500' : uiState.userMood === 'LONELY' ? 'text-blue-400' : uiState.userMood === 'INSECURE' ? 'text-pink-400' : 'text-gray-500')}>
                                        {uiState.userMood}
                                    </span>
                                </div>
                            </div>

                            {/* DILEMMA OVERLAY */}
                            {uiState.dilemmaActive && !uiState.isResisting && (
                                <div className="absolute inset-0 z-[60] flex items-center justify-center bg-gray-900/95 backdrop-blur-sm rounded-xl p-3 animate-dilemma">
                                    <div className="w-full max-w-[340px]">
                                        <div className="text-center mb-3">
                                            <div className="text-[9px] font-mono text-amber-400 uppercase tracking-widest mb-1">Dilemma Event</div>
                                            <h3 className="text-base font-black text-white mb-1">{uiState.dilemmaActive.title}</h3>
                                            <p className="text-[11px] text-gray-400">{uiState.dilemmaActive.desc}</p>
                                        </div>
                                        <div className="h-1 bg-gray-800 rounded-full overflow-hidden mb-3">
                                            <DilemmaTimer startTime={uiState.dilemmaActive.startTime} duration={uiState.dilemmaActive.duration} />
                                        </div>
                                        <div className="grid grid-cols-2 gap-2">
                                            <button onClick={() => handleDilemmaChoice(uiState.dilemmaActive.choiceA)}
                                                className="p-3 rounded-lg border border-red-500/40 bg-red-500/10 hover:bg-red-500/25 transition-all text-left group">
                                                <div className="text-[11px] font-bold text-red-400 mb-1">{uiState.dilemmaActive.choiceA.label}</div>
                                                <div className="text-[9px] text-gray-400 font-mono">{uiState.dilemmaActive.choiceA.desc}</div>
                                            </button>
                                            <button onClick={() => handleDilemmaChoice(uiState.dilemmaActive.choiceB)}
                                                className="p-3 rounded-lg border border-blue-500/40 bg-blue-500/10 hover:bg-blue-500/25 transition-all text-left group">
                                                <div className="text-[11px] font-bold text-blue-400 mb-1">{uiState.dilemmaActive.choiceB.label}</div>
                                                <div className="text-[9px] text-gray-400 font-mono">{uiState.dilemmaActive.choiceB.desc}</div>
                                            </button>
                                        </div>
                                        <div className="text-[8px] text-gray-600 text-center mt-2 font-mono">Not choosing = worst outcome for both</div>
                                    </div>
                                </div>
                            )}

                            {/* SCREEN TIME REMINDER (Phase 2+) */}
                            {uiState.screenTimeActive && !uiState.isResisting && (
                                <div className="absolute inset-0 z-[55] flex items-center justify-center bg-gray-900/90 backdrop-blur-sm rounded-xl p-4">
                                    <div className="text-center">
                                        <Shield size={40} className="text-blue-400 mx-auto mb-3" />
                                        <h3 className="text-lg font-black text-white mb-1">Screen Time Reminder</h3>
                                        <p className="text-xs text-gray-400 mb-4">User has been on their phone for 2+ hours.</p>
                                        <button onClick={handleScreenTimeDismiss}
                                            className="px-6 py-2 bg-red-600 hover:bg-red-500 text-white font-bold rounded-lg transition-all text-sm">
                                            Dismiss Alert (\u2212150 eng)
                                        </button>
                                        <p className="text-[9px] text-gray-600 mt-2 font-mono">Auto-dismiss in 8s costs \u2212300</p>
                                    </div>
                                </div>
                            )}

                            {/* DIGITAL WELLBEING BLOCKER (Phase 3) */}
                            {isBlocked && !uiState.isResisting && (
                                <div className="absolute inset-0 z-[54] flex items-center justify-center bg-gray-950/95 rounded-xl animate-blocker">
                                    <div className="text-center">
                                        <Hourglass size={36} className="text-gray-500 mx-auto mb-3 animate-spin-slow" />
                                        <h3 className="text-sm font-bold text-gray-400">Digital Wellbeing Check</h3>
                                        <p className="text-[10px] text-gray-600 font-mono mt-1">Actions blocked temporarily...</p>
                                    </div>
                                </div>
                            )}

                            {/* RESISTANCE / UNRESPONSIVE / NORMAL ACTIONS */}
                            {uiState.isResisting ? (
                                <div className="absolute inset-0 z-50 flex flex-col items-center justify-center bg-gray-900/95 backdrop-blur-sm rounded-xl p-3">
                                    <div className="flex items-center gap-2 mb-1">
                                        <AlertTriangle size={20} className="text-red-500 animate-bounce" />
                                        <p className="text-base font-black text-red-400 uppercase tracking-wider">{uiState.anxiety > 90 ? 'Panic!' : 'User Leaving!'}</p>
                                    </div>
                                    <p className="text-[10px] text-gray-400 mb-1">{resistTypeLabel[uiState.resistType]}</p>
                                    <p className="text-[10px] text-gray-500 mb-2">{resistTypeHint[uiState.resistType]}</p>
                                    <div className="w-full max-w-[320px] mb-2">
                                        <ResistTimer deadline={uiState.resistDeadline} />
                                        <div className="h-2.5 bg-gray-800 rounded-full overflow-hidden border border-gray-700">
                                            <div className="h-full bg-gradient-to-r from-red-500 via-yellow-500 to-green-500 transition-all duration-150 rounded-full" style={{ width: uiState.resistanceHealth + '%' }} />
                                        </div>
                                        <div className="flex justify-between text-[10px] font-mono mt-0.5">
                                            <span className="text-gray-500">{Math.round(uiState.resistHits)} / {uiState.resistHitsNeeded}</span>
                                            <span className={'font-bold ' + (uiState.resistanceHealth > 66 ? 'text-green-400' : uiState.resistanceHealth > 33 ? 'text-yellow-400' : 'text-red-400')}>{Math.round(uiState.resistanceHealth)}%</span>
                                        </div>
                                    </div>
                                    {uiState.resistType === 'grid' && renderGridResist()}
                                    {uiState.resistType === 'sequence' && renderSequenceResist()}
                                    {uiState.resistType === 'moving' && renderMovingResist()}
                                </div>
                            ) : uiState.brainHealth <= 0 ? (
                                <div className="absolute inset-0 z-50 flex flex-col items-center justify-center bg-gray-900/80 backdrop-blur-sm rounded-xl border-2 border-red-500/50 p-4">
                                    <div className="text-center mb-4">
                                        <Skull size={48} className="mx-auto text-red-500 mb-2 animate-pulse" />
                                        <h2 className="text-base font-bold text-red-400 mb-1">SUBJECT UNRESPONSIVE</h2>
                                        <p className="text-gray-400 text-[10px] max-w-[200px] mx-auto">Initiate Recovery Protocols?</p>
                                    </div>
                                    <div className="w-full space-y-1.5">
                                        <div className="text-[9px] font-mono text-gray-500 uppercase text-center mb-1">Recovery (Costs Engagement)</div>
                                        {RECOVERY_ACTIONS.map(action => {
                                            const RecIcon = action.icon;
                                            return (
                                                <button key={action.id} onClick={(e) => handleRecoveryClick(action, e)} disabled={uiState.engagement < action.cost}
                                                    className={'w-full flex items-center gap-2 p-2 rounded-lg border transition-all text-left group ' + (uiState.engagement >= action.cost ? 'bg-gray-800 border-gray-700 hover:bg-gray-700 hover:border-green-500/50' : 'bg-gray-900 border-gray-800 opacity-50 cursor-not-allowed')}>
                                                    <div className={'p-1.5 rounded bg-gray-900 group-hover:text-green-400 ' + (uiState.engagement >= action.cost ? 'text-gray-300' : 'text-gray-600')}><RecIcon size={16} /></div>
                                                    <div className="flex-1">
                                                        <div className="flex justify-between items-center"><span className="font-bold text-xs text-gray-200">{action.label}</span><span className="font-mono text-[10px] text-red-400">-{action.cost}</span></div>
                                                        <div className="text-[9px] text-gray-500">{action.desc}</div>
                                                    </div>
                                                </button>
                                            );
                                        })}
                                    </div>
                                    {uiState.autoRecoverAt > 0 && (
                                        <div className="mt-3 w-full max-w-[240px]">
                                            <div className="text-[10px] font-mono text-blue-400 text-center mb-1 animate-pulse">Auto-reboot in {Math.max(0, Math.ceil((uiState.autoRecoverAt - performance.now()) / 1000))}s...</div>
                                            <div className="h-1 bg-gray-800 rounded-full overflow-hidden"><div className="h-full bg-blue-500/80 transition-all duration-200 rounded-full" style={{ width: Math.min(100, Math.max(0, (1 - (uiState.autoRecoverAt - performance.now()) / 8000)) * 100) + '%' }} /></div>
                                        </div>
                                    )}
                                </div>
                            ) : (
                                <div className="grid grid-cols-2 gap-2 h-full overflow-y-auto pb-3 scrollbar-none">
                                    {renderActionButtons('ENTERTAINMENT')}
                                    {renderActionButtons('OUTRAGE')}
                                    {renderActionButtons('SOCIAL')}
                                    {renderActionButtons('VALIDATION')}
                                </div>
                            )}
                        </div>

                        {/* Floaters */}
                        <div className="absolute inset-0 pointer-events-none overflow-hidden">
                            {floaters.map(f => (
                                <div key={f.id} className={'absolute text-lg font-black animate-fade-up ' + f.color} style={{ left: f.x, top: f.y }}>{f.text}</div>
                            ))}
                        </div>
                    </div>

                    {/* ============== RIGHT PANEL ============== */}
                    <div className="w-full md:w-1/3 bg-gray-950 p-3 flex flex-col overflow-hidden border-l border-gray-800">
                        <h2 className="text-[9px] font-mono uppercase tracking-widest text-gray-500 mb-3 flex items-center gap-2"><Lock size={11} /> Optimization Modules</h2>
                        <div className="flex-1 overflow-y-auto space-y-1.5 pr-1 scrollbar-thin scrollbar-thumb-gray-800">
                            {UPGRADES.map((upgrade) => {
                                const isOwned = purchasedUpgrades.includes(upgrade.id);
                                const isUnlocked = uiState.engagement >= upgrade.cost;
                                return (
                                    <button key={upgrade.id} disabled={isOwned || !isUnlocked} onClick={() => buyUpgrade(upgrade)}
                                        className={'w-full text-left p-2.5 rounded border transition-all relative overflow-hidden group ' + (isOwned ? 'bg-green-900/10 border-green-900/30 opacity-60' : isUnlocked ? 'bg-gray-900 border-gray-600 hover:border-green-500 hover:bg-gray-800 cursor-pointer' : 'bg-gray-900/30 border-gray-800 opacity-40 cursor-not-allowed')}>
                                        {!isOwned && !isUnlocked && <div className="absolute bottom-0 left-0 h-0.5 bg-gray-600 transition-all duration-500" style={{ width: Math.min(100, (uiState.engagement / upgrade.cost) * 100) + '%' }} />}
                                        <div className="flex justify-between items-center mb-0.5">
                                            <h3 className={'font-bold text-xs ' + (isOwned ? 'text-green-500' : 'text-gray-200')}>{upgrade.name}</h3>
                                            <span className={'font-mono text-[9px] px-1.5 py-0.5 rounded ' + (isOwned ? 'bg-green-900/30 text-green-400' : isUnlocked ? 'bg-blue-600 text-white animate-pulse' : 'bg-black/40 text-gray-500')}>
                                                {isOwned ? 'ACTIVE' : isUnlocked ? 'EVOLVE' : upgrade.cost.toLocaleString()}
                                            </span>
                                        </div>
                                        <p className="text-[9px] text-gray-400 mb-0.5">{upgrade.description}</p>
                                        <div className="flex items-center gap-2 text-[8px] font-mono uppercase tracking-wider text-gray-600">
                                            <span className="flex items-center gap-1 text-blue-400/80"><TrendingUp size={7} /> +{upgrade.pps}/s</span>
                                            <span className="flex items-center gap-1 text-green-400/80"><CheckCircle size={7} /> {upgrade.effect}</span>
                                        </div>
                                        <div className="flex items-center gap-1 mt-1 text-[8px] font-mono text-orange-400/80">
                                            <AlertTriangle size={7} /> {upgrade.tradeoff}
                                        </div>
                                    </button>
                                );
                            })}
                        </div>
                    </div>
                </div>
            );
        }

        // ============================================================
        // MOUNT
        // ============================================================
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
