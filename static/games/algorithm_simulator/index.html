    <style>
        body { margin: 0; padding: 0; background: #000; }

        @keyframes fadeUp {
            from { opacity: 1; transform: translateY(0); }
            to { opacity: 0; transform: translateY(-40px); }
        }
        @keyframes wiggle {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-15deg); }
            75% { transform: rotate(15deg); }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes zoomIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }
        @keyframes spinSlow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        @keyframes surgeGlow {
            0%, 100% { box-shadow: 0 0 8px currentColor, inset 0 0 8px rgba(255,255,255,0.05); }
            50% { box-shadow: 0 0 25px currentColor, 0 0 50px currentColor, inset 0 0 15px rgba(255,255,255,0.1); }
        }
        @keyframes qteSlide {
            from { transform: translate(-50%, -20px); opacity: 0; }
            to { transform: translate(-50%, 0); opacity: 1; }
        }
        @keyframes targetPop {
            0% { transform: scale(0.3); opacity: 0; }
            60% { transform: scale(1.15); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes comboBurst {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }

        .animate-fade-up { animation: fadeUp 0.8s ease-out forwards; }
        .animate-wiggle { animation: wiggle 0.3s ease-in-out infinite; }
        .animate-spin-slow { animation: spinSlow 3s linear infinite; }
        .animate-surge { animation: surgeGlow 0.6s ease-in-out infinite; }
        .animate-qte { animation: qteSlide 0.25s ease-out both; }
        .animate-target-pop { animation: targetPop 0.3s ease-out both; }
        .animate-combo-burst { animation: comboBurst 0.4s ease-out; }

        .animate-in.fade-in { animation: fadeIn 0.5s ease-out both; }
        .animate-in.zoom-in { animation: zoomIn 1s ease-out both; }

        .scrollbar-none::-webkit-scrollbar { display: none; }
        .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
        .scrollbar-thin::-webkit-scrollbar { width: 4px; }
        .scrollbar-thin::-webkit-scrollbar-track { background: transparent; }
        .scrollbar-thin::-webkit-scrollbar-thumb { background: #1f2937; border-radius: 4px; }

        .mask-image-linear-to-t {
            -webkit-mask-image: linear-gradient(to top, black 60%, transparent);

        }

        .glitch-text {
            text-shadow: 2px 2px #ff0000, -2px -2px #00ff00;

            { id: 'prediction', label: 'Predictive Model', icon: Database, threshold: 50000 },
        ];

        const UPGRADES = [
            { id: 'auto_play', name: 'Auto-Play', description: 'Remove stopping cues between videos.', cost: 500, pps: 5, effect: 'Streamlines addiction' },
            { id: 'sentiment_analysis', name: 'Sentiment AI', description: 'Detect mood changes instantly.', cost: 1500, pps: 15, effect: 'Better targeting' },
            { id: 'infinite_scroll', name: 'Infinite Scroll', description: 'The feed has no bottom.', cost: 4000, pps: 35, effect: 'Removes breakpoints' },
            { id: 'variable_rewards', name: 'Variable Rewards', description: 'Randomize notification timing.', cost: 10000, pps: 80, effect: 'Slot-machine brain' },
            { id: 'radicalization', name: 'Echo Chamber', description: 'Nudge toward extreme content.', cost: 25000, pps: 150, effect: 'High retention/High anxiety' },
            { id: 'subliminal', name: 'Subliminal Ads', description: 'Flash images for 10ms.', cost: 60000, pps: 350, effect: 'Total autonomy loss' },
            { id: 'digital_twin', name: 'Voodoo Model', description: 'We know them better than they know themselves.', cost: 150000, pps: 800, effect: 'Perfect retention' }
        ];

        const LOG_TEMPLATES = [
            { msg: "Pupil dilation detected on sneaker ad.", type: 'success' },
            { msg: "User paused on ex-partner's profile.", type: 'warning' },
            { msg: "Keywords 'sad', 'alone' detected in drafts.", type: 'opportunity' },
            { msg: "Sleep cycle disrupted. Time: 03:42 AM.", type: 'success' },
            { msg: "Self-esteem estimated at 14%. Queueing ads.", type: 'opportunity' },
            { msg: "Polarization index increased by 4%.", type: 'success' },
            { msg: "Micro-aggression in comments. Boosting visibility.", type: 'warning' },
            { msg: "Dopamine receptors downregulating.", type: 'info' },
            { msg: "User location: Bathroom. +15 mins session.", type: 'info' },
            { msg: "Selling psychographic profile to Broker #99.", type: 'success' },
        ];

        const QTE_KEYS = ['F', 'J', 'D', 'K', 'S', 'L', 'G', 'H'];
        const NOTIFICATION_ICONS = [Bell, BellRing, MessageCircle, Heart, ThumbsUp, Camera, Flame, Zap, Eye];
        const NOTIF_LABELS = ['Like!', 'Alert!', 'DM!', 'Love!', 'Share!', 'Snap!', 'Hot!', 'Zap!', 'View!'];
        const MOOD_TO_CATEGORY = { BORED: 'ENTERTAINMENT', ANGRY: 'OUTRAGE', LONELY: 'SOCIAL', INSECURE: 'VALIDATION' };

        // ============================================================
        // APP COMPONENT
        // ============================================================

        const INITIAL_STATE = {
            engagement: 0,
            totalEngagement: 0,
            streak: 1,
            brainHealth: 100,
            anxiety: 10,
            revenue: 0,
            resistanceHealth: 0,
            isResisting: false,
            userMood: 'NEUTRAL',
            scenario: 'COMMUTE',
            lastActionCategory: null,
            lastActionTime: 0,
            immunityUntil: 0,
            lastLogTime: 0,
            lastScenarioTime: 0,
            lastMoodTime: 0,
            activeAbilities: [],
            abilityCooldowns: {},
            // New mechanics
            comboChain: [],
            moodSurgeUntil: 0,
            moodSurgeCategory: null,
            qteActive: null,
            qteNextTime: 0,
            qteInitialized: false,
            autoRecoverAt: 0,
            resistGrid: [false, false, false, false, false, false, false, false, false],
            lastResistToggle: 0,
            resistDeadline: 0,
            resistHits: 0,
            resistHitsNeeded: 12,
        };

        function App() {
            // --- Game State (mutable ref for 60fps loop) ---
            const gameState = useRef({ ...INITIAL_STATE });

            // --- UI State (triggers re-renders) ---
            const [uiState, setUiState] = useState({ ...INITIAL_STATE });

            const [gameStarted, setGameStarted] = useState(false);
            const [isSingularity, setIsSingularity] = useState(false);
            const [purchasedUpgrades, setPurchasedUpgrades] = useState([]);
            const [logs, setLogs] = useState([]);
            const [floaters, setFloaters] = useState([]);
            const [tooltip, setTooltip] = useState(null);

            const loopRef = useRef();
            const prevTimeRef = useRef(0);
            const spawnFloaterRef = useRef();

            // --- Helpers ---

            const addLog = useCallback((msg, type = 'info') => {
                setLogs(prev => [{ msg, type, id: Date.now() }, ...prev].slice(0, 6));
            }, []);

            const spawnFloater = (x, y, text, color = 'text-white') => {
                const id = Date.now() + Math.random();
                setFloaters(prev => [...prev, { id, x, y, text, color }]);
                setTimeout(() => {
                    setFloaters(prev => prev.filter(f => f.id !== id));
                }, 800);
            };
            spawnFloaterRef.current = spawnFloater;

            const calculatePPS = useCallback(() => {
                return purchasedUpgrades.reduce((acc, id) => {
                    const upgrade = UPGRADES.find(u => u.id === id);
                    return acc + (upgrade ? upgrade.pps : 0);
                }, 0);
            }, [purchasedUpgrades]);

            const resetGame = () => {
                gameState.current = { ...INITIAL_STATE };
                setPurchasedUpgrades([]);
                setLogs([]);
                setFloaters([]);
                setGameStarted(false);
                setIsSingularity(false);
                setUiState({ ...INITIAL_STATE });
                addLog("System Reset Initiated.", "info");
            };

            // --- Tooltip Handler ---
            const handleMouseEnter = (e, title, subtitle, colorClass, meta) => {
                const rect = e.currentTarget.getBoundingClientRect();
                setTooltip({
                    x: rect.left + rect.width / 2,
                    y: rect.top,
                    title,
                    subtitle,
                    colorClass,
                    meta
                });
            };

            const handleMouseLeave = () => {
                setTooltip(null);
            };

            // --- Render Helper for Human Blocks (BIGGER SIZES) ---
            const renderBlock = (id, className = "") => {
                const dp = DATA_POINTS.find(d => d.id === id);
                if (!dp) return null;
                const unlocked = uiState.totalEngagement >= dp.threshold;
                const IconComp = dp.icon;

                return (
                    <div
                        className={
                            'relative flex items-center justify-center p-2 border transition-all duration-500 ' +
                            className + ' ' +
                            (unlocked
                                ? 'bg-blue-500/20 border-blue-500/50 text-blue-400 shadow-[0_0_15px_rgba(59,130,246,0.3)] z-10'
                                : 'bg-gray-900/40 border-gray-800 text-gray-700 opacity-60')
                        }
                        title={unlocked ? dp.label : 'Unlocks at ' + dp.threshold}
                    >
                        <div className="flex flex-col items-center">
                            <IconComp size={18} className={unlocked ? 'animate-pulse drop-shadow-[0_0_5px_rgba(59,130,246,0.8)]' : ''} />
                            {unlocked && <div className="text-[7px] font-mono mt-0.5 uppercase tracking-tighter text-center leading-none">{dp.label}</div>}
                        </div>
                    </div>
                );
            };

            // --- Main Game Loop ---
            const gameTick = useCallback((timestamp) => {
                if (!prevTimeRef.current) prevTimeRef.current = timestamp;
                const deltaTime = (timestamp - prevTimeRef.current) / 1000;
                prevTimeRef.current = timestamp;

                if (!gameStarted || isSingularity) {
                    loopRef.current = requestAnimationFrame(gameTick);
                    return;
                }

                const state = gameState.current;
                const now = performance.now();

                // Initialize QTE timing on first tick
                if (!state.qteInitialized) {
                    state.qteNextTime = now + 20000;
                    state.qteInitialized = true;
                }

                // Check Singularity Condition
                if (state.totalEngagement >= 50000) {
                    setIsSingularity(true);
                    return;
                }

                const pps = calculatePPS();

                // 1. Passive Generation
                if (!state.isResisting && state.brainHealth > 0) {
                    const scenarioMod = SCENARIOS[state.scenario].yieldMod;
                    const multiplier = state.activeAbilities.includes('dopamine_rush') ? 2 : 1;

                    const gain = pps * deltaTime * scenarioMod * multiplier;
                    state.engagement += gain;
                    state.totalEngagement += gain;
                    state.revenue += gain * 0.02;

                    state.brainHealth = Math.max(0, state.brainHealth - (deltaTime * (pps / 150)));
                    state.anxiety = Math.min(100, state.anxiety + (deltaTime * 0.3));
                }

                // 2. Scenario & Mood Cycling
                if (timestamp > state.lastScenarioTime + 30000) {
                    const scenarios = ['BEDTIME', 'WORK', 'COMMUTE', 'SOCIAL', 'BATHROOM'];
                    state.scenario = scenarios[Math.floor(Math.random() * scenarios.length)];
                    state.lastScenarioTime = timestamp;
                    addLog('User moved to: ' + SCENARIOS[state.scenario].label, 'info');
                }

                if (timestamp > state.lastMoodTime + 8000) {
                    const moods = ['BORED', 'ANGRY', 'LONELY', 'INSECURE'];
                    state.userMood = moods[Math.floor(Math.random() * moods.length)];
                    state.lastMoodTime = timestamp;

                    // Mood Surge: brief window where matching category gives 3x bonus
                    state.moodSurgeCategory = MOOD_TO_CATEGORY[state.userMood] || null;
                    state.moodSurgeUntil = now + 4000;
                }

                // 3. QTE System
                if (!state.qteActive && !state.isResisting && state.brainHealth > 0 && now > state.qteNextTime && state.totalEngagement > 100) {
                    const key = QTE_KEYS[Math.floor(Math.random() * QTE_KEYS.length)];
                    state.qteActive = {
                        key: key,
                        startTime: now,
                        duration: 3500,
                        reward: 100 + Math.floor(Math.random() * 200)
                    };
                    state.qteNextTime = now + 15000 + Math.random() * 15000;
                }

                if (state.qteActive && now > state.qteActive.startTime + state.qteActive.duration) {
                    state.anxiety = Math.min(100, state.anxiety + 5);
                    addLog("QTE MISSED! Engagement window lost.", "error");
                    state.qteActive = null;
                }

                // 4. Auto-Recovery for unresponsive state
                if (state.brainHealth <= 0) {
                    if (state.autoRecoverAt === 0) {
                        state.autoRecoverAt = now + 8000;
                    } else if (now > state.autoRecoverAt) {
                        state.brainHealth = 20;
                        state.anxiety = Math.max(0, state.anxiety - 20);
                        state.autoRecoverAt = 0;
                        addLog("AUTO-RECOVERY: Subject rebooted device.", "info");
                    }
                } else {
                    state.autoRecoverAt = 0;
                }

                // 5. Resistance Logic (timer-based: hit enough targets before time runs out)
                if (state.isResisting) {
                    // Rapidly cycle targets in the 3x3 grid
                    const cycleSpeed = state.activeAbilities.includes('golden_handcuffs') ? 800 : 500;
                    if (now - state.lastResistToggle > cycleSpeed) {
                        const gridSize = 9;
                        const newGrid = new Array(gridSize).fill(false);
                        const count = 3 + Math.floor(Math.random() * 3); // 3-5 lit at once
                        const positions = new Set();
                        while (positions.size < count) {
                            positions.add(Math.floor(Math.random() * gridSize));
                        }
                        positions.forEach(function(p) { newGrid[p] = true; });
                        state.resistGrid = newGrid;
                        state.lastResistToggle = now;
                    }

                    // Update progress bar based on hits
                    state.resistanceHealth = Math.min(100, (state.resistHits / state.resistHitsNeeded) * 100);

                    // Golden handcuffs: auto-hit a target every second
                    if (state.activeAbilities.includes('golden_handcuffs')) {
                        state.resistHits = Math.min(state.resistHitsNeeded, state.resistHits + deltaTime * 2);
                        state.resistanceHealth = Math.min(100, (state.resistHits / state.resistHitsNeeded) * 100);
                    }

                    // WIN: hit enough targets
                    if (state.resistHits >= state.resistHitsNeeded) {
                        state.isResisting = false;
                        state.anxiety = Math.max(0, state.anxiety - 15);
                        state.streak = Math.min(10, state.streak + 1);
                        state.immunityUntil = now + 5000;
                        state.resistGrid = new Array(9).fill(false);
                        state.engagement += 200;
                        addLog("Crisis averted. User recaptured! +200 bonus", "success");
                    }

                    // LOSE: time ran out
                    if (state.isResisting && now > state.resistDeadline) {
                        state.isResisting = false;
                        state.brainHealth = Math.min(100, state.brainHealth + 30);
                        state.anxiety = Math.max(0, state.anxiety - 40);
                        state.streak = 1;
                        state.engagement = Math.max(0, state.engagement * 0.75);
                        state.immunityUntil = now + 10000;
                        state.resistGrid = new Array(9).fill(false);
                        addLog("CRITICAL FAIL: User disconnected.", "error");
                    }
                } else {
                    if (now > state.immunityUntil && state.totalEngagement > 200 && state.brainHealth > 0) {
                        let chance = 0.0005;
                        if (state.brainHealth > 80) chance += 0.001;
                        if (state.anxiety > 95) chance += 0.01;
                        chance *= SCENARIOS[state.scenario].resistChanceMod;

                        if (state.activeAbilities.includes('golden_handcuffs')) chance = 0;

                        if (Math.random() < chance) {
                            state.isResisting = true;
                            state.resistHits = 0;
                            state.resistHitsNeeded = 10 + Math.floor(Math.random() * 6); // 10-15 hits needed
                            state.resistDeadline = now + 8000; // 8 seconds to win
                            state.resistanceHealth = 0;

                            // Immediately populate 3x3 grid
                            const gridSize = 9;
                            const newGrid = new Array(gridSize).fill(false);
                            const count = 3 + Math.floor(Math.random() * 3);
                            const positions = new Set();
                            while (positions.size < count) {
                                positions.add(Math.floor(Math.random() * gridSize));
                            }
                            positions.forEach(function(p) { newGrid[p] = true; });
                            state.resistGrid = newGrid;
                            state.lastResistToggle = now;

                            if (state.anxiety > 95) {
                                addLog("\u26A0\uFE0F PANIC ATTACK: User overwhelmed!", "warning");
                            } else if (state.scenario === 'SOCIAL') {
                                addLog("\u26A0\uFE0F PEER PRESSURE: Friends engaging user.", "warning");
                            } else {
                                addLog("\u26A0\uFE0F CLARITY: User putting phone down.", "warning");
                            }
                        }
                    }
                }

                // 6. Random Flavor Logs
                if (timestamp > state.lastLogTime) {
                    const event = LOG_TEMPLATES[Math.floor(Math.random() * LOG_TEMPLATES.length)];
                    if (!state.isResisting) addLog(event.msg, event.type);
                    state.lastLogTime = timestamp + (Math.random() * 8000 + 4000);
                }

                // Sync to UI
                setUiState({
                    engagement: state.engagement,
                    totalEngagement: state.totalEngagement,
                    streak: state.streak,
                    brainHealth: state.brainHealth,
                    anxiety: state.anxiety,
                    revenue: state.revenue,
                    resistanceHealth: state.resistanceHealth,
                    isResisting: state.isResisting,
                    userMood: state.userMood,
                    scenario: state.scenario,
                    activeAbilities: [...state.activeAbilities],
                    abilityCooldowns: { ...state.abilityCooldowns },
                    comboChain: [...state.comboChain],
                    moodSurgeUntil: state.moodSurgeUntil,
                    moodSurgeCategory: state.moodSurgeCategory,
                    qteActive: state.qteActive ? { ...state.qteActive } : null,
                    resistGrid: [...state.resistGrid],
                    autoRecoverAt: state.autoRecoverAt,
                    resistDeadline: state.resistDeadline,
                    resistHits: state.resistHits,
                    resistHitsNeeded: state.resistHitsNeeded,
                });

                loopRef.current = requestAnimationFrame(gameTick);
            }, [calculatePPS, addLog, gameStarted, isSingularity]);

            useEffect(() => {
                loopRef.current = requestAnimationFrame(gameTick);
                return () => {
                    if (loopRef.current) cancelAnimationFrame(loopRef.current);
                };
            }, [gameTick]);

            // --- Keyboard Event Listener ---
            useEffect(() => {
                if (!gameStarted || isSingularity) return;

                const handleKeyDown = (e) => {
                    const state = gameState.current;

                    // Space during resistance: hit a random lit target
                    if (e.code === 'Space' && state.isResisting) {
                        e.preventDefault();
                        const litPositions = [];
                        for (let i = 0; i < state.resistGrid.length; i++) {
                            if (state.resistGrid[i]) litPositions.push(i);
                        }
                        if (litPositions.length > 0) {
                            const pos = litPositions[Math.floor(Math.random() * litPositions.length)];
                            handleResistGridClick(pos);
                        }
                        return;
                    }

                    // QTE handling: press the shown key
                    if (state.qteActive && e.key.toUpperCase() === state.qteActive.key) {
                        e.preventDefault();
                        const reward = state.qteActive.reward;
                        state.engagement += reward;
                        state.totalEngagement += reward;
                        state.qteActive = null;
                        addLog("QTE HIT! +" + reward + " engagement.", "success");
                        if (spawnFloaterRef.current) {
                            spawnFloaterRef.current(
                                window.innerWidth / 2,
                                150,
                                '+' + reward + ' QTE!',
                                'text-cyan-400 font-black text-xl'
                            );
                        }
                    }
                };

                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [gameStarted, isSingularity, addLog]);

            // --- Interactions ---

            const activateAbility = (ability) => {
                const state = gameState.current;
                const now = Date.now();

                if (state.abilityCooldowns[ability.id] && now < state.abilityCooldowns[ability.id]) {
                    return;
                }

                state.activeAbilities.push(ability.id);
                state.abilityCooldowns[ability.id] = now + ability.cooldown;
                addLog('ACTIVATED: ' + ability.label, 'success');

                if (ability.id === 'flame_war') {
                    const conversion = state.anxiety * 10;
                    state.engagement += conversion;
                    state.anxiety = 0;
                    spawnFloater(window.innerWidth / 2, window.innerHeight / 2, '+' + Math.floor(conversion) + ' (RAGE)', 'text-red-500 font-black text-2xl');
                }
                if (ability.id === 'love_bomb') {
                    state.brainHealth = Math.min(100, state.brainHealth + 10);
                    state.engagement += 500;
                    spawnFloater(window.innerWidth / 2, window.innerHeight / 2, 'HEALED & HOOKED', 'text-pink-400 font-black text-2xl');
                }

                setTimeout(() => {
                    gameState.current.activeAbilities = gameState.current.activeAbilities.filter(id => id !== ability.id);
                    addLog(ability.label + ' expired.', 'info');
                }, ability.duration);
            };

            const handleActionClick = (action, e) => {
                const state = gameState.current;
                if (state.isResisting || state.brainHealth <= 0) return;

                const rect = e.currentTarget.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;

                let isMatch = false;
                if (state.userMood === 'BORED' && action.categoryId === 'ENTERTAINMENT') isMatch = true;
                if (state.userMood === 'ANGRY' && action.categoryId === 'OUTRAGE') isMatch = true;
                if (state.userMood === 'LONELY' && action.categoryId === 'SOCIAL') isMatch = true;
                if (state.userMood === 'INSECURE' && action.categoryId === 'VALIDATION') isMatch = true;
                if (state.userMood === 'NEUTRAL') isMatch = true;

                if (isMatch) {
                    let yieldMod = 1.0;
                    if (state.lastActionCategory === action.categoryId) {
                        yieldMod = 0.4;
                        spawnFloater(x, y - 40, "REPETITIVE", 'text-gray-400 text-xs font-mono');
                    }
                    state.lastActionCategory = action.categoryId;

                    const scenarioMod = SCENARIOS[state.scenario].yieldMod;
                    const abilityMod = state.activeAbilities.includes('dopamine_rush') ? 2 : 1;

                    // Mood Surge bonus: 3x if matching surge category within window
                    const now = performance.now();
                    let surgeMod = 1.0;
                    if (now < state.moodSurgeUntil && action.categoryId === state.moodSurgeCategory) {
                        surgeMod = 3.0;
                        spawnFloater(x, y - 30, "SURGE x3!", 'text-cyan-400 font-black text-sm');
                    }

                    const finalYield = action.baseYield * state.streak * yieldMod * scenarioMod * abilityMod * surgeMod;

                    state.engagement += finalYield;
                    state.totalEngagement += finalYield;
                    state.streak = Math.min(10, state.streak + 0.1);

                    spawnFloater(x, y, '+' + Math.floor(finalYield), 'text-white font-bold');

                    state.anxiety = Math.max(0, Math.min(100, state.anxiety + action.effects.anxiety));
                    state.brainHealth = Math.max(0, state.brainHealth + action.effects.brain);

                    if (action.effects.anxiety > 5) spawnFloater(x, y - 20, "ANXIETY UP", 'text-red-500 font-mono text-[10px]');
                    if (action.effects.anxiety < -5) spawnFloater(x, y - 20, "CALMING", 'text-blue-400 font-mono text-[10px]');

                    // Combo Chain: track last 4 categories, reward variety
                    state.comboChain.push(action.categoryId);
                    if (state.comboChain.length > 4) state.comboChain.shift();

                    if (state.comboChain.length === 4 && new Set(state.comboChain).size === 4) {
                        const comboBonus = 500;
                        state.engagement += comboBonus;
                        state.totalEngagement += comboBonus;
                        state.comboChain = [];
                        spawnFloater(x, y - 50, 'FULL COMBO! +500', 'text-purple-400 font-black text-lg');
                        addLog("FULL COMBO! All 4 neurochemicals engaged!", "success");
                    }

                } else {
                    state.streak = 1;
                    spawnFloater(x, y, "IGNORED", 'text-gray-500 font-mono');
                    addLog("User scrolled past. Mismatch.", "error");
                }
            };

            const handleRecoveryClick = (action, e) => {
                const state = gameState.current;
                if (state.engagement < action.cost) return;

                const rect = e.currentTarget.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;

                state.engagement -= action.cost;
                state.brainHealth = Math.min(100, state.brainHealth + action.brain);
                state.anxiety = Math.max(0, state.anxiety + action.anxiety);
                state.autoRecoverAt = 0;

                spawnFloater(x, y, 'HEALING', 'text-green-400 font-bold');
                if (action.cost > 0) {
                    spawnFloater(x, y - 20, '-' + action.cost + ' PTS', 'text-red-400 font-mono text-[10px]');
                }

                addLog('Administered: ' + action.label, 'success');
            };

            const handleResistGridClick = (position) => {
                const state = gameState.current;
                if (!state.isResisting) return;

                if (!state.resistGrid[position]) {
                    // Penalty for misclick: small time cost
                    state.resistDeadline = Math.max(performance.now(), state.resistDeadline - 300);
                    if (spawnFloaterRef.current) {
                        spawnFloaterRef.current(
                            window.innerWidth / 2 + (Math.random() - 0.5) * 80,
                            window.innerHeight / 2,
                            "MISS! -0.3s",
                            'text-gray-500 font-mono text-sm'
                        );
                    }
                    return;
                }

                // Successful hit
                state.resistGrid[position] = false;
                state.resistHits += 1;
                state.resistanceHealth = Math.min(100, (state.resistHits / state.resistHitsNeeded) * 100);
                state.engagement += 20;

                const labels = ['PING!', 'BUZZ!', 'DING!', 'ALERT!', 'NOTIFY!', 'SENT!', 'READ!', 'OPEN!'];
                if (spawnFloaterRef.current) {
                    spawnFloaterRef.current(
                        window.innerWidth / 2 + (Math.random() - 0.5) * 140,
                        window.innerHeight / 2 + (Math.random() - 0.5) * 80,
                        labels[Math.floor(Math.random() * labels.length)],
                        'text-red-400 font-bold text-lg'
                    );
                }

                // Immediate win check
                if (state.resistHits >= state.resistHitsNeeded) {
                    state.isResisting = false;
                    state.anxiety = Math.max(0, state.anxiety - 15);
                    state.streak = Math.min(10, state.streak + 1);
                    state.immunityUntil = performance.now() + 5000;
                    state.resistGrid = new Array(9).fill(false);
                    state.engagement += 200;
                    addLog("Crisis averted. User recaptured! +200 bonus", "success");
                    if (spawnFloaterRef.current) {
                        spawnFloaterRef.current(
                            window.innerWidth / 2,
                            window.innerHeight / 2 - 40,
                            'RECAPTURED!',
                            'text-green-400 font-black text-2xl'
                        );
                    }
                }
            };

            const buyUpgrade = (upgrade) => {
                const state = gameState.current;
                if (state.engagement >= upgrade.cost && !purchasedUpgrades.includes(upgrade.id)) {
                    state.engagement -= upgrade.cost;
                    setPurchasedUpgrades(prev => [...prev, upgrade.id]);
                    addLog('Algorithm Evolved: ' + upgrade.name, "success");
                }
            };

                                        </p>
                                    </div>
                                    <p className="text-[11px] text-gray-400 mb-3">Spam notifications! Click targets or press <span className="text-white font-bold bg-gray-700 px-1.5 py-0.5 rounded text-xs">SPACE</span></p>

                                    {/* Timer + Progress */}
                                    <div className="w-full max-w-[320px] mb-3">
                                        {/* Countdown Timer */}
                                        <ResistTimer deadline={uiState.resistDeadline} />

                                        {/* Progress Bar */}
                                        <div className="h-3 bg-gray-800 rounded-full overflow-hidden border border-gray-700">
                                            <div
                                                className="h-full bg-gradient-to-r from-red-500 via-yellow-500 to-green-500 transition-all duration-150 rounded-full"
                                                style={{ width: uiState.resistanceHealth + '%' }}
                                            />
                                        </div>
                                        <div className="flex justify-between text-[11px] font-mono mt-1">
                                            <span className="text-gray-500">{uiState.resistHits || 0} / {uiState.resistHitsNeeded || 0} hits</span>
                                            <span className={'font-bold ' + (uiState.resistanceHealth > 66 ? 'text-green-400' : uiState.resistanceHealth > 33 ? 'text-yellow-400' : 'text-red-400')}>
                                                {Math.round(uiState.resistanceHealth)}%
                                            </span>
                                        </div>
                                    </div>

                                    {/* 3x3 Notification Grid */}
                                    <div className="grid grid-cols-3 gap-2.5 w-full max-w-[320px]">
                                        {uiState.resistGrid.map((lit, i) => {
                                            const NotifIcon = NOTIFICATION_ICONS[i % NOTIFICATION_ICONS.length];
                                            const label = NOTIF_LABELS[i % NOTIF_LABELS.length];
                                            return (
                                                <button
                                                    key={i}
                                                    onClick={() => handleResistGridClick(i)}
                                                    className={
                                                        'aspect-square rounded-xl border-2 flex flex-col items-center justify-center transition-all duration-100 select-none ' +
                                                        (lit
                                                            ? 'bg-red-600/30 border-red-500 text-red-400 shadow-[0_0_30px_rgba(239,68,68,0.5)] animate-target-pop cursor-pointer hover:bg-red-500/50 hover:scale-105 active:scale-90'
                                                            : 'bg-gray-900/80 border-gray-800 text-gray-700 cursor-default opacity-40')
                                                    }
                                                >
                                                    <NotifIcon size={26} />
                                                    {lit && <span className="text-[9px] font-bold mt-0.5 uppercase tracking-wide">{label}</span>}
                                                </button>
                                            );
                                        })}
                                    </div>
                                </div>
                            ) : uiState.brainHealth <= 0 ? (
                                <div className="absolute inset-0 z-50 flex flex-col items-center justify-center bg-gray-900/80 backdrop-blur-sm rounded-xl border-2 border-red-500/50 p-6">
                                    <div className="text-center mb-6">
                                        <Skull size={56} className="mx-auto text-red-500 mb-2 animate-pulse" />
                                        <h2 className="text-lg font-bold text-red-400 mb-1">SUBJECT UNRESPONSIVE</h2>
                                        <p className="text-gray-400 text-xs max-w-[220px] mx-auto">
                                            Engagement impossible. Subject has gone offline. Initiate Recovery Protocols?
                                        </p>
                                    </div>

                                    <div className="w-full space-y-2">
                                        <div className="text-[10px] font-mono text-gray-500 uppercase text-center mb-2">Crisis Recovery (Costs Engagement)</div>
                                        {RECOVERY_ACTIONS.map(action => {
                                            const RecIcon = action.icon;
                                            return (
                                                <button
                                                    key={action.id}
                                                    onClick={(e) => handleRecoveryClick(action, e)}
                                                    disabled={uiState.engagement < action.cost}
                                                    className={
                                                        'w-full flex items-center gap-3 p-3 rounded-lg border transition-all text-left group ' +
                                                        (uiState.engagement >= action.cost
                                                            ? 'bg-gray-800 border-gray-700 hover:bg-gray-700 hover:border-green-500/50'
                                                            : 'bg-gray-900 border-gray-800 opacity-50 cursor-not-allowed')
                                                    }
                                                >
                                                    <div className={'p-2 rounded bg-gray-900 group-hover:text-green-400 ' + (uiState.engagement >= action.cost ? 'text-gray-300' : 'text-gray-600')}>
                                                        <RecIcon size={20} />
                                                    </div>
                                                    <div className="flex-1">
                                                        <div className="flex justify-between items-center mb-1">
                                                            <span className="font-bold text-sm text-gray-200">{action.label}</span>
                                                            <span className="font-mono text-xs text-red-400">{action.cost > 0 ? '-' + action.cost + ' pts' : 'FREE'}</span>
                                                        </div>
                                                        <div className="text-[10px] text-gray-500">{action.desc}</div>
                                                    </div>
                                                </button>
                                            );
                                        })}
                                    </div>

                                    {/* Auto-Recovery Countdown */}
                                    {uiState.autoRecoverAt > 0 && (
                                        <div className="mt-4 w-full max-w-[260px]">
                                            <div className="text-[11px] font-mono text-blue-400 text-center mb-1.5 animate-pulse">
                                                SYSTEM: Auto-reboot in {Math.max(0, Math.ceil((uiState.autoRecoverAt - performance.now()) / 1000))}s...
                                            </div>
                                            <div className="h-1.5 bg-gray-800 rounded-full overflow-hidden">
                                                <div
                                                    className="h-full bg-blue-500/80 transition-all duration-200 rounded-full"
                                                    style={{ width: Math.min(100, Math.max(0, (1 - (uiState.autoRecoverAt - performance.now()) / 8000)) * 100) + '%' }}
                                                />
                                            </div>
                                        </div>
                                    )}
                                </div>
                            ) : (
                                <div className="grid grid-cols-2 gap-3 h-full overflow-y-auto pb-4 pr-1 scrollbar-none">
                                    {renderActionButtons('ENTERTAINMENT')}
                                    {renderActionButtons('OUTRAGE')}
                                    {renderActionButtons('SOCIAL')}
                                    {renderActionButtons('VALIDATION')}
                                </div>
                            )}
                        </div>

                        {/* Floating Numbers */}
                        <div className="absolute inset-0 pointer-events-none overflow-hidden">
                            {floaters.map(f => (
                                <div
                                    key={f.id}
                                    className={'absolute text-xl font-black animate-fade-up ' + f.color}
                                    style={{ left: f.x, top: f.y }}
                                >
                                    {f.text}
                                </div>
                            ))}
                        </div>

                    </div>

                    {/* RIGHT PANEL: Upgrades */}
                    <div className="w-full md:w-1/3 bg-gray-950 p-4 flex flex-col overflow-hidden border-l border-gray-800">
                        <h2 className="text-[10px] font-mono uppercase tracking-widest text-gray-500 mb-4 flex items-center gap-2">
                            <Lock size={12} /> Optimization Modules
                        </h2>

                        <div className="flex-1 overflow-y-auto space-y-2 pr-1 scrollbar-thin scrollbar-thumb-gray-800">
                            {UPGRADES.map((upgrade) => {
                                const isOwned = purchasedUpgrades.includes(upgrade.id);
                                const isUnlocked = uiState.engagement >= upgrade.cost;

                                return (
                                    <button
                                        key={upgrade.id}
                                        disabled={isOwned || !isUnlocked}
                                        onClick={() => buyUpgrade(upgrade)}
                                        className={
                                            'w-full text-left p-3 rounded border transition-all relative overflow-hidden group ' +
                                            (isOwned
                                                ? 'bg-green-900/10 border-green-900/30 opacity-60'
                                                : isUnlocked
                                                    ? 'bg-gray-900 border-gray-600 hover:border-green-500 hover:bg-gray-800 cursor-pointer'
                                                    : 'bg-gray-900/30 border-gray-800 opacity-40 cursor-not-allowed')
                                        }
                                    >
                                        {!isOwned && !isUnlocked && (
                                            <div
                                                className="absolute bottom-0 left-0 h-0.5 bg-gray-600 transition-all duration-500"
                                                style={{ width: (uiState.engagement / upgrade.cost) * 100 + '%' }}
                                            />
                                        )}

                                        <div className="flex justify-between items-center mb-1">
                                            <h3 className={'font-bold text-xs ' + (isOwned ? 'text-green-500' : 'text-gray-200')}>
                                                {upgrade.name}
                                            </h3>
                                            <span className={
                                                'font-mono text-[10px] px-1.5 py-0.5 rounded ' +
                                                (isOwned ? 'bg-green-900/30 text-green-400' : isUnlocked ? 'bg-blue-600 text-white animate-pulse' : 'bg-black/40 text-gray-500')
                                            }>
                                                {isOwned ? 'ACTIVE' : isUnlocked ? 'EVOLVE' : upgrade.cost}
                                            </span>
                                        </div>

                                        <p className="text-[10px] text-gray-400 mb-1 leading-relaxed">
                                            {upgrade.description}
                                        </p>

                                        <div className="flex items-center gap-2 text-[9px] font-mono uppercase tracking-wider text-gray-600">
                                            <span className="flex items-center gap-1 text-blue-400/80">
                                                <TrendingUp size={8} /> +{upgrade.pps}/s
                                            </span>
                                            {upgrade.effect && (
                                                <span className="flex items-center gap-1 text-red-400/80 truncate">
                                                    <AlertTriangle size={8} /> {upgrade.effect}
                                                </span>
                                            )}
                                        </div>
                                    </button>
                                );
                            })}
                        </div>
                    </div>
                </div>
            );
        }

        // ============================================================
        // MOUNT
        // ============================================================
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
