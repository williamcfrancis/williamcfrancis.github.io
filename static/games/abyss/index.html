<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abyss</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            overflow: hidden;
            background: #001e36;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            user-select: none;
        }
        canvas { display: block; }

        #ui-layer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px;
        }

        .hud-panel {
            background: rgba(0, 30, 60, 0.5);
            border: 1px solid rgba(100, 255, 255, 0.2);
            padding: 14px;
            border-radius: 8px;
            color: #dff;
            text-shadow: 0 0 4px rgba(0, 255, 255, 0.4);
        }

        #top-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        #status-container { width: 280px; }

        .bar-label {
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
            letter-spacing: 1px;
        }
        .bar-bg {
            width: 100%;
            height: 10px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 5px;
            overflow: hidden;
            margin-bottom: 10px;
        }
        .bar-fill { height: 100%; }

        #oxygen-label { color: #0ff; }
        #oxygen-bar-bg { border: 1px solid rgba(0,255,255,0.4); }
        #oxygen-fill { background: linear-gradient(90deg, #0066ff, #00ffff); width: 100%; }

        #energy-label { color: #ffcc00; }
        #energy-bar-bg { border: 1px solid rgba(255,204,0,0.4); }
        #energy-fill { background: #ffcc00; width: 100%; }

        #shield-row { display: none; }
        #shield-label { color: #44ff88; }
        #shield-bar-bg { border: 1px solid rgba(68,255,136,0.4); }
        #shield-fill { background: #44ff88; width: 100%; }

        #score-panel { text-align: right; min-width: 160px; }
        #score-display { font-size: 22px; font-weight: bold; }
        #depth-display { font-size: 13px; color: rgba(170, 255, 255, 0.7); margin-top: 4px; }
        #combo-display { font-size: 13px; color: #ffcc00; margin-top: 4px; opacity: 0; transition: opacity 0.3s; }
        #multiplier-display { font-size: 11px; color: rgba(255,180,80,0.8); margin-top: 2px; }

        #biome-display {
            position: absolute;
            bottom: 24px; right: 24px;
            font-size: 22px;
            font-weight: 300;
            color: rgba(255,255,255,0.3);
            text-transform: uppercase;
            letter-spacing: 5px;
            transition: color 1s, text-shadow 1s;
            text-align: right;
        }

        #compass-container {
            position: absolute;
            top: 90px; left: 50%;
            transform: translateX(-50%);
            width: 50px; height: 50px;
            opacity: 0.8;
        }
        #compass-arrow {
            border-bottom: 18px solid #00ffff;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            height: 0; width: 0;
            margin: 0 auto;
            transform-origin: 50% 18px;
        }
        #compass-text { text-align: center; font-size: 9px; margin-top: 24px; color: #0ff; letter-spacing: 1px; }

        #center-msg {
            position: absolute;
            top: 38%; left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            opacity: 0;
            transition: opacity 0.4s;
            pointer-events: none;
        }
        #center-msg h1 {
            font-size: 64px;
            color: #f0ffff;
            letter-spacing: 8px;
            text-shadow: 0 0 30px #00aaff;
            font-weight: 300;
        }
        #center-msg p {
            font-size: 16px;
            color: #aaddff;
            letter-spacing: 2px;
        }

        #feedback-msg {
            position: absolute;
            top: 52%; left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            opacity: 0;
            transition: opacity 0.25s;
            pointer-events: none;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        #screen-flash {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.15s;
        }

        #game-over-screen {
            display: none;
            flex-direction: column;
            pointer-events: auto;
            background: linear-gradient(rgba(0, 10, 20, 0.92), rgba(0, 5, 10, 0.96));
            width: 100%; height: 100%;
            position: absolute;
            top: 0; left: 0;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        #game-over-screen h1 {
            font-size: 52px; color: #f0ffff; letter-spacing: 6px;
            text-shadow: 0 0 20px #ff4400; font-weight: 300;
        }
        #game-over-screen p {
            font-size: 16px; color: #aaddff; margin-top: 12px; letter-spacing: 1px;
        }
        #stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px 24px;
            margin-top: 20px;
            font-size: 14px;
            color: #8cf;
        }
        #stats-grid .stat-val { color: #fff; font-weight: bold; text-align: right; }

        .back-to-games {
            position: absolute;
            top: 16px; left: 16px;
            z-index: 15;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 12px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(0, 255, 255, 0.35);
            color: #0ff;
            text-decoration: none;
            font-size: 13px;
            letter-spacing: 1px;
            transition: all 0.2s;
        }
        .back-to-games:hover {
            background: rgba(0, 255, 255, 0.12);
            border-color: #0ff;
        }

        button {
            background: rgba(0, 255, 255, 0.1);
            color: #0ff;
            border: 1px solid #0ff;
            padding: 14px 44px;
            font-size: 16px;
            font-family: inherit;
            cursor: pointer;
            margin-top: 28px;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-radius: 28px;
        }
        button:hover {
            background: rgba(0, 255, 255, 0.25);
            box-shadow: 0 0 20px #0ff;
        }

        #vignette {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 40%, #000c18 130%);
            pointer-events: none;
        }

        #reticle {
            position: absolute;
            width: 36px; height: 36px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 5;
        }
        #reticle.locked {
            border-color: #ffcc00;
            border-width: 2px;
            width: 28px; height: 28px;
            box-shadow: 0 0 12px #ffcc00;
        }
        #reticle.shielded {
            border-color: #44ff88;
            box-shadow: 0 0 12px #44ff88;
        }

        #near-miss-indicator {
            position: absolute;
            top: 60%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 18px;
            font-weight: bold;
            color: #ff8800;
            opacity: 0;
            pointer-events: none;
            text-shadow: 0 0 10px #ff4400;
            transition: opacity 0.2s;
            letter-spacing: 2px;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="vignette"></div>
    <div id="reticle"></div>
    <div id="screen-flash"></div>

    <div id="ui-layer">
        <div id="top-bar">
            <div id="status-container" class="hud-panel">
                <div id="oxygen-label" class="bar-label"><span>O2 LEVELS</span><span id="oxy-text">100%</span></div>
                <div id="oxygen-bar-bg" class="bar-bg"><div id="oxygen-fill" class="bar-fill"></div></div>

                <div id="energy-label" class="bar-label"><span>ENERGY</span></div>
                <div id="energy-bar-bg" class="bar-bg"><div id="energy-fill" class="bar-fill"></div></div>

                <div id="shield-row">
                    <div id="shield-label" class="bar-label"><span>SHIELD</span></div>
                    <div id="shield-bar-bg" class="bar-bg"><div id="shield-fill" class="bar-fill"></div></div>
                </div>
            </div>

            <div id="compass-container">
                <div id="compass-arrow"></div>
                <div id="compass-text">SONAR</div>
            </div>

            <div id="score-panel" class="hud-panel">
                <div id="score-display">0</div>
                <div id="depth-display">DEPTH: 0m</div>
                <div id="combo-display">COMBO x1</div>
                <div id="multiplier-display">DEPTH x1.0</div>
            </div>
        </div>

        <div id="biome-display">The Shallows</div>

        <div id="center-msg">
            <h1>ABYSS</h1>
            <p>Move Mouse to Swim. Hold Space/Click to Dash.<br>Dash into mines to destroy them. Collect artifacts to score.</p>
        </div>
    </div>

    <div id="feedback-msg"></div>
    <div id="near-miss-indicator">NEAR MISS!</div>

    <div id="game-over-screen">
        <a class="back-to-games" href="/games/"><span>&#8592;</span> Back to games</a>
        <h1>SYSTEM OFFLINE</h1>
        <div id="stats-grid">
            <span>Depth</span><span class="stat-val" id="stat-depth">0m</span>
            <span>Score</span><span class="stat-val" id="stat-score">0</span>
            <span>Best Combo</span><span class="stat-val" id="stat-combo">x0</span>
            <span>Mines Destroyed</span><span class="stat-val" id="stat-mines">0</span>
            <span>Near Misses</span><span class="stat-val" id="stat-nearmiss">0</span>
        </div>
        <button onclick="resetGame()">Initialize Dive</button>
    </div>

    <script>
    // ============================================================
    //  ABYSS: DEEP BLUE — Performance-Optimized
    // ============================================================
    'use strict';

    // --- Cached DOM refs ---
    const dom = {
        oxyFill: document.getElementById('oxygen-fill'),
        oxyText: document.getElementById('oxy-text'),
        energyFill: document.getElementById('energy-fill'),
        shieldRow: document.getElementById('shield-row'),
        shieldFill: document.getElementById('shield-fill'),
        scoreTxt: document.getElementById('score-display'),
        depthTxt: document.getElementById('depth-display'),
        comboTxt: document.getElementById('combo-display'),
        multTxt: document.getElementById('multiplier-display'),
        biomeTxt: document.getElementById('biome-display'),
        centerMsg: document.getElementById('center-msg'),
        feedbackMsg: document.getElementById('feedback-msg'),
        nearMiss: document.getElementById('near-miss-indicator'),
        compass: document.getElementById('compass-arrow'),
        reticle: document.getElementById('reticle'),
        flash: document.getElementById('screen-flash'),
        gameOver: document.getElementById('game-over-screen'),
        statDepth: document.getElementById('stat-depth'),
        statScore: document.getElementById('stat-score'),
        statCombo: document.getElementById('stat-combo'),
        statMines: document.getElementById('stat-mines'),
        statNearMiss: document.getElementById('stat-nearmiss'),
    };

    // --- Configuration ---
    const cfg = {
        baseSpeed: 0.6,
        dashSpeed: 2.0,
        dashDrain: 1.2,
        energyRecharge: 0.18,
        boundsX: 36, boundsY: 22,
        spawnDist: 120,
        despawnDist: 28,
        oxyDrainBase: 0.065,
        oxyRestore: 22,
        floorY: -22,
        surfaceY: 28,
        nearMissDist: 5.5,
        hitRadiusOxy: 2.2,
        hitRadiusMine: 3.2,
        hitRadiusArtifact: 2.0,
        hitRadiusShield: 2.5,
        comboWindow: 2.0,
        magnetRange: 18,
        magnetStr: 0.12,
        maxEntities: 55,
    };

    // Pre-compute squared radii (avoid sqrt in collision checks)
    const HR2_OXY = cfg.hitRadiusOxy * cfg.hitRadiusOxy;
    const HR2_MINE = cfg.hitRadiusMine * cfg.hitRadiusMine;
    const HR2_ART = cfg.hitRadiusArtifact * cfg.hitRadiusArtifact;
    const HR2_SHIELD = cfg.hitRadiusShield * cfg.hitRadiusShield;
    const HR2_NEAR = cfg.nearMissDist * cfg.nearMissDist;
    const HR2_MAGNET = cfg.magnetRange * cfg.magnetRange;

    const biomes = [
        { limit: 800, name: "The Shallows", color: 0x004466, fog: 0x004466, density: 0.0018, light: 0x44eeff },
        { limit: 2200, name: "The Midnight Zone", color: 0x110022, fog: 0x110022, density: 0.004, light: 0xaa00ff },
        { limit: 4000, name: "The Abyssal Rift", color: 0x1a0000, fog: 0x1a0000, density: 0.006, light: 0xff0000 },
        { limit: Infinity, name: "The Void", color: 0x050005, fog: 0x050005, density: 0.008, light: 0x440044 }
    ];

    // Pre-build biome THREE.Color objects (avoids allocation during transitions)
    for (const b of biomes) {
        b._fogCol = new THREE.Color(b.fog);
        b._bgCol = new THREE.Color(b.color);
        b._lightCol = new THREE.Color(b.light);
    }

    // --- Game State ---
    const state = {
        playing: false,
        started: false,
        score: 0,
        depth: 0,
        absDepth: 0,
        oxygen: 100,
        energy: 100,
        shield: 0,
        dashing: false,
        mouseX: 0, mouseY: 0,
        targetX: 0, targetY: 0,
        speed: cfg.baseSpeed,
        biomeIdx: 0,
        shakeAmt: 0,
        combo: 0,
        comboTimer: 0,
        bestCombo: 0,
        minesDestroyed: 0,
        nearMisses: 0,
        nearMissTimer: 0,
        fovTarget: 65,
        lastTime: 0,
        hudFrame: 0,          // throttle HUD text updates
        prevShieldVis: false,  // track shield visibility to avoid redundant DOM writes
        prevDashing: false,    // track dash state to avoid redundant classList ops
    };

    // --- Pre-allocated temp objects (zero GC) ---
    const _tmpVec = new THREE.Vector3();

    // --- Renderer ---
    const renderer = new THREE.WebGLRenderer({ antialias: false, alpha: false, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
    document.body.prepend(renderer.domElement);

    // --- Scene ---
    const scene = new THREE.Scene();
    const b0 = biomes[0];
    scene.fog = new THREE.FogExp2(b0.fog, b0.density);
    scene.background = new THREE.Color(b0.color);

    // Tighter far plane — nothing spawns beyond 140
    const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.5, 180);
    camera.position.z = 5;

    // --- Lighting (no shadows, minimal lights) ---
    const hemiLight = new THREE.HemisphereLight(b0.light, 0x000000, 0.9);
    scene.add(hemiLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.7);
    dirLight.position.set(0, 40, 20);
    scene.add(dirLight);

    // Spotlight follows camera
    const spotLight = new THREE.SpotLight(0xffffff, 2.5);
    spotLight.angle = 0.85;
    spotLight.penumbra = 0.4;
    spotLight.decay = 1;
    spotLight.distance = 160;
    scene.add(spotLight);
    scene.add(spotLight.target);

    // --- Shared Geometries (created once, reused everywhere) ---
    const geoSphere = new THREE.SphereGeometry(1, 8, 8);
    const geoArtifact = new THREE.IcosahedronGeometry(0.8, 0);
    const geoMine = new THREE.IcosahedronGeometry(1.3, 0);  // Single mesh per mine (was 7 meshes!)
    const geoBox = new THREE.BoxGeometry(0.5, 7, 0.5);
    const geoRock = new THREE.DodecahedronGeometry(2, 0);
    const geoShield = new THREE.OctahedronGeometry(0.7, 0);

    // --- Materials (downgraded for performance) ---
    // O2 & Shield: MeshBasicMaterial (no lighting calc needed — they glow)
    const matOxygen = new THREE.MeshBasicMaterial({
        color: 0x33ddff, transparent: true, opacity: 0.8
    });
    const matShield = new THREE.MeshBasicMaterial({
        color: 0x55ffaa, transparent: true, opacity: 0.75
    });
    // Mines & Rocks: MeshLambertMaterial (cheap diffuse shading, no PBR)
    const matMine = new THREE.MeshLambertMaterial({
        color: 0x444444, emissive: 0x111111, flatShading: true
    });
    const matRock = new THREE.MeshLambertMaterial({
        color: 0x112233, flatShading: true
    });
    // Artifacts keep MeshStandardMaterial for the metallic gold look
    const matGold = new THREE.MeshStandardMaterial({
        color: 0xffcc00, emissive: 0xff8800, emissiveIntensity: 0.5,
        roughness: 0.2, metalness: 0.9
    });
    const matSeaweed = new THREE.MeshBasicMaterial({ color: 0x005522, transparent: true, opacity: 0.35 });

    // --- Environment ---
    const floorGeo = new THREE.PlaneGeometry(280, 280, 20, 20);
    {
        const pos = floorGeo.attributes.position;
        for (let i = 0; i < pos.count; i++) {
            pos.setZ(i, Math.sin(pos.getX(i) * 0.1) * 2 + Math.cos(pos.getY(i) * 0.1) * 2);
        }
        floorGeo.computeVertexNormals();
    }
    const seaBed = new THREE.Mesh(floorGeo, new THREE.MeshLambertMaterial({
        color: 0x001122, flatShading: true
    }));
    seaBed.rotation.x = -Math.PI / 2;
    seaBed.position.y = cfg.floorY;
    scene.add(seaBed);

    const surface = new THREE.Mesh(
        new THREE.PlaneGeometry(280, 280),
        new THREE.MeshBasicMaterial({ color: 0x006688, transparent: true, opacity: 0.15, side: THREE.DoubleSide })
    );
    surface.rotation.x = Math.PI / 2;
    surface.position.y = cfg.surfaceY;
    scene.add(surface);

    // --- Particles: Marine Snow (reduced) ---
    const snowCount = 800;
    const snowGeo = new THREE.BufferGeometry();
    const snowArr = new Float32Array(snowCount * 3);
    for (let i = 0; i < snowCount; i++) {
        snowArr[i * 3] = (Math.random() - 0.5) * 90;
        snowArr[i * 3 + 1] = (Math.random() - 0.5) * 50;
        snowArr[i * 3 + 2] = (Math.random() - 0.5) * 220;
    }
    snowGeo.setAttribute('position', new THREE.BufferAttribute(snowArr, 3));
    const snowSystem = new THREE.Points(snowGeo, new THREE.PointsMaterial({
        color: 0xaaccff, size: 0.2, transparent: true, opacity: 0.45
    }));
    scene.add(snowSystem);

    // --- Explosion Particles (reduced) ---
    const explCount = 80;
    const explGeo = new THREE.BufferGeometry();
    const explArr = new Float32Array(explCount * 3);
    explArr.fill(9999);
    explGeo.setAttribute('position', new THREE.BufferAttribute(explArr, 3));
    const explSystem = new THREE.Points(explGeo, new THREE.PointsMaterial({
        color: 0xffaa00, size: 0.45, transparent: true
    }));
    scene.add(explSystem);
    let explActive = false, explTime = 0;
    const explCenter = new THREE.Vector3();

    // Pre-compute sin/cos lookup for explosion (avoids trig per particle per frame)
    const explSinT = new Float32Array(explCount);
    const explCosT = new Float32Array(explCount);
    const explSinP = new Float32Array(explCount);
    const explCosP = new Float32Array(explCount);
    for (let i = 0; i < explCount; i++) {
        const theta = i * 0.1, phi = i * 0.2;
        explSinT[i] = Math.sin(theta); explCosT[i] = Math.cos(theta);
        explSinP[i] = Math.sin(phi);   explCosP[i] = Math.cos(phi);
    }

    // ===========================================================
    //  Entity System — Separate interactable vs decor
    // ===========================================================
    const entities = [];  // Only oxygen, artifact, mine, shield
    const decorArr = [];  // Seaweed, rocks (no collision, no animation)

    function setRandPos(obj, z) {
        obj.position.x = (Math.random() - 0.5) * cfg.boundsX * 2;
        obj.position.y = (Math.random() - 0.5) * cfg.boundsY * 2;
        obj.position.z = z;
    }

    // --- Spawn functions ---
    function spawnOxygen(z) {
        const m = new THREE.Mesh(geoSphere, matOxygen);
        setRandPos(m, z);
        m.userData.type = 'oxygen';
        scene.add(m);
        entities.push(m);
    }

    function spawnMine(z) {
        // Single mesh! Was previously a Group with 7 children = 7 draw calls.
        const m = new THREE.Mesh(geoMine, matMine);
        setRandPos(m, z);
        m.scale.setScalar(1.3 + Math.random() * 0.8);
        m.rotation.set(Math.random() * 6, Math.random() * 6, Math.random() * 6);
        m.userData.type = 'mine';
        m.userData.rotSpd = 0.015 + Math.random() * 0.01;
        scene.add(m);
        entities.push(m);
    }

    function spawnArtifact(z) {
        const m = new THREE.Mesh(geoArtifact, matGold);
        setRandPos(m, z);
        m.userData.type = 'artifact';
        m.userData.rotSpd = 0.04;
        scene.add(m);
        entities.push(m);
    }

    function spawnShield(z) {
        const m = new THREE.Mesh(geoShield, matShield);
        setRandPos(m, z);
        m.userData.type = 'shield';
        m.userData.rotSpd = 0.03;
        scene.add(m);
        entities.push(m);
    }

    function spawnDecor(z) {
        const isWeed = Math.random() > 0.35;
        let m;
        if (isWeed) {
            m = new THREE.Mesh(geoBox, matSeaweed);
            m.scale.y = 1 + Math.random() * 2;
            m.rotation.z = (Math.random() - 0.5) * 0.5;
        } else {
            m = new THREE.Mesh(geoRock, matRock);
            m.scale.set(1.2, 0.6, 1.2);
        }
        m.position.x = (Math.random() - 0.5) * cfg.boundsX * 3;
        m.position.y = cfg.floorY + (isWeed ? 3.5 : 0.8);
        m.position.z = z;
        // Decor is static — disable per-frame matrix recalc
        m.matrixAutoUpdate = false;
        m.updateMatrix();
        scene.add(m);
        decorArr.push(m);
    }

    // --- Swap-and-pop removal (O(1) instead of splice O(n)) ---
    function removeEntity(i) {
        scene.remove(entities[i]);
        const last = entities.length - 1;
        if (i !== last) entities[i] = entities[last];
        entities.length = last;
    }

    function removeDecor(i) {
        scene.remove(decorArr[i]);
        const last = decorArr.length - 1;
        if (i !== last) decorArr[i] = decorArr[last];
        decorArr.length = last;
    }

    // --- Explosion ---
    function triggerExplosion(pos) {
        explActive = true;
        explTime = 0;
        explCenter.copy(pos);
        explSystem.material.opacity = 1;
    }

    function updateExplosion(dt) {
        if (!explActive) return;
        explTime += dt * 2.5;
        const arr = explGeo.attributes.position.array;
        if (explTime > 1) {
            explActive = false;
            arr.fill(9999);
            explGeo.attributes.position.needsUpdate = true;
            return;
        }
        const r = 1.5 + explTime * 14;
        const cx = explCenter.x, cy = explCenter.y, cz = explCenter.z;
        for (let i = 0; i < explCount; i++) {
            const i3 = i * 3;
            arr[i3]     = cx + r * explSinT[i] * explCosP[i];
            arr[i3 + 1] = cy + r * explSinT[i] * explSinP[i];
            arr[i3 + 2] = cz + r * explCosT[i];
        }
        explSystem.material.opacity = 1 - explTime;
        explGeo.attributes.position.needsUpdate = true;
    }

    // --- Screen Flash ---
    let flashTimer = 0;
    function screenFlash(color, duration) {
        dom.flash.style.background = color;
        dom.flash.style.opacity = '0.3';
        flashTimer = duration || 0.2;
    }

    // --- Feedback Text ---
    let feedbackTimer = 0;
    function showFeedback(text, color) {
        dom.feedbackMsg.textContent = text;
        dom.feedbackMsg.style.color = color;
        dom.feedbackMsg.style.textShadow = '0 0 12px ' + color;
        dom.feedbackMsg.style.opacity = '1';
        feedbackTimer = 0.7;
    }

    // --- Near Miss ---
    function showNearMiss() {
        state.nearMisses++;
        state.nearMissTimer = 0.6;
        dom.nearMiss.style.opacity = '1';
        const bonus = Math.ceil(getDepthMult());
        state.score += bonus;
        bumpCombo();
    }

    // --- Combo ---
    function bumpCombo() {
        state.combo++;
        state.comboTimer = cfg.comboWindow;
        if (state.combo > state.bestCombo) state.bestCombo = state.combo;
        dom.comboTxt.style.opacity = '1';
        dom.comboTxt.textContent = 'COMBO x' + state.combo;
    }

    function getComboMult() {
        return 1 + (state.combo / 3 | 0) * 0.5;
    }
    function getDepthMult() {
        return 1 + (state.absDepth / 500 | 0) * 0.5;
    }
    function getDiff() {
        return state.absDepth / 3000;  // unclamped — used with Math.min where needed
    }

    // --- Biome Transition ---
    function updateBiome() {
        const dist = state.absDepth;
        const curB = biomes[state.biomeIdx];
        if (biomes[state.biomeIdx + 1] && dist > curB.limit) {
            state.biomeIdx++;
            const b = biomes[state.biomeIdx];
            dom.biomeTxt.textContent = b.name;
            dom.biomeTxt.style.color = '#fff';
            dom.biomeTxt.style.textShadow = '0 0 16px ' + b._lightCol.getStyle();
            setTimeout(function() { dom.biomeTxt.style.color = 'rgba(255,255,255,0.3)'; }, 2500);
        }
        const tb = biomes[state.biomeIdx];
        scene.fog.color.lerp(tb._fogCol, 0.008);
        scene.background.lerp(tb._bgCol, 0.008);
        hemiLight.color.lerp(tb._lightCol, 0.008);
        scene.fog.density += (tb.density - scene.fog.density) * 0.008;
    }

    // --- Spawning & Despawning ---
    function manageSpawning() {
        const camZ = camera.position.z;
        const spawnZ = camZ - cfg.spawnDist;
        const deleteZ = camZ + cfg.despawnDist;

        // Despawn decor (swap-and-pop, reverse iteration)
        for (let i = decorArr.length - 1; i >= 0; i--) {
            if (decorArr[i].position.z > deleteZ) removeDecor(i);
        }

        // Despawn entities (swap-and-pop, reverse iteration)
        for (let i = entities.length - 1; i >= 0; i--) {
            if (entities[i].position.z > deleteZ) removeEntity(i);
        }

        const diff = Math.min(getDiff(), 1.5);
        const cap = cfg.maxEntities + (diff * 15 | 0);

        if (entities.length + decorArr.length < cap) {
            const r = Math.random();
            const pz = spawnZ - Math.random() * 20;

            if (r < 0.08) spawnOxygen(pz);
            else if (r < 0.16) spawnArtifact(pz);
            else if (r < 0.18 && Math.random() < 0.3 + diff * 0.1) spawnShield(pz);
            else if (r < 0.35 + diff * 0.2) spawnMine(pz);
            else if (r < 0.75) spawnDecor(pz);
        }
    }

    // ===========================================================
    //  Unified Entity Loop — animate + collide + compass + magnet
    //  Single iteration over entities[] per frame
    // ===========================================================
    let nearOxyObj = null;
    let nearOxyDistSq = 0;

    function processEntities(timeSec) {
        const px = camera.position.x;
        const py = camera.position.y;
        const pz = camera.position.z - 1;
        const camZ = camera.position.z;
        const isDash = state.dashing;
        const sinT3 = 1 + Math.sin(timeSec * 3) * 0.15;
        const sinT4 = 0.8 + Math.sin(timeSec * 4) * 0.15;

        nearOxyObj = null;
        nearOxyDistSq = Infinity;

        for (let i = 0; i < entities.length; ) {
            const e = entities[i];
            const ud = e.userData;
            const t = ud.type;
            const ep = e.position;

            // --- Animation ---
            if (ud.rotSpd) {
                e.rotation.x += ud.rotSpd;
                e.rotation.y += ud.rotSpd;
            }
            if (t === 'oxygen') e.scale.setScalar(sinT3);
            else if (t === 'shield') e.scale.setScalar(sinT4);

            // --- Magnet (dash pulls collectibles) ---
            if (isDash && t !== 'mine') {
                const mdx = px - ep.x, mdy = py - ep.y, mdz = pz - ep.z;
                const mdsq = mdx * mdx + mdy * mdy + mdz * mdz;
                if (mdsq < HR2_MAGNET && mdsq > 1) {
                    ep.x += mdx * cfg.magnetStr;
                    ep.y += mdy * cfg.magnetStr;
                    ep.z += mdz * cfg.magnetStr;
                }
            }

            // --- Distance for collision ---
            const dx = px - ep.x, dy = py - ep.y, dz = pz - ep.z;
            const dsq = dx * dx + dy * dy + dz * dz;

            let removed = false;

            // --- Collision ---
            if (t === 'oxygen') {
                if (dsq < HR2_OXY) {
                    state.oxygen = Math.min(state.oxygen + cfg.oxyRestore, 100);
                    showFeedback('O2 REPLENISHED', '#0ff');
                    screenFlash('rgba(0,255,255,0.4)', 0.15);
                    removed = true;
                } else if (ep.z < camZ) {
                    // Compass: track nearest O2 ahead
                    const cdist = (camZ - ep.z); // rough forward distance
                    const cd2 = dx * dx + dy * dy + cdist * cdist;
                    if (cd2 < nearOxyDistSq) { nearOxyDistSq = cd2; nearOxyObj = e; }
                }
            }
            else if (t === 'artifact' && dsq < HR2_ART) {
                bumpCombo();
                const pts = Math.ceil((isDash ? 3 : 1) * getComboMult() * getDepthMult());
                state.score += pts;
                dom.scoreTxt.textContent = state.score;
                showFeedback(state.combo > 2 ? 'COMBO x' + state.combo + '! +' + pts : '+' + pts, '#fb0');
                screenFlash('rgba(255,200,0,0.3)', 0.12);
                removed = true;
            }
            else if (t === 'shield' && dsq < HR2_SHIELD) {
                state.shield = Math.min(state.shield + 50, 100);
                showFeedback('SHIELD ACTIVE', '#44ff88');
                screenFlash('rgba(68,255,136,0.3)', 0.15);
                removed = true;
            }
            else if (t === 'mine') {
                if (dsq < HR2_MINE) {
                    if (isDash) {
                        triggerExplosion(ep);
                        state.minesDestroyed++;
                        bumpCombo();
                        const pts = Math.ceil(5 * getComboMult() * getDepthMult());
                        state.score += pts;
                        dom.scoreTxt.textContent = state.score;
                        showFeedback('MINE DESTROYED! +' + pts, '#ff4400');
                        screenFlash('rgba(255,100,0,0.3)', 0.15);
                    } else if (state.shield > 0) {
                        state.shield = Math.max(state.shield - 40, 0);
                        showFeedback('SHIELD HIT!', '#44ff88');
                        screenFlash('rgba(68,255,136,0.4)', 0.2);
                    } else {
                        state.oxygen -= 25;
                        showFeedback('HULL BREACH!', '#f33');
                        screenFlash('rgba(255,0,0,0.4)', 0.3);
                        camera.position.z += 4;
                    }
                    removed = true;
                }
                else if (dsq < HR2_NEAR && ep.z > pz && state.nearMissTimer <= 0) {
                    showNearMiss();
                }
            }

            if (removed) {
                // Swap-and-pop: O(1) removal
                scene.remove(e);
                const last = entities.length - 1;
                if (i !== last) entities[i] = entities[last];
                entities.length = last;
                // Don't increment — re-check swapped element at index i
            } else {
                i++;
            }
        }
    }

    // --- Update Compass ---
    function updateCompass() {
        if (nearOxyObj && nearOxyDistSq < 40000) {
            dom.compass.style.opacity = '1';
            _tmpVec.copy(nearOxyObj.position).applyMatrix4(camera.matrixWorldInverse);
            const ang = Math.atan2(_tmpVec.y, _tmpVec.x);
            dom.compass.style.transform = 'rotate(' + ((ang * 57.2958) - 90) + 'deg)'; // 180/PI = 57.2958
        } else {
            dom.compass.style.opacity = '0.2';
            dom.compass.style.transform = 'rotate(0deg)';
        }
    }

    // --- Update HUD (some text throttled to every 3rd frame) ---
    function updateHUD(dt) {
        const diff = Math.min(getDiff(), 1.5);
        const dt60 = dt * 60;
        state.oxygen -= (cfg.oxyDrainBase + diff * 0.04) * dt60;
        if (state.oxygen <= 0) { state.oxygen = 0; gameOver(); return; }

        // Bar widths — cheap style writes
        dom.oxyFill.style.width = state.oxygen + '%';
        dom.energyFill.style.width = state.energy + '%';

        // Shield visibility — only write DOM when state changes
        const showShield = state.shield > 0;
        if (showShield !== state.prevShieldVis) {
            state.prevShieldVis = showShield;
            dom.shieldRow.style.display = showShield ? 'block' : 'none';
            if (showShield) dom.reticle.classList.add('shielded');
            else dom.reticle.classList.remove('shielded');
        }
        if (showShield) dom.shieldFill.style.width = state.shield + '%';

        // Dash state
        if (state.dashing) {
            state.energy -= cfg.dashDrain * dt60;
            state.speed = cfg.dashSpeed;
            state.shakeAmt = 0.35;
            state.fovTarget = 85;
            if (state.energy <= 0) { state.energy = 0; state.dashing = false; }
        } else {
            state.speed = cfg.baseSpeed + diff * 0.25;
            state.energy = Math.min(state.energy + cfg.energyRecharge * dt60, 100);
            state.shakeAmt = 0;
            state.fovTarget = 65;
        }

        // Dash reticle class — only toggle on change
        if (state.dashing !== state.prevDashing) {
            state.prevDashing = state.dashing;
            if (state.dashing) dom.reticle.classList.add('locked');
            else dom.reticle.classList.remove('locked');
        }

        // FOV — only update projection matrix when actually changing
        const fovDelta = state.fovTarget - camera.fov;
        if (fovDelta * fovDelta > 0.25) { // abs > 0.5
            camera.fov += fovDelta * 0.08;
            camera.updateProjectionMatrix();
        }

        // Combo timer
        if (state.comboTimer > 0) {
            state.comboTimer -= dt;
            if (state.comboTimer <= 0) {
                state.combo = 0;
                dom.comboTxt.style.opacity = '0';
            }
        }

        // Flash / feedback timers
        if (flashTimer > 0) { flashTimer -= dt; if (flashTimer <= 0) dom.flash.style.opacity = '0'; }
        if (feedbackTimer > 0) { feedbackTimer -= dt; if (feedbackTimer <= 0) dom.feedbackMsg.style.opacity = '0'; }
        if (state.nearMissTimer > 0) { state.nearMissTimer -= dt; if (state.nearMissTimer <= 0) dom.nearMiss.style.opacity = '0'; }

        // Camera shake
        if (state.shakeAmt > 0) {
            camera.position.x += (Math.random() - 0.5) * state.shakeAmt;
            camera.position.y += (Math.random() - 0.5) * state.shakeAmt;
        }

        // Throttle text DOM updates to every 3rd frame (~20fps text, still smooth visually)
        state.hudFrame++;
        if (state.hudFrame % 3 === 0) {
            dom.oxyText.textContent = (state.oxygen | 0) + '%';
            dom.depthTxt.textContent = 'DEPTH: ' + (state.absDepth | 0) + 'm';
            dom.multTxt.textContent = 'DEPTH x' + getDepthMult().toFixed(1);
        }
    }

    // --- Game Over ---
    function gameOver() {
        state.playing = false;
        dom.statDepth.textContent = (state.absDepth | 0) + 'm';
        dom.statScore.textContent = state.score;
        dom.statCombo.textContent = 'x' + state.bestCombo;
        dom.statMines.textContent = state.minesDestroyed;
        dom.statNearMiss.textContent = state.nearMisses;
        dom.gameOver.style.display = 'flex';
    }

    // --- Reset ---
    window.resetGame = function () {
        state.score = 0; state.oxygen = 100; state.depth = 0; state.absDepth = 0;
        state.energy = 100; state.shield = 0; state.combo = 0; state.comboTimer = 0;
        state.bestCombo = 0; state.minesDestroyed = 0; state.nearMisses = 0;
        state.nearMissTimer = 0; state.playing = true; state.started = true;
        state.biomeIdx = 0; state.dashing = false; state.prevDashing = false;
        state.fovTarget = 65; state.lastTime = 0; state.hudFrame = 0;
        state.prevShieldVis = false;
        camera.position.set(0, 0, 5);
        camera.rotation.set(0, 0, 0);
        camera.fov = 65;
        camera.updateProjectionMatrix();

        for (let i = entities.length - 1; i >= 0; i--) scene.remove(entities[i]);
        entities.length = 0;
        for (let i = decorArr.length - 1; i >= 0; i--) scene.remove(decorArr[i]);
        decorArr.length = 0;

        scene.fog.color.set(b0.fog);
        scene.fog.density = b0.density;
        scene.background.set(b0.color);
        hemiLight.color.set(b0.light);

        dom.gameOver.style.display = 'none';
        dom.scoreTxt.textContent = '0';
        dom.biomeTxt.textContent = 'The Shallows';
        dom.biomeTxt.style.color = 'rgba(255,255,255,0.3)';
        dom.comboTxt.style.opacity = '0';
        dom.flash.style.opacity = '0';
        dom.feedbackMsg.style.opacity = '0';
        dom.nearMiss.style.opacity = '0';
        dom.shieldRow.style.display = 'none';
        dom.reticle.classList.remove('locked', 'shielded');

        for (let i = 0; i < 12; i++) {
            spawnOxygen(-18 - i * 10);
            spawnDecor(-18 - i * 10);
        }
    };

    // --- Input ---
    document.addEventListener('mousemove', function (e) {
        if (!state.playing) return;
        dom.reticle.style.left = e.clientX + 'px';
        dom.reticle.style.top = e.clientY + 'px';
        state.mouseX = (e.clientX / window.innerWidth) * 2 - 1;
        state.mouseY = -(e.clientY / window.innerHeight) * 2 + 1;
    });

    function dashOn() { if (state.energy > 15 && state.playing) state.dashing = true; }
    function dashOff() { state.dashing = false; }

    document.addEventListener('mousedown', function (e) {
        if (!state.started) { resetGame(); return; }
        if (e.button === 0 || e.button === 2) dashOn();
    });
    document.addEventListener('mouseup', dashOff);
    document.addEventListener('keydown', function (e) {
        if (e.code === 'Space') {
            e.preventDefault();
            if (!state.started) { resetGame(); return; }
            dashOn();
        }
    });
    document.addEventListener('keyup', function (e) { if (e.code === 'Space') dashOff(); });
    window.addEventListener('contextmenu', function (e) { e.preventDefault(); });

    // --- Resize ---
    window.addEventListener('resize', function () {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- Page Visibility: pause rendering when tab is hidden ---
    let tabVisible = true;
    document.addEventListener('visibilitychange', function () {
        tabVisible = !document.hidden;
        if (tabVisible) state.lastTime = 0; // reset dt to avoid time jump
    });

    // --- Title ---
    setTimeout(function () { dom.centerMsg.style.opacity = '1'; }, 400);

    // ===========================================================
    //  Main Loop
    // ===========================================================
    function animate(time) {
        requestAnimationFrame(animate);
        if (!tabVisible) return; // Skip rendering entirely when tab is hidden

        const timeSec = time * 0.001;
        const dt = state.lastTime > 0 ? Math.min(timeSec - state.lastTime, 0.05) : 0.016;
        state.lastTime = timeSec;

        if (!state.playing) {
            renderer.render(scene, camera);
            return;
        }

        // Hide title
        if (state.absDepth > 20) dom.centerMsg.style.opacity = '0';

        // Movement
        camera.position.z -= state.speed * dt * 60;
        state.depth = camera.position.z;
        state.absDepth = -state.depth; // cache once, used everywhere

        state.targetX = state.mouseX * cfg.boundsX;
        state.targetY = state.mouseY * cfg.boundsY;
        camera.position.x += (state.targetX - camera.position.x) * 0.07;
        camera.position.y += (state.targetY - camera.position.y) * 0.07;

        // Camera tilt
        const diffX = state.targetX - camera.position.x;
        const diffY = state.targetY - camera.position.y;
        camera.rotation.y += (diffX * -0.04 - camera.rotation.y) * 0.08;
        camera.rotation.x += (diffY * 0.04 - camera.rotation.x) * 0.08;
        camera.rotation.z += (diffX * -0.015 - camera.rotation.z) * 0.08;

        // Spotlight follows camera
        spotLight.position.copy(camera.position);
        spotLight.target.position.set(camera.position.x, camera.position.y, camera.position.z - 50);
        spotLight.target.updateMatrixWorld();

        // Environment tracking
        seaBed.position.z = camera.position.z;
        surface.position.z = camera.position.z;
        snowSystem.position.z = camera.position.z;

        // Unified entity processing (animate + collide + compass + magnet — single pass)
        processEntities(timeSec);

        // Systems
        updateCompass();
        updateBiome();
        updateHUD(dt);
        manageSpawning();
        updateExplosion(dt);

        renderer.render(scene, camera);
    }

    animate(0);
    </script>
</body>
</html>
