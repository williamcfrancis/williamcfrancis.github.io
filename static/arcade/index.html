<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>The Arcade — a sandbox of games</title>
<meta name="description" content="A playful physics sandbox hub for browser games and interactive experiments. Drag, throw, and launch 20+ games." />
<meta name="theme-color" content="#0a0a18" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ctext y='20' font-size='22'%3E%E2%97%86%3C/text%3E%3C/svg%3E" />
<style>
  :root {
    color-scheme: dark;
    --bg: #07071a;
    --bg-deep: #04040f;
    --ink: #e8ecff;
    --muted: #8a90b8;
    --line: rgba(255,255,255,0.08);
    --glass: rgba(14,14,36,0.55);
    --glass-strong: rgba(14,14,36,0.78);
    --pink: #ff6ec7;
    --cyan: #6ecbff;
    --amber: #ffd36e;
    --green: #7cf0c1;
    --violet: #c26eff;
    --coral: #ff9b6e;
    --sky: #8ea9ff;
    --teal: #6ef0d8;
    --rose: #ff6e9b;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Inter', 'Segoe UI', ui-sans-serif, system-ui, sans-serif;
    background: radial-gradient(1200px 800px at 20% 10%, #130d3a 0%, var(--bg) 55%, var(--bg-deep) 100%);
    color: var(--ink);
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
    cursor: crosshair;
  }

  /* Background canvas sits behind everything */
  #bg {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    z-index: 0;
    pointer-events: none;
  }

  /* Soft dot grid overlay */
  body::before {
    content: "";
    position: fixed; inset: 0;
    background-image:
      radial-gradient(rgba(255,255,255,0.045) 1px, transparent 1px);
    background-size: 28px 28px;
    background-position: -1px -1px;
    pointer-events: none;
    z-index: 0;
    mask-image: radial-gradient(ellipse at center, #000 40%, transparent 85%);
  }

  /* Top bar */
  .top {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; align-items: center; justify-content: space-between;
    gap: 18px;
    padding: 14px 22px;
    z-index: 30;
    background: linear-gradient(180deg, rgba(7,7,26,0.85) 0%, rgba(7,7,26,0.4) 70%, transparent 100%);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }
  .brand {
    display: flex; align-items: center; gap: 12px;
    flex: 0 0 auto;
  }
  .logo {
    width: 38px; height: 38px;
    display: grid; place-items: center;
    font-size: 22px;
    color: var(--pink);
    background: radial-gradient(circle, rgba(255,110,199,0.25), transparent 70%);
    filter: drop-shadow(0 0 6px rgba(255,110,199,0.45));
    animation: spin 8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .wordmark { display: flex; flex-direction: column; line-height: 1.1; }
  .wordmark .h1 {
    font-size: 18px; font-weight: 800; letter-spacing: 0.02em;
    background: linear-gradient(90deg, var(--pink), var(--cyan) 50%, var(--amber));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .wordmark .sub { font-size: 11px; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }

  .modes {
    display: flex; gap: 6px;
    background: var(--glass);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 4px;
  }
  .mode, .action {
    background: transparent; color: var(--ink);
    border: 1px solid transparent;
    border-radius: 999px;
    padding: 7px 12px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
    transition: background 0.2s, border 0.2s, color 0.2s, transform 0.15s;
    font-family: inherit;
  }
  .mode:hover, .action:hover { background: rgba(255,255,255,0.06); }
  .mode.active {
    background: linear-gradient(135deg, rgba(255,110,199,0.25), rgba(110,203,255,0.25));
    border-color: rgba(255,255,255,0.25);
    color: #fff;
    box-shadow: 0 4px 18px rgba(255,110,199,0.22);
  }
  kbd {
    display: inline-grid; place-items: center;
    min-width: 18px; height: 18px; padding: 0 4px;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 10px;
    background: rgba(0,0,0,0.5);
    border: 1px solid var(--line);
    border-radius: 4px;
    color: var(--muted);
  }
  .mode.active kbd { color: #fff; border-color: rgba(255,255,255,0.35); }

  .actions { display: flex; gap: 6px; align-items: center; }
  .action {
    background: var(--glass);
    border: 1px solid var(--line);
  }

  /* Mode ghost text (center burst) */
  .mode-ghost {
    position: fixed; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    font-size: clamp(54px, 14vw, 180px);
    font-weight: 900; letter-spacing: 0.1em;
    text-transform: uppercase;
    color: transparent;
    -webkit-text-stroke: 1.5px rgba(255,255,255,0.45);
    pointer-events: none;
    z-index: 40;
    opacity: 0;
    font-family: 'Inter', sans-serif;
  }
  .mode-ghost.flash { animation: modeFlash 1.1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
  @keyframes modeFlash {
    0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.6); letter-spacing: 0.1em; }
    18%  { opacity: 0.9; transform: translate(-50%, -50%) scale(1); letter-spacing: 0.2em; }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(1.15); letter-spacing: 0.45em; }
  }

  /* World — holds the floating cards */
  #world {
    position: fixed; inset: 0;
    z-index: 10;
  }

  /* Card */
  .card {
    position: absolute;
    width: 168px; height: 168px;
    border-radius: 22px;
    background: linear-gradient(135deg, rgba(30,30,60,0.88), rgba(10,10,25,0.9));
    border: 1px solid var(--line);
    box-shadow:
      0 12px 34px rgba(0,0,0,0.55),
      inset 0 1px 0 rgba(255,255,255,0.05);
    padding: 14px;
    display: flex; flex-direction: column; justify-content: space-between;
    cursor: grab;
    will-change: transform;
    transition: box-shadow 0.25s, border-color 0.25s;
    color: var(--ink);
    overflow: hidden;
    backface-visibility: hidden;
  }
  .card::before {
    content: "";
    position: absolute; inset: 0;
    border-radius: inherit;
    background: radial-gradient(120% 100% at 20% 10%, var(--accent, #6ecbff) 0%, transparent 55%);
    opacity: 0.22;
    pointer-events: none;
  }
  .card::after {
    content: "";
    position: absolute; inset: -1px;
    border-radius: inherit;
    border: 1px solid var(--accent, #6ecbff);
    opacity: 0.35;
    pointer-events: none;
    filter: drop-shadow(0 0 12px var(--accent, #6ecbff));
  }
  .card:hover {
    border-color: rgba(255,255,255,0.18);
    box-shadow:
      0 18px 50px rgba(0,0,0,0.7),
      0 0 0 1px var(--accent, #6ecbff),
      0 0 28px color-mix(in srgb, var(--accent, #6ecbff) 40%, transparent),
      inset 0 1px 0 rgba(255,255,255,0.08);
  }
  .card.dragging {
    cursor: grabbing;
    z-index: 25;
    box-shadow:
      0 30px 70px rgba(0,0,0,0.8),
      0 0 0 2px var(--accent, #6ecbff),
      0 0 40px color-mix(in srgb, var(--accent, #6ecbff) 60%, transparent);
  }
  .card.launching {
    animation: launch 420ms cubic-bezier(0.6, -0.2, 0.8, 0.4) forwards;
  }
  @keyframes launch {
    0%   { transform: var(--t) scale(1); filter: brightness(1); }
    40%  { transform: var(--t) scale(1.08); filter: brightness(1.6); }
    100% { transform: var(--t) scale(0.2); filter: brightness(3) blur(8px); opacity: 0; }
  }
  .card-head {
    display: flex; align-items: center; justify-content: space-between;
    position: relative; z-index: 2;
  }
  .card-icon {
    font-size: 22px;
    width: 34px; height: 34px;
    display: grid; place-items: center;
    background: rgba(0,0,0,0.45);
    border: 1px solid var(--line);
    border-radius: 10px;
    filter: drop-shadow(0 0 6px var(--accent, #6ecbff));
  }
  .card-genre {
    font-size: 9px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent, #6ecbff);
    font-weight: 700;
    padding: 4px 7px;
    background: rgba(0,0,0,0.45);
    border: 1px solid color-mix(in srgb, var(--accent, #6ecbff) 30%, transparent);
    border-radius: 999px;
    max-width: 80px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .card-title {
    position: relative; z-index: 2;
    font-size: 17px;
    font-weight: 800;
    letter-spacing: -0.01em;
    line-height: 1.1;
    margin: 8px 0 4px;
  }
  .card-sub {
    position: relative; z-index: 2;
    font-size: 10.5px;
    color: var(--muted);
    line-height: 1.35;
    display: -webkit-box;
    -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card-tags {
    position: relative; z-index: 2;
    display: flex; flex-wrap: wrap; gap: 4px;
    margin-top: 8px;
  }
  .card-tag {
    font-size: 9px;
    letter-spacing: 0.06em;
    padding: 2px 6px;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--line);
    border-radius: 4px;
    color: var(--muted);
  }

  /* Hint bar */
  .hints {
    position: fixed; bottom: 14px; left: 50%;
    transform: translateX(-50%);
    z-index: 30;
    padding: 8px 14px;
    background: var(--glass);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1px solid var(--line);
    border-radius: 999px;
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
    letter-spacing: 0.04em;
    transition: opacity 0.6s, transform 0.6s;
    pointer-events: none;
  }
  .hints.dim { opacity: 0.35; }
  .hints b { color: var(--ink); font-weight: 700; }
  .hints kbd { vertical-align: middle; margin: 0 1px; }

  /* Credit footer */
  .credit {
    position: fixed; bottom: 14px; right: 18px;
    z-index: 30;
    font-size: 11px;
    color: var(--muted);
    display: flex; gap: 8px; align-items: center;
    letter-spacing: 0.04em;
  }
  .credit a {
    color: var(--cyan);
    text-decoration: none;
    transition: color 0.2s;
  }
  .credit a:hover { color: var(--pink); }

  .back {
    position: fixed; top: 50%; left: 14px;
    transform: translateY(-50%);
    z-index: 30;
  }

  /* Tutorial arrows */
  .tutor {
    position: fixed;
    pointer-events: none;
    z-index: 29;
    color: var(--amber);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.06em;
    opacity: 0;
    transition: opacity 0.8s;
    filter: drop-shadow(0 0 6px rgba(255,211,110,0.6));
    text-shadow: 0 0 8px rgba(0,0,0,0.9);
  }
  .tutor.show { opacity: 0.95; animation: tutorBob 2s ease-in-out infinite; }
  @keyframes tutorBob {
    0%, 100% { transform: translate(var(--tx, 0), var(--ty, 0)); }
    50%      { transform: translate(calc(var(--tx, 0) + 6px), var(--ty, 0)); }
  }

  /* Responsive */
  @media (max-width: 780px) {
    .top { flex-wrap: wrap; padding: 10px 12px; gap: 8px; }
    .wordmark .sub { display: none; }
    .modes { order: 3; width: 100%; justify-content: center; }
    .actions { order: 2; }
    .card { width: 140px; height: 140px; padding: 11px; border-radius: 18px; }
    .card-title { font-size: 14px; }
    .card-sub { font-size: 9.5px; }
    .hints { font-size: 10px; padding: 6px 10px; white-space: normal; max-width: 90vw; text-align: center; }
  }
  @media (max-width: 440px) {
    .mode, .action { padding: 6px 8px; font-size: 10px; }
    kbd { display: none; }
  }

  /* Accessibility */
  @media (prefers-reduced-motion: reduce) {
    .logo { animation: none; }
    .card { transition: none; }
    .card.launching { animation: none; opacity: 0; }
  }

  /* Thrown streak effect */
  .card .streak {
    position: absolute;
    left: 50%; top: 50%;
    width: 120%; height: 3px;
    background: linear-gradient(90deg, transparent, var(--accent, #6ecbff), transparent);
    transform: translate(-50%, -50%);
    opacity: 0;
    pointer-events: none;
    border-radius: 2px;
  }
  .card.flying .streak { opacity: 0.7; }
</style>
</head>
<body>

<canvas id="bg"></canvas>

<header class="top">
  <div class="brand">
    <div class="logo" aria-hidden="true">◆</div>
    <div class="wordmark">
      <span class="h1">the arcade</span>
      <span class="sub"><span id="game-count">0</span> games floating in a sandbox</span>
    </div>
  </div>

  <nav class="modes" aria-label="sandbox modes">
    <button class="mode active" data-mode="drift" aria-pressed="true" title="Gentle drift">
      <kbd>1</kbd> drift
    </button>
    <button class="mode" data-mode="void" aria-pressed="false" title="Zero gravity — momentum forever">
      <kbd>2</kbd> void
    </button>
    <button class="mode" data-mode="pull" aria-pressed="false" title="Attract toward cursor">
      <kbd>3</kbd> pull
    </button>
    <button class="mode" data-mode="orbit" aria-pressed="false" title="Orbit around center">
      <kbd>4</kbd> orbit
    </button>
    <button class="mode" data-mode="rain" aria-pressed="false" title="Heavy gravity — a pile-up">
      <kbd>5</kbd> rain
    </button>
  </nav>

  <div class="actions">
    <button class="action" id="shake" title="Shake things up (Space)"><kbd>␣</kbd> shake</button>
    <button class="action" id="reset" title="Reset positions (R)"><kbd>R</kbd> reset</button>
    <button class="action" id="mute" title="Mute sound (M)"><kbd>M</kbd> <span id="mute-icon">♪</span></button>
  </div>
</header>

<main id="world" role="main" aria-label="interactive game sandbox"></main>

<div class="mode-ghost" id="modeGhost" aria-hidden="true"></div>

<aside class="hints" id="hints">
  <b>drag</b> cards to throw · <b>click</b> to play · <b>click empty space</b> to spawn orbs · <kbd>1</kbd>–<kbd>5</kbd> physics
</aside>

<a class="action back" href="/games/" title="Back to games">← back</a>

<div class="credit">
  <span>williamcfrancis</span>
  <span>·</span>
  <a href="/">home</a>
</div>

<!-- Floating tutorial hints -->
<div class="tutor" id="tut1" style="--tx:0;--ty:0;">← drag me</div>
<div class="tutor" id="tut2" style="--tx:0;--ty:0;">tap empty space ↓</div>

<script>
(() => {
  'use strict';

  // ---- Game catalog ------------------------------------------------------
  const GAMES = [
    { title: "Lily Leap",           genre: "Chill arcade",          icon: "🐸", summary: "Drift across cozy lily pads, snack on sparkles, vibe with squishmallows.",    tags: ["casual","sound-on"],     url: "/games/lily_leap/",           accent: "var(--green)"  },
    { title: "Glow Hop",            genre: "Audio-physics",         icon: "🎵", summary: "The world is silent. Use sound to make matter and reach the portal.",         tags: ["platformer","sound-on"], url: "/games/glow_hop/",            accent: "var(--amber)"  },
    { title: "Lexical Hazard",      genre: "Word survival",         icon: "⚠️", summary: "Type falling words to neutralize them. Each word triggers its meaning.",      tags: ["typing","sound-on"],     url: "/games/lexical_hazard/",      accent: "var(--teal)"   },
    { title: "Lyrically Lost",      genre: "Lyric trivia",          icon: "🎧", summary: "Hear translated lyric snippets. Race to identify the original songs.",         tags: ["music","sound-on"],      url: "/games/lyrically_lost/",      accent: "var(--pink)"   },
    { title: "Abyss",               genre: "Deep-dive survival",    icon: "🌊", summary: "Dive deep. Manage oxygen, dash to destroy mines, descend to the rift.",        tags: ["3D","sound-on"],         url: "/games/abyss/",               accent: "var(--sky)"    },
    { title: "Algorithm Simulator", genre: "Dark simulation",       icon: "📱", summary: "Maximize engagement and ad revenue by manipulating a digital experience.",    tags: ["simulation","dark"],     url: "/games/algorithm_simulator/", accent: "var(--rose)"   },
    { title: "Botanical Brawl",     genre: "3D arena shooter",      icon: "🌿", summary: "A cozy but competitive botanical duel with forgeable weapon stats.",          tags: ["3D","arena"],            url: "/games/botanical_brawl/",     accent: "var(--green)"  },
    { title: "Wizard Brawl",        genre: "LLM couch fighter",     icon: "🧙", summary: "Two wizards, one couch, and any object you can dream up as a weapon.",        tags: ["AI","local-multi"],      url: "/games/wizard_brawl/",        accent: "var(--violet)" },
    { title: "Void Strike",         genre: "3D FPS arena",          icon: "🎯", summary: "A neon-drenched wave-survival FPS with dash, slide, and streak rewards.",     tags: ["3D","FPS","sound-on"],   url: "/games/void_strike/",         accent: "var(--rose)"   },
    { title: "Lexicon Atlas",       genre: "Educational interactive", icon: "🌍", summary: "Spin a 3D globe and discover English words unique to their homeland.",       tags: ["3D","educational"],      url: "/games/lexicon_atlas/",       accent: "var(--sky)"    },
    { title: "Machine Gaze",        genre: "Interactive AI",        icon: "👁️", summary: "Upload a photo. Watch a robot decompose it into edges, depth, and segments.", tags: ["AI","educational"],      url: "/games/machine_gaze/",        accent: "var(--violet)" },
    { title: "How Many?",           genre: "Scale comparison",      icon: "📏", summary: "Pick any two objects — atoms to galaxies — and see how many fit inside.",     tags: ["educational"],           url: "/games/how_many/",            accent: "var(--amber)"  },
    { title: "Lost in Translation", genre: "Language experiment",   icon: "💬", summary: "Type a sentence, watch it travel through 20 languages and come back.",       tags: ["AI","language"],         url: "/games/lost_in_translation/", accent: "var(--teal)"   },
    { title: "Turing Shuffle",      genre: "AI vs Human quiz",      icon: "🤖", summary: "10 passages. Some by humans, some by AI. Can you tell the difference?",       tags: ["AI","quiz"],             url: "/games/turing_shuffle/",      accent: "var(--cyan)"   },
    { title: "Scale of Autonomy",   genre: "Interactive explainer", icon: "⚖️", summary: "Journey through the levels of autonomy — thermostat to self-driving car.",    tags: ["educational"],           url: "/games/scale_of_autonomy/",   accent: "var(--sky)"    },
    { title: "1 Trillion Params",   genre: "3D explainer",          icon: "🧠", summary: "A cosmic zoom into neural networks — scroll from a neuron to a trillion.",    tags: ["3D","educational"],      url: "/games/trillion_parameters/", accent: "var(--violet)" },
    { title: "Junkbot",             genre: "Physics sandbox",       icon: "🔧", summary: "Snap parts together, tweak motors, launch your creation across the course.",  tags: ["3D","sandbox"],          url: "/games/junkbot/",             accent: "var(--coral)"  },
    { title: "Neon Breach",         genre: "Cyberpunk FPS",         icon: "⚡", summary: "Wall-run, grapple, bullet-time. Boss waves and style kills.",                  tags: ["3D","FPS","sound-on"],   url: "/games/neon_breach/",         accent: "var(--pink)"   },
    { title: "Gravity Golf",        genre: "Physics puzzle",        icon: "⛳", summary: "Sling a ball through orbit-warping obstacles into distant cups.",             tags: ["puzzle","physics"],      url: "/games/gravity_golf/",        accent: "var(--teal)"   },
  ];

  // ---- Setup -------------------------------------------------------------
  const world = document.getElementById('world');
  const canvas = document.getElementById('bg');
  const ctx = canvas.getContext('2d');
  const modeGhost = document.getElementById('modeGhost');
  const hints = document.getElementById('hints');
  const gameCountEl = document.getElementById('game-count');
  const muteIcon = document.getElementById('mute-icon');

  let W = 0, H = 0, DPR = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    // Keep cards inside on resize
    cards.forEach(c => {
      c.x = Math.max(c.r, Math.min(W - c.r, c.x));
      c.y = Math.max(topPad() + c.r, Math.min(H - c.r - bottomPad(), c.y));
    });
  }

  function topPad()    { return 80; }   // top bar height
  function bottomPad() { return 60; }   // hint bar + credit

  // ---- Audio -------------------------------------------------------------
  let audioCtx = null, muted = false;
  function initAudio() {
    if (audioCtx) return;
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    } catch { audioCtx = null; }
  }
  function blip(freq, duration = 0.08, volume = 0.08, type = 'sine') {
    if (muted || !audioCtx) return;
    const t0 = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    osc.frequency.exponentialRampToValueAtTime(freq * 0.7, t0 + duration);
    gain.gain.setValueAtTime(volume, t0);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t0);
    osc.stop(t0 + duration + 0.02);
  }

  // ---- State -------------------------------------------------------------
  const cards = [];
  const particles = []; // ambient & collision
  const orbs = [];      // user-spawned
  const trail = [];     // cursor trail
  const stars = [];     // background starfield

  let mode = 'drift';
  let pointer = { x: W/2, y: H/2, down: false, card: null, startX: 0, startY: 0, moved: false, time: 0 };
  let tilt = { x: 0, y: 0 }; // device tilt

  // ---- Cards -------------------------------------------------------------
  function layoutInitial() {
    const cols = Math.max(3, Math.min(7, Math.floor(W / 220)));
    const rows = Math.ceil(GAMES.length / cols);
    const cellW = W / cols;
    const cellH = (H - topPad() - bottomPad()) / rows;
    GAMES.forEach((g, i) => {
      const col = i % cols;
      const row = Math.floor(i / cols);
      const cx = cellW * (col + 0.5);
      const cy = topPad() + cellH * (row + 0.5);
      const card = cards[i];
      card.x = cx + (Math.random() - 0.5) * cellW * 0.25;
      card.y = cy + (Math.random() - 0.5) * cellH * 0.25;
      card.vx = (Math.random() - 0.5) * 30;
      card.vy = (Math.random() - 0.5) * 30;
      card.rot = (Math.random() - 0.5) * 8;
      card.rotVel = (Math.random() - 0.5) * 20;
    });
  }

  function buildCards() {
    GAMES.forEach((g, i) => {
      const el = document.createElement('a');
      el.className = 'card';
      el.href = g.url;
      el.target = '_blank';
      el.rel = 'noopener';
      el.setAttribute('draggable', 'false');
      el.style.setProperty('--accent', g.accent);
      el.innerHTML = `
        <div class="card-head">
          <div class="card-icon" aria-hidden="true">${g.icon}</div>
          <div class="card-genre">${g.genre}</div>
        </div>
        <div>
          <div class="card-title">${g.title}</div>
          <div class="card-sub">${g.summary}</div>
          <div class="card-tags">${g.tags.map(t => `<span class="card-tag">${t}</span>`).join('')}</div>
        </div>
        <div class="streak"></div>
      `;
      world.appendChild(el);
      const r = 88; // collision radius (visual 168/2 is 84, give a bit of space)
      cards.push({
        el, game: g,
        x: W/2, y: H/2,
        vx: 0, vy: 0,
        rot: 0, rotVel: 0,
        r, mass: 1,
        accent: g.accent,
        dragging: false,
        grabDX: 0, grabDY: 0,
        lastPos: []
      });
      // Handlers
      el.addEventListener('pointerdown', onCardDown);
      el.addEventListener('click', e => {
        // Prevent anchor default if this was a drag
        if (cards[i].justDragged) {
          e.preventDefault();
          cards[i].justDragged = false;
          return;
        }
        // Launch animation
        e.preventDefault();
        launchCard(cards[i]);
      });
    });
    gameCountEl.textContent = GAMES.length;
  }

  function launchCard(card) {
    const x = card.x - card.r;
    const y = card.y - card.r;
    card.el.style.setProperty('--t', `translate(${x}px, ${y}px) rotate(${card.rot}deg)`);
    card.el.classList.add('launching');
    blip(880, 0.12, 0.1, 'triangle');
    setTimeout(() => blip(1320, 0.18, 0.08, 'sine'), 80);
    // Flash burst at card center
    burst(card.x, card.y, 36, card.game.accent);
    setTimeout(() => {
      window.open(card.game.url, '_blank', 'noopener');
      // Restore card for when user returns
      card.el.classList.remove('launching');
    }, 400);
  }

  // ---- Pointer input -----------------------------------------------------
  function onCardDown(e) {
    e.preventDefault();
    initAudio();
    const el = e.currentTarget;
    const card = cards.find(c => c.el === el);
    if (!card) return;
    pointer.card = card;
    pointer.down = true;
    pointer.moved = false;
    pointer.startX = e.clientX;
    pointer.startY = e.clientY;
    pointer.time = performance.now();
    card.grabDX = e.clientX - card.x;
    card.grabDY = e.clientY - card.y;
    card.vx = 0; card.vy = 0;
    card.rotVel = 0;
    card.lastPos = [{ x: e.clientX, y: e.clientY, t: pointer.time }];
    card.dragging = true;
    card.el.classList.add('dragging');
    el.setPointerCapture?.(e.pointerId);
    hideTutors();
  }

  function onPointerDown(e) {
    initAudio();
    pointer.x = e.clientX; pointer.y = e.clientY;
    if (pointer.card) return; // handled by card
    pointer.down = true;
    pointer.startX = e.clientX;
    pointer.startY = e.clientY;
    pointer.time = performance.now();
    pointer.moved = false;
    hideTutors();
  }

  function onPointerMove(e) {
    pointer.x = e.clientX;
    pointer.y = e.clientY;
    const dx = e.clientX - pointer.startX;
    const dy = e.clientY - pointer.startY;
    if (Math.abs(dx) > 5 || Math.abs(dy) > 5) pointer.moved = true;

    // Cursor trail
    if (Math.random() < 0.7) {
      trail.push({
        x: e.clientX, y: e.clientY,
        vx: (Math.random() - 0.5) * 0.3,
        vy: (Math.random() - 0.5) * 0.3,
        life: 1, maxLife: 40 + Math.random() * 20,
        size: 1.2 + Math.random() * 1.4,
        hue: 200 + Math.random() * 160
      });
    }

    if (pointer.card && pointer.card.dragging) {
      const c = pointer.card;
      c.x = e.clientX - c.grabDX;
      c.y = e.clientY - c.grabDY;
      const now = performance.now();
      c.lastPos.push({ x: e.clientX, y: e.clientY, t: now });
      // keep last ~120ms
      while (c.lastPos.length > 2 && now - c.lastPos[0].t > 120) c.lastPos.shift();
    }
  }

  function onPointerUp(e) {
    if (pointer.card && pointer.card.dragging) {
      const c = pointer.card;
      // Compute throw velocity from last positions
      if (c.lastPos.length >= 2) {
        const a = c.lastPos[0];
        const b = c.lastPos[c.lastPos.length - 1];
        const dt = Math.max(16, b.t - a.t);
        c.vx = (b.x - a.x) / dt * 1000; // px/sec
        c.vy = (b.y - a.y) / dt * 1000;
        // Clamp insane velocities
        const sp = Math.hypot(c.vx, c.vy);
        const max = 2400;
        if (sp > max) { c.vx *= max/sp; c.vy *= max/sp; }
        c.rotVel = (c.vx + c.vy) * 0.05;
      }
      c.dragging = false;
      c.el.classList.remove('dragging');
      if (pointer.moved) c.justDragged = true;
      pointer.card = null;
    } else if (pointer.down && !pointer.moved) {
      // Click on background — spawn orb
      spawnOrb(e.clientX, e.clientY);
    }
    pointer.down = false;
  }

  // ---- Orbs --------------------------------------------------------------
  function spawnOrb(x, y) {
    if (y < topPad() - 10 || y > H - bottomPad() + 10) return; // ignore clicks on UI
    const hues = [200, 280, 320, 40, 150];
    const hue = hues[Math.floor(Math.random() * hues.length)];
    const n = 6 + Math.floor(Math.random() * 4);
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 40 + Math.random() * 180;
      orbs.push({
        x, y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp,
        r: 2.5 + Math.random() * 3.5,
        life: 1, maxLife: 240 + Math.random() * 180,
        hue: hue + (Math.random() - 0.5) * 40
      });
    }
    // Soft ding
    blip(440 + Math.random() * 220, 0.08, 0.04, 'sine');
    // Cap orbs
    if (orbs.length > 600) orbs.splice(0, orbs.length - 600);
  }

  // ---- Particles (collision bursts) --------------------------------------
  function burst(x, y, count, accentVar) {
    const hue = accentToHue(accentVar);
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 60 + Math.random() * 320;
      particles.push({
        x, y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp,
        r: 1 + Math.random() * 2.4,
        life: 1, maxLife: 30 + Math.random() * 30,
        hue: hue + (Math.random() - 0.5) * 40
      });
    }
    if (particles.length > 800) particles.splice(0, particles.length - 800);
  }

  function accentToHue(v) {
    // Rough mapping from our CSS var to hue
    const map = {
      'var(--pink)': 330, 'var(--cyan)': 195, 'var(--amber)': 45,
      'var(--green)': 150, 'var(--violet)': 280, 'var(--coral)': 20,
      'var(--sky)': 225, 'var(--teal)': 170, 'var(--rose)': 345
    };
    return map[v] ?? 220;
  }

  // ---- Starfield ---------------------------------------------------------
  function makeStars() {
    stars.length = 0;
    const n = Math.floor(W * H / 9000);
    for (let i = 0; i < n; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: Math.random() * 1.2 + 0.2,
        tw: Math.random() * Math.PI * 2,
        spd: 0.6 + Math.random() * 1.4,
        hue: 200 + Math.random() * 140
      });
    }
  }

  // ---- Physics -----------------------------------------------------------
  function applyForces(dt) {
    for (const c of cards) {
      if (c.dragging) continue;
      if (mode === 'drift') {
        // gentle drift, slight center pull
        const cx = W/2, cy = (topPad() + H - bottomPad())/2;
        c.vx += (cx - c.x) * 0.00008 * dt;
        c.vy += (cy - c.y) * 0.00008 * dt;
        c.vx *= Math.pow(0.995, dt / 16);
        c.vy *= Math.pow(0.995, dt / 16);
      } else if (mode === 'void') {
        // near-zero damping
        c.vx *= Math.pow(0.9995, dt / 16);
        c.vy *= Math.pow(0.9995, dt / 16);
      } else if (mode === 'pull') {
        const dx = pointer.x - c.x;
        const dy = pointer.y - c.y;
        const d2 = dx*dx + dy*dy;
        const d = Math.sqrt(d2) + 10;
        const f = Math.min(0.06, 900 / d2) * dt * (pointer.down ? 2 : 1);
        c.vx += (dx/d) * f;
        c.vy += (dy/d) * f;
        c.vx *= Math.pow(0.985, dt / 16);
        c.vy *= Math.pow(0.985, dt / 16);
      } else if (mode === 'orbit') {
        const cx = W/2, cy = (topPad() + H - bottomPad())/2;
        const dx = cx - c.x, dy = cy - c.y;
        const d = Math.hypot(dx, dy) + 10;
        // central attract
        c.vx += (dx/d) * 0.025 * dt;
        c.vy += (dy/d) * 0.025 * dt;
        // tangential push
        c.vx += (-dy/d) * 0.025 * dt;
        c.vy += ( dx/d) * 0.025 * dt;
        c.vx *= Math.pow(0.994, dt / 16);
        c.vy *= Math.pow(0.994, dt / 16);
      } else if (mode === 'rain') {
        c.vy += 0.9 * dt;       // strong gravity
        c.vx *= Math.pow(0.995, dt / 16);
        // extra wobble from tilt / air resistance
        c.vx += (Math.random() - 0.5) * 0.3;
      }

      // Device tilt contribution (mobile)
      c.vx += tilt.x * 0.04 * dt;
      c.vy += tilt.y * 0.04 * dt;
    }
  }

  function integrate(dt) {
    const k = dt / 1000;
    for (const c of cards) {
      if (c.dragging) continue;
      c.x += c.vx * k;
      c.y += c.vy * k;
      c.rot += c.rotVel * k;
      c.rotVel *= Math.pow(0.99, dt / 16);
    }
  }

  function resolveWalls() {
    const minY = topPad() + 10;
    const maxY = H - bottomPad() - 10;
    for (const c of cards) {
      if (c.dragging) continue;
      if (c.x - c.r < 0)        { c.x = c.r;        c.vx = Math.abs(c.vx) * 0.72; c.rotVel += c.vy * 0.02; wallBlip(c); }
      if (c.x + c.r > W)        { c.x = W - c.r;    c.vx = -Math.abs(c.vx) * 0.72; c.rotVel -= c.vy * 0.02; wallBlip(c); }
      if (c.y - c.r < minY)     { c.y = minY + c.r; c.vy = Math.abs(c.vy) * 0.72; c.rotVel -= c.vx * 0.02; wallBlip(c); }
      if (c.y + c.r > maxY)     {
        c.y = maxY - c.r;
        c.vy = -Math.abs(c.vy) * 0.72;
        c.rotVel += c.vx * 0.02;
        // small friction when grounded
        if (Math.abs(c.vy) < 60) c.vx *= 0.92;
        wallBlip(c);
      }
    }
  }

  let lastWallBlip = 0;
  function wallBlip(c) {
    const sp = Math.hypot(c.vx, c.vy);
    if (sp < 140) return;
    const now = performance.now();
    if (now - lastWallBlip < 60) return;
    lastWallBlip = now;
    blip(180 + Math.random() * 120, 0.05, 0.03, 'triangle');
    burst(c.x, c.y, 6, c.game.accent);
  }

  function resolveCardCollisions() {
    for (let i = 0; i < cards.length; i++) {
      const a = cards[i];
      for (let j = i + 1; j < cards.length; j++) {
        const b = cards[j];
        const dx = b.x - a.x;
        const dy = b.y - a.y;
        const d2 = dx*dx + dy*dy;
        const minD = a.r + b.r;
        if (d2 < minD * minD && d2 > 0.0001) {
          const d = Math.sqrt(d2);
          const nx = dx / d, ny = dy / d;
          const overlap = minD - d;
          // positional correction
          if (!a.dragging) a.x -= nx * overlap * 0.5;
          if (!a.dragging) a.y -= ny * overlap * 0.5;
          if (!b.dragging) b.x += nx * overlap * 0.5;
          if (!b.dragging) b.y += ny * overlap * 0.5;
          // relative velocity along normal
          const rvx = b.vx - a.vx;
          const rvy = b.vy - a.vy;
          const vn = rvx * nx + rvy * ny;
          if (vn < 0) {
            const restitution = 0.72;
            const jImp = -(1 + restitution) * vn / 2;
            const ix = jImp * nx, iy = jImp * ny;
            if (!a.dragging) { a.vx -= ix; a.vy -= iy; }
            if (!b.dragging) { b.vx += ix; b.vy += iy; }
            // rotation
            a.rotVel -= (rvx * ny - rvy * nx) * 0.05;
            b.rotVel += (rvx * ny - rvy * nx) * 0.05;

            const impactSpeed = Math.hypot(rvx, rvy);
            if (impactSpeed > 120) {
              // burst at contact point
              const cx = (a.x + b.x) / 2;
              const cy = (a.y + b.y) / 2;
              burst(cx, cy, Math.min(18, Math.floor(impactSpeed / 40)), a.game.accent);
              burst(cx, cy, Math.min(18, Math.floor(impactSpeed / 40)), b.game.accent);
              const p = 220 + Math.min(1, impactSpeed / 800) * 500;
              blip(p, 0.06, 0.05, 'triangle');
            }
          }
        }
      }
    }
  }

  // ---- Orbs physics ------------------------------------------------------
  function updateOrbs(dt) {
    const k = dt / 1000;
    for (let i = orbs.length - 1; i >= 0; i--) {
      const o = orbs[i];
      if (mode === 'rain') o.vy += 0.9 * dt;
      else if (mode === 'pull') {
        const dx = pointer.x - o.x, dy = pointer.y - o.y;
        const d = Math.hypot(dx, dy) + 10;
        const f = Math.min(0.15, 1500 / (d*d)) * dt;
        o.vx += (dx/d) * f;
        o.vy += (dy/d) * f;
      } else if (mode === 'orbit') {
        const cx = W/2, cy = (topPad() + H - bottomPad())/2;
        const dx = cx - o.x, dy = cy - o.y;
        const d = Math.hypot(dx, dy) + 10;
        o.vx += (dx/d) * 0.04 * dt + (-dy/d) * 0.04 * dt;
        o.vy += (dy/d) * 0.04 * dt + ( dx/d) * 0.04 * dt;
      } else if (mode === 'drift') {
        o.vx *= Math.pow(0.992, dt / 16);
        o.vy *= Math.pow(0.992, dt / 16);
      }
      // void: no damping

      o.x += o.vx * k;
      o.y += o.vy * k;

      // Walls
      const minY = topPad() + 4, maxY = H - bottomPad() - 4;
      if (o.x < o.r)   { o.x = o.r;   o.vx = Math.abs(o.vx) * 0.75; }
      if (o.x > W-o.r) { o.x = W-o.r; o.vx = -Math.abs(o.vx) * 0.75; }
      if (o.y < minY)  { o.y = minY;  o.vy = Math.abs(o.vy) * 0.75; }
      if (o.y > maxY)  { o.y = maxY;  o.vy = -Math.abs(o.vy) * 0.75; }

      // Orb vs card — orbs mostly bounce off, cards barely affected
      for (const c of cards) {
        const dx = o.x - c.x, dy = o.y - c.y;
        const d2 = dx*dx + dy*dy;
        const minD = c.r + o.r;
        if (d2 < minD*minD && d2 > 0.001) {
          const d = Math.sqrt(d2);
          const nx = dx/d, ny = dy/d;
          const overlap = minD - d;
          o.x += nx * overlap;
          o.y += ny * overlap;
          const vn = o.vx * nx + o.vy * ny;
          if (vn < 0) {
            o.vx -= 2 * vn * nx;
            o.vy -= 2 * vn * ny;
            o.vx *= 0.85; o.vy *= 0.85;
            // tiny push on card
            if (!c.dragging) {
              c.vx -= nx * 8;
              c.vy -= ny * 8;
            }
          }
        }
      }

      // Life
      o.life -= dt / 16;
      if (o.life <= 0) orbs.splice(i, 1);
    }
  }

  // ---- Update particles/trail/stars --------------------------------------
  function updateParticles(dt) {
    const k = dt / 1000;
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx * k;
      p.y += p.vy * k;
      p.vx *= Math.pow(0.94, dt / 16);
      p.vy *= Math.pow(0.94, dt / 16);
      p.vy += 0.6 * dt / 16;
      p.life -= dt / 16;
      if (p.life <= 0) particles.splice(i, 1);
    }
    for (let i = trail.length - 1; i >= 0; i--) {
      const t = trail[i];
      t.x += t.vx; t.y += t.vy;
      t.life -= 1;
      if (t.life <= 0) trail.splice(i, 1);
    }
    for (const s of stars) {
      s.tw += 0.02 + s.spd * 0.004;
    }
  }

  // ---- Render ------------------------------------------------------------
  function render() {
    ctx.clearRect(0, 0, W, H);

    // Stars
    ctx.globalCompositeOperation = 'lighter';
    for (const s of stars) {
      const a = (Math.sin(s.tw) * 0.5 + 0.5) * 0.35 + 0.05;
      ctx.fillStyle = `hsla(${s.hue}, 80%, 80%, ${a})`;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }

    // Trail
    for (const t of trail) {
      const a = t.life / t.maxLife;
      ctx.fillStyle = `hsla(${t.hue}, 90%, 70%, ${a * 0.55})`;
      ctx.beginPath();
      ctx.arc(t.x, t.y, t.size * (0.5 + a * 0.6), 0, Math.PI * 2);
      ctx.fill();
    }

    // Orbs
    for (const o of orbs) {
      const a = Math.min(1, o.life / 60);
      const grd = ctx.createRadialGradient(o.x, o.y, 0, o.x, o.y, o.r * 5);
      grd.addColorStop(0, `hsla(${o.hue}, 95%, 75%, ${0.9 * a})`);
      grd.addColorStop(0.3, `hsla(${o.hue}, 95%, 60%, ${0.45 * a})`);
      grd.addColorStop(1, `hsla(${o.hue}, 95%, 40%, 0)`);
      ctx.fillStyle = grd;
      ctx.beginPath();
      ctx.arc(o.x, o.y, o.r * 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = `hsla(${o.hue}, 100%, 90%, ${a})`;
      ctx.beginPath();
      ctx.arc(o.x, o.y, o.r, 0, Math.PI * 2);
      ctx.fill();
    }

    // Connection lines between nearby cards
    ctx.lineWidth = 1;
    for (let i = 0; i < cards.length; i++) {
      for (let j = i + 1; j < cards.length; j++) {
        const a = cards[i], b = cards[j];
        const dx = a.x - b.x, dy = a.y - b.y;
        const d2 = dx*dx + dy*dy;
        const maxD = 220;
        if (d2 < maxD * maxD) {
          const d = Math.sqrt(d2);
          const alpha = (1 - d / maxD) * 0.18;
          ctx.strokeStyle = `rgba(170,190,255,${alpha})`;
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.stroke();
        }
      }
    }

    // Collision particles
    for (const p of particles) {
      const a = p.life / p.maxLife;
      ctx.fillStyle = `hsla(${p.hue}, 100%, 72%, ${a})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * (0.5 + a * 0.8), 0, Math.PI * 2);
      ctx.fill();
    }

    // Pointer halo in pull mode
    if (mode === 'pull') {
      const grd = ctx.createRadialGradient(pointer.x, pointer.y, 2, pointer.x, pointer.y, 140);
      grd.addColorStop(0, 'rgba(255,110,199,0.25)');
      grd.addColorStop(1, 'rgba(255,110,199,0)');
      ctx.fillStyle = grd;
      ctx.beginPath();
      ctx.arc(pointer.x, pointer.y, 140, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,110,199,0.35)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(pointer.x, pointer.y, 40 + Math.sin(performance.now() / 200) * 6, 0, Math.PI * 2);
      ctx.stroke();
    }

    ctx.globalCompositeOperation = 'source-over';

    // Sync card DOM transforms
    for (const c of cards) {
      const tx = c.x - c.r;
      const ty = c.y - c.r;
      const scale = c.dragging ? 1.06 : 1;
      c.el.style.transform = `translate3d(${tx}px, ${ty}px, 0) rotate(${c.rot}deg) scale(${scale})`;
    }
  }

  // ---- Mode handling -----------------------------------------------------
  function setMode(m) {
    if (m === mode) return;
    mode = m;
    document.querySelectorAll('.mode').forEach(btn => {
      const active = btn.dataset.mode === m;
      btn.classList.toggle('active', active);
      btn.setAttribute('aria-pressed', active ? 'true' : 'false');
    });
    modeGhost.textContent = m;
    modeGhost.classList.remove('flash');
    void modeGhost.offsetWidth;
    modeGhost.classList.add('flash');
    blip(540, 0.12, 0.05, 'sine');
    setTimeout(() => blip(720, 0.12, 0.04, 'sine'), 80);
  }

  function shake() {
    for (const c of cards) {
      if (c.dragging) continue;
      const a = Math.random() * Math.PI * 2;
      const sp = 600 + Math.random() * 900;
      c.vx += Math.cos(a) * sp;
      c.vy += Math.sin(a) * sp;
      c.rotVel += (Math.random() - 0.5) * 300;
    }
    for (let i = 0; i < 60; i++) {
      burst(Math.random() * W, topPad() + Math.random() * (H - topPad() - bottomPad()), 4, 'var(--pink)');
    }
    blip(130, 0.2, 0.09, 'sawtooth');
    setTimeout(() => blip(90, 0.3, 0.08, 'sawtooth'), 60);
  }

  function resetPositions() {
    layoutInitial();
    blip(660, 0.1, 0.05, 'sine');
    setTimeout(() => blip(880, 0.08, 0.05, 'sine'), 60);
  }

  // ---- Tutorial hints ----------------------------------------------------
  let tutorsShown = false;
  function showTutors() {
    if (tutorsShown) return;
    const first = cards[0];
    if (!first) return;
    const t1 = document.getElementById('tut1');
    const t2 = document.getElementById('tut2');
    t1.style.left = (first.x + first.r + 16) + 'px';
    t1.style.top = (first.y - 8) + 'px';
    t1.classList.add('show');
    t2.style.left = '50%';
    t2.style.top = (H - bottomPad() - 80) + 'px';
    t2.style.transform = 'translateX(-50%)';
    t2.classList.add('show');
    tutorsShown = true;
    setTimeout(hideTutors, 8500);
  }
  function hideTutors() {
    document.getElementById('tut1').classList.remove('show');
    document.getElementById('tut2').classList.remove('show');
  }

  // ---- Keyboard ----------------------------------------------------------
  window.addEventListener('keydown', (e) => {
    if (e.target && e.target.tagName === 'INPUT') return;
    const k = e.key;
    if (k === '1') setMode('drift');
    else if (k === '2') setMode('void');
    else if (k === '3') setMode('pull');
    else if (k === '4') setMode('orbit');
    else if (k === '5') setMode('rain');
    else if (k === ' ') { e.preventDefault(); shake(); }
    else if (k === 'r' || k === 'R') resetPositions();
    else if (k === 'm' || k === 'M') {
      muted = !muted;
      muteIcon.textContent = muted ? '♩' : '♪';
    }
    else if (k === 'c' || k === 'C') orbs.length = 0;
  });

  // ---- Device motion (mobile tilt) ---------------------------------------
  window.addEventListener('deviceorientation', (e) => {
    // gamma: left-right; beta: forward-back
    if (e.gamma == null || e.beta == null) return;
    tilt.x = Math.max(-1, Math.min(1, e.gamma / 45));
    tilt.y = Math.max(-1, Math.min(1, (e.beta - 30) / 45));
  });

  // ---- Hint dim on first interaction -------------------------------------
  let hintDimmed = false;
  function dimHint() {
    if (hintDimmed) return;
    hintDimmed = true;
    setTimeout(() => hints.classList.add('dim'), 5000);
  }

  // ---- Main loop ---------------------------------------------------------
  let last = performance.now();
  function loop(now) {
    let dt = now - last;
    last = now;
    if (dt > 50) dt = 50; // cap on tab-switch
    applyForces(dt);
    integrate(dt);
    resolveCardCollisions();
    resolveWalls();
    updateOrbs(dt);
    updateParticles(dt);
    render();
    requestAnimationFrame(loop);
  }

  // ---- Init --------------------------------------------------------------
  buildCards();
  resize();
  makeStars();
  layoutInitial();
  render();

  // Listeners
  window.addEventListener('resize', () => { resize(); makeStars(); });
  window.addEventListener('pointerdown', onPointerDown);
  window.addEventListener('pointermove', onPointerMove);
  window.addEventListener('pointerup', onPointerUp);
  window.addEventListener('pointercancel', onPointerUp);
  window.addEventListener('pointerdown', dimHint, { once: true });

  // Mode buttons
  document.querySelectorAll('.mode').forEach(btn => {
    btn.addEventListener('click', (e) => { e.stopPropagation(); initAudio(); setMode(btn.dataset.mode); });
  });
  document.getElementById('shake').addEventListener('click', (e) => { e.stopPropagation(); initAudio(); shake(); });
  document.getElementById('reset').addEventListener('click', (e) => { e.stopPropagation(); resetPositions(); });
  document.getElementById('mute').addEventListener('click', (e) => {
    e.stopPropagation();
    muted = !muted;
    muteIcon.textContent = muted ? '♩' : '♪';
  });

  // Prevent anchor click from bubbling weirdly
  document.querySelectorAll('.top, .hints, .credit, .back').forEach(el => {
    el.addEventListener('pointerdown', e => e.stopPropagation());
  });

  // Tutors shortly after load
  setTimeout(showTutors, 600);

  // Kick the loop
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
